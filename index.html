<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=nucleo1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Núcleo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Núcleo</title>
</head>
<body>
<style>
/* Conceito: listas agrupadas como no app Notas do iPhone, letra grande, cores calmas. Amarelo = ação e pastas. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EDEDF1; --line:#E3E3E8;
  --fg:#1C1C1E; --muted:#6B6B73;
  --accent:#F5B800; --accent-fg:#1C1C1E; --link:#8F5E00; --accent-soft:#FAF0D2;
  --alarm:#8A5A00; --alarm-soft:#F8EBCB;
  --ok:#2F7D5B; --ok-fg:#FFFFFF; --ok-soft:#DDF0E6;
  --danger:#B3362B; --danger-soft:#F9E3E0;
  --folder:#E5A800;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#333336;
    --fg:#F5F5F7; --muted:#9A9AA2;
    --accent:#FFD60A; --accent-fg:#1C1C1E; --link:#FFD60A; --accent-soft:#3A3410;
    --alarm:#F0C060; --alarm-soft:#322A12;
    --ok:#5FBF92; --ok-fg:#06251A; --ok-soft:#10301F;
    --danger:#FF8A80; --danger-soft:#3B1613;
    --folder:#FFD60A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#333336;
  --fg:#F5F5F7; --muted:#9A9AA2;
  --accent:#FFD60A; --accent-fg:#1C1C1E; --link:#FFD60A; --accent-soft:#3A3410;
  --alarm:#F0C060; --alarm-soft:#322A12;
  --ok:#5FBF92; --ok-fg:#06251A; --ok-soft:#10301F;
  --danger:#FF8A80; --danger-soft:#3B1613;
  --folder:#FFD60A;
  color-scheme:dark;
}
html{font-size:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.35 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:1rem;color:var(--fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.rl-ring{position:relative;width:min(60vw,16.5rem);margin:1rem auto .6rem}
.rl-ring svg{width:100%;display:block}
.rl-bg{fill:none;stroke:var(--surface-2);stroke-width:9}
.rl-arc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.rl-digits{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.rl-main{font-size:clamp(2.6rem,13vw,4rem);font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rl-main.long{font-size:clamp(2rem,10vw,3.1rem)}
.rl-frac{font-size:clamp(1.3rem,6.5vw,2rem);font-weight:700;color:var(--muted);line-height:1.3;min-height:1.3em;font-variant-numeric:tabular-nums}
.rl-done{text-align:center;font-size:1.6rem;font-weight:800;color:var(--danger);margin:.2rem 0 1rem}
.rl-row{display:flex;gap:.7rem;margin:.9rem 0;flex-wrap:wrap}
.rl-row .btn{flex:1;min-height:3.6rem;font-size:1.15rem}
.rl-btns{display:flex;justify-content:space-around;align-items:center;margin:.8rem 0 1.2rem}
.rl-seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0 0}
.rl-seg .btn{min-height:3.2rem;font-size:1.05rem}
.rl-btn{width:6.2rem;height:6.2rem;border-radius:50%;border:0;font-size:1.05rem;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--fg)}
.rl-btn.go{background:var(--ok);color:var(--ok-fg)}
.rl-btn.stop{background:var(--danger);color:var(--danger-on)}
.rl-btn.ghost{background:transparent;pointer-events:none}
.rl-laps{margin-top:.4rem;border-top:1px solid var(--line)}
.rl-lap{display:grid;grid-template-columns:3.2rem 1fr 1fr;align-items:center;padding:.8rem .3rem;border-bottom:1px solid var(--line);font-size:1.15rem}
.rl-lap b{text-align:center}
.rl-lap span:last-child{text-align:right;color:var(--muted)}
.rl-lh{font-size:.85rem;color:var(--muted);font-weight:700;padding:.5rem .3rem}
.rl-lap.best b{color:var(--ok)}
.rl-lap.worst b{color:var(--danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin-inline:auto}
.page{flex:1;min-height:0;overflow-y:auto;padding:0 1rem 2rem;-webkit-overflow-scrolling:touch}

/* cabeçalho */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;padding:1rem 0 .4rem}
.hd h1{margin:.1rem 0 0;font-size:2rem;line-height:1.1;letter-spacing:-.02em;font-weight:700;overflow-wrap:anywhere}
.eyebrow{font-size:.8rem;color:var(--muted);font-weight:600}
.dateW{font-size:1.9rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.dateW::first-letter{text-transform:uppercase}
.dateD{font-size:1.5rem;font-weight:600;line-height:1.2;margin:.1rem 0 .15rem}
.dateBlock{padding:1rem 0 0}
.eyebrow::first-letter{text-transform:uppercase}
.eyebrow .st{color:var(--alarm)}
.eyebrow .st.bad{color:var(--danger)}
.eyebrow .st.stw{color:var(--alarm);font-weight:700}
.eyebrow .st.ok{color:var(--ok)}
.hd-r{display:flex;align-items:center;gap:.4rem;flex:none}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--link)}
.back{display:inline-flex;align-items:center;gap:.15rem;min-height:2.6rem;padding:0 .4rem 0 0;margin-top:.6rem;border:0;background:none;color:var(--link);font-size:1rem;font-weight:600}

/* seções e listas agrupadas */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:1.4rem .2rem .5rem;min-height:2.2rem}
.sec-h h2{margin:0;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.sec-h .cnt{color:#000}
.cnt.zero{color:var(--fg)}
.sec-h .hint{font-size:.75rem;color:var(--muted);font-weight:500}
.group{background:var(--surface);border-radius:1rem;overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:.75rem;min-height:3.3rem;padding:.6rem 1rem;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.li + .li::before{content:'';position:absolute;top:0;left:var(--inset,1rem);right:0;border-top:1px solid var(--line)}
.li.ic{--inset:3.75rem}
.li.chkd{--inset:3.4rem}
.li.static{cursor:default}
.li-ic{width:2rem;height:2rem;flex:none;display:flex;align-items:center;justify-content:center;color:var(--link)}
.li-ic.folder{color:var(--folder)}
.li-main{flex:1;min-width:0}
.li-t{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.li-s{font-size:.8rem;color:var(--muted);margin-top:.1rem;overflow-wrap:anywhere}
.li-n{color:var(--muted);font-size:1rem;flex:none}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:2rem;padding:0 .5rem;border-radius:999px;background:#39FF14;color:#000;font-size:1rem;font-weight:800;line-height:1;flex:none;box-shadow:0 0 0 1px #39FF14,0 0 .6rem rgba(57,255,20,.8)}
.cnt.sm{min-width:1.7rem;height:1.7rem;padding:0 .4rem;font-size:.85rem}
.cnt.zero{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px #39FF14,0 0 .45rem rgba(57,255,20,.45)}
.li-chev{color:var(--muted);flex:none;display:flex}
.li.done .li-t{text-decoration:line-through;color:var(--muted)}
.li.add{color:var(--link);font-weight:600}
.li.add .li-ic{color:var(--link)}
.tcol{width:3.2rem;flex:none;font-size:.85rem;color:var(--muted);font-weight:600}
.li.alarm .li-t,.li.alarm .tcol{color:var(--alarm)}
.muted-row{color:var(--muted);font-size:.9rem}

/* concluir */
.chk{width:2.6rem;height:2.6rem;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex:none;margin:-.3rem -.3rem -.3rem -.5rem}
.chk-i{width:1.6rem;height:1.6rem;border-radius:50%;border:2.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:var(--ok-fg)}
.chk-i.on{background:var(--ok);border-color:var(--ok)}

/* resumo do dia */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:.8rem}
.tile{border:0;background:var(--surface);border-radius:1rem;padding:.75rem .9rem .8rem;display:flex;flex-direction:column;gap:.35rem;text-align:left;min-height:5.2rem}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-ic{width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--link)}
.tile.t-late .tile-n{color:var(--danger)}
/* quadros de Hoje e Lembretes: cores fortes, como no app Lembretes */
.tile .tile-ic{width:2.4rem;height:2.4rem;color:#fff;background:var(--tc);box-shadow:0 0 14px -2px var(--tc)}
.tile .tile-ic svg{stroke-width:2.6}
.t-blue{--tc:#0A84FF}.t-red{--tc:#FF3B30}.t-green{--tc:#30D158}.t-orange{--tc:#FF9F0A}.t-pink{--tc:#FF2D55}.t-cyan{--tc:#32ADE6}.t-purple{--tc:#BF5AF2}.t-gray{--tc:#8E8E93}
.t-orange .tile-ic,.t-green .tile-ic,.t-cyan .tile-ic{color:#111}
.tile-n{font-size:1.8rem;font-weight:700;line-height:1}
.tile-l{font-size:.85rem;font-weight:700;color:var(--muted)}

/* etiquetas e botões */
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:.2rem .55rem;white-space:nowrap;background:var(--surface-2);color:var(--muted);flex:none;display:inline-flex;align-items:center;gap:.2rem}
.pill.alarm{background:var(--alarm-soft);color:var(--alarm)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.accent{background:var(--accent-soft);color:var(--link)}
.btn{min-height:3rem;border-radius:.9rem;border:0;background:var(--surface);padding:0 .8rem;white-space:nowrap;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;color:var(--link)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn.grow{flex:1}
.btn.wide{width:100%}
.btn.sm{min-height:2.6rem;padding:0 .9rem;font-size:.9rem}
.txtbtn{min-height:2.4rem;padding:0 .3rem;border:0;background:none;font-weight:700;color:var(--link);font-size:.95rem;display:inline-flex;align-items:center;gap:.3rem}
.chip{min-height:2.4rem;padding:0 .85rem;border-radius:999px;border:0;background:var(--surface-2);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem}
.inb-list{display:flex;flex-direction:column;gap:.9rem}
.inb-card{background:var(--surface);border-radius:1.1rem;padding:1rem 1.1rem 1.1rem;border-left:7px solid var(--accent)}
.inb-card .li-t{font-size:1.1rem;font-weight:600}
.inb-card .chip{min-height:2.8rem;font-size:.95rem}
.plan-btn{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:1.1rem;padding:.95rem 1rem 1rem;margin:.2rem 0 .9rem;color:var(--fg)}
.pb-top{display:flex;align-items:center;gap:.75rem}
.pb-ic{color:var(--accent);display:inline-flex}
.pb-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pb-t{font-size:1.25rem;font-weight:800}
.pb-s{font-size:.9rem;color:var(--muted)}
.pb-cnt{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem}
.pb-hoje{font-size:.95rem;font-weight:600}
.pb-late{font-size:.78rem;font-weight:600;color:#FF6B61}
.pb-dots{display:flex;justify-content:space-between;margin-top:.8rem;padding:0 .3rem}
.pb-d{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:2rem}
.pb-d i{font-style:normal;font-size:.8rem;font-weight:700;color:var(--muted)}
.pb-d b{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;font-style:normal;color:var(--accent-fg)}
.pb-d.has b{background:#39FF14;border-color:#39FF14;color:#000;box-shadow:0 0 .5rem rgba(57,255,20,.8)}
.pb-d.now i{color:var(--fg)}
.pb-d.now b{box-shadow:0 0 0 3px var(--accent-soft)}
.pb-d.now.has b{box-shadow:0 0 0 3px var(--accent-soft),0 0 .5rem rgba(57,255,20,.8)}
.pl-card{background:var(--surface);border-radius:1.1rem;padding:.9rem 1.05rem 1rem;margin-bottom:.8rem}
.pl-card.today{box-shadow:inset 0 0 0 2px var(--accent)}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.pl-nm{display:flex;flex-direction:column}
.pl-name{font-weight:800;font-size:1.05rem}
.pl-date{color:var(--muted);font-size:.9rem}
.pl-item{display:flex;gap:.7rem;padding:.4rem 0 0;font-size:1.02rem}
.pl-t{color:var(--muted);min-width:3.1rem;font-variant-numeric:tabular-nums}
.pl-tt{flex:1;min-width:0;overflow-wrap:anywhere}
.pl-free{color:var(--muted);padding-top:.35rem}
.pl-more{color:var(--muted);font-size:.9rem;padding-top:.4rem}
.pl-more.lk{background:none;border:0;color:var(--link);font-weight:700;padding:.5rem 0 0}
.pl-late{background:var(--surface);border-radius:1.1rem;padding:.9rem 1.05rem 1rem;margin-bottom:.8rem;border-left:6px solid #FF6B61}
.pl-lh{display:flex;align-items:center;justify-content:space-between;font-weight:800;color:#FF6B61}
.chip.danger{color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.qcap{display:flex;gap:.5rem;margin:.8rem 0 .2rem}
.qcap input{flex:1;min-width:0;min-height:3.2rem;border-radius:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:0 .9rem;font-size:1.05rem}
.qcap .btn{min-height:3.2rem;padding:0 1.1rem}
.tab{position:relative}
.tri-body{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.tri-card{background:var(--surface);border-radius:1.1rem;padding:1.3rem;font-size:1.45rem;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.tri-btns{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tri-btns .btn{min-height:4.2rem;font-size:1.15rem;white-space:normal}
.li-pills{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .1rem}
.li-main{min-width:0;overflow-wrap:anywhere}
.actbar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.actbar .btn{flex:1 1 9rem;min-width:0;white-space:nowrap}

/* barra de abas */
.tabs{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:.3rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tab{flex:1;min-width:0;min-height:3.3rem;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:min(.72rem,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--muted)}
.tab.on{color:var(--link)}
.fab{width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin:-1.2rem .3rem .2rem;box-shadow:0 2px 10px rgba(0,0,0,.22);flex:none}
.empty{text-align:center;color:var(--muted);padding:1.2rem .8rem;font-size:.9rem}
.empty b{display:block;color:var(--fg);font-size:1rem;margin-bottom:.2rem}

/* alarmes tocando */
.rings{padding:0 1rem;display:flex;flex-direction:column;gap:.4rem}
.ring{display:flex;align-items:center;gap:.6rem;background:var(--alarm-soft);color:var(--alarm);border-radius:1rem;padding:.6rem .5rem .6rem .9rem;margin-top:.5rem}
.ring-t{flex:1;min-width:0}
.ring-t b{display:block;font-size:1rem;overflow-wrap:anywhere}
.ring-t span{font-size:.8rem}

/* semana */
.day-h{display:flex;align-items:center;justify-content:space-between;margin:1.2rem .2rem .45rem;min-height:2.4rem}
.day-h b{font-size:1.1rem;font-weight:800}
.day-h .d{color:var(--muted);font-size:.85rem;margin-left:.4rem;font-weight:600}
.day-h.today b{color:var(--link)}
.group.today{box-shadow:inset 0 0 0 2px var(--accent)}
.plus-sm{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--surface);color:var(--link);display:flex;align-items:center;justify-content:center;padding:0}

/* agenda */
.nav2{display:flex;gap:.4rem}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem}
.navrow .chip{flex:1;justify-content:center;min-height:2.6rem;background:var(--surface);color:var(--link)}
.navrow .iconbtn{width:3rem}
.hd h1.sm{font-size:1.6rem}
.two .inp{min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.15rem;padding:.5rem .4rem .6rem}
.cal-h{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:.3rem 0}
.cal-d{min-height:2.6rem;border-radius:.8rem;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:1rem;font-weight:600;padding:0}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--link);font-weight:800}
.cal-d.sel{background:var(--accent);color:var(--accent-fg);font-weight:800;box-shadow:none}
.cal-d i{width:.3rem;height:.3rem;border-radius:50%;background:currentColor;display:block}
.cal-d i.no{background:transparent}
.cal-d.pmd{min-height:3.2rem}
.cal-d .pm-n{font-size:.85rem;font-weight:800;background:var(--accent);color:var(--accent-fg);border-radius:.7rem;min-width:1.35rem;padding:0 .3rem;line-height:1.25rem}
.cal-d .pm-n.no{background:transparent;color:transparent}
.plan-seg{display:flex;gap:.4rem;margin:.5rem 0}
.plan-seg button{flex:1;min-height:3rem;border:0;border-radius:.9rem;background:var(--surface);color:var(--fg);font:inherit;font-size:1.05rem;font-weight:700}
.plan-seg button.on{background:var(--accent);color:var(--accent-fg)}

/* notas */
.search{display:flex;align-items:center;gap:.5rem;background:var(--surface-2);border-radius:.8rem;padding:0 .8rem;min-height:2.7rem;margin-top:.8rem;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;min-height:2.6rem}
.search.big{min-height:3.3rem;margin-bottom:.4rem}
.search.big input{font-size:1.15rem;min-height:3.1rem;color:var(--fg)}
.thumb{width:2.4rem;height:2.9rem;border-radius:.4rem;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.li.note{--inset:4.15rem}
.notes-tools{display:flex;justify-content:flex-end;gap:.4rem;margin:.1rem 0 .2rem}
.notes-tools.dense{gap:.3rem}
.notes-tools.dense .iconbtn{width:2.3rem;height:2.3rem}
.iconbtn.on{background:var(--accent);color:var(--accent-fg)}
.search .iconbtn{background:none;width:2.4rem;height:2.4rem}

/* mapeia o retângulo de saída (0,0),(W,0),(W,H),(0,H) nos 4 cantos q (em pixels) */
function docHomography(q,W,H){

/* melhora a leitura: tira sombra e "branqueia" o papel. modo: 'color' | 'gray' | 'doc' (preto e branco) */
function docEnhance(rgba,w,h,mode){

/* junta páginas (JPEG) num PDF: pages = [{jpeg:Uint8Array,w,h}] */
function pdfFromJpegs(pages){

  const push=b=>{if(typeof b==='string')b=enc(b);parts.push(b);len+=b.length;};

  offs[2]=len;push('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');

    const pid=3+i*3,cid=pid+1,iid=pid+2,W=595,H=Math.max(1,Math.round(595*p.h/p.w)),cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    offs[pid]=len;push(pid+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
    offs[cid]=len;push(cid+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[iid]=len;push(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpeg.length+' >>\nstream\n');
    push(p.jpeg);push('\nendstream\nendobj\n');

  for(let id=1;id<=total;id++)x+=String(offs[id]).padStart(10,'0')+' 00000 n \n';

/* ---------- ordem das listas: ordenar e mover (funções puras, testáveis) ---------- */
const SORT_LABELS={def:'Padrão',new:'Data: mais recentes',old:'Data: mais antigas',az:'A → Z',za:'Z → A',man:'Minha ordem'};
const hasOrd=x=>typeof x.ord==='number'&&isFinite(x.ord);

function sortGroup(items,mode,g){
  const a=items.slice(),nm=x=>String(g.name(x)||''),cmp=(x,y)=>nm(x).localeCompare(nm(y),'pt-BR',{sensitivity:'base',numeric:true}),dt=x=>+g.date(x)||0;
  if(mode==='az')return a.sort(cmp);
  if(mode==='za')return a.sort((x,y)=>cmp(y,x));
  if(mode==='new')return a.sort((x,y)=>dt(y)-dt(x)||cmp(x,y));
  if(mode==='old')return a.sort((x,y)=>dt(x)-dt(y)||cmp(x,y));

    const ix=new Map(a.map((it,i)=>[it,i])),o=x=>hasOrd(x)?x.ord:Infinity;
    return a.sort((x,y)=>o(x)===o(y)?ix.get(x)-ix.get(y):(o(x)<o(y)?-1:1));

}
function seqOrds(ids,cur){const out=[];ids.forEach((id,i)=>{const o=(i+1)*1000;if(cur.get(id)!==o)out.push({id,ord:o});});return out;}
/* items: como aparecem agora; newIds: a ordem desejada. Devolve só o que precisa mudar: [{id,ord}] */
function ordsForOrder(items,newIds){
  const cur=new Map(items.map(x=>[x.id,x.ord])),ids=items.map(x=>x.id);
  if(ids.join('|')===newIds.join('|'))return [];
  const consistent=items.every(hasOrd)&&items.every((x,i)=>i===0||items[i-1].ord<x.ord);
  if(consistent){
    for(let k=0;k<ids.length;k++){
      const rest=ids.filter((_,i)=>i!==k),nrest=newIds.filter(id=>id!==ids[k]);
      if(rest.length===nrest.length&&rest.every((id,i)=>id===nrest[i])){
        const at=newIds.indexOf(ids[k]),p=at>0?cur.get(newIds[at-1]):null,n=at<newIds.length-1?cur.get(newIds[at+1]):null;
        if(p!=null&&n!=null&&Math.abs(n-p)<1e-6)break;
        let o;if(p==null&&n==null)o=1000;else if(p==null)o=n-1000;else if(n==null)o=p+1000;else o=(p+n)/2;
        return [{id:ids[k],ord:o}];

    }
  }
  return seqOrds(newIds,cur);
}
/* to: 'first' | 'last' | 'up' | 'down' | {index:n} */
function moveOrds(items,id,to){
  const ids=items.map(x=>x.id),from=ids.indexOf(id);if(from<0)return [];
  let at=to==='first'?0:to==='last'?ids.length-1:to==='up'?from-1:to==='down'?from+1:(to&&typeof to.index==='number'?to.index:from);
  at=Math.max(0,Math.min(ids.length-1,at));if(at===from)return [];
  const order=ids.slice();order.splice(from,1);order.splice(at,0,id);
  return ordsForOrder(items,order);
}

const U={stack:[],grp:null,tm:null,mute:0,userAt:0};

function undoLabel(chs){
  const x=chs[0],b=x.before,a=x.after||{},t=a.title||a.name||b.title||b.name||'',nm=UKIND[x.c]||'item',q=t?' «'+t+'»':'';
  if(chs.every(y=>y.after&&uStrip(y.before)===uStrip(y.after)))return 'Mudar a ordem';
  const dels=chs.filter(y=>y.after&&y.after.deletedAt&&!y.before.deletedAt);
  if(dels.length>1&&dels.length===chs.length)return 'Apagar '+dels.length+' itens';
  if(a.deletedAt&&!b.deletedAt)return 'Apagar '+nm+q;
  if(!a.deletedAt&&b.deletedAt)return 'Restaurar '+nm+q;
  if(x.c==='reminders'&&!!b.done!==!!a.done)return (a.done?'Concluir':'Reabrir')+' lembrete'+q;
  if(x.c==='reminders'&&b.list!==a.list)return 'Mover lembrete'+q;

  let ids=(x.images||[]).concat((x.files||[]).map(f=>f.id),Object.values(x.drawSrc||{}));
  /* nunca apagar um arquivo que outro item (ativo ou na lixeira) ainda usa */
  const usado=new Set();

}

function ptVoice(){const v=_voices.length?_voices:loadVoices();return v.find(x=>/^pt[-_]BR/i.test(x.lang)&&x.localService)||v.find(x=>/^pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}
function horaFalada(t){if(!t)return '';const p=t.split(':');const h=+p[0],m=+p[1];return h+(h===1?' hora':' horas')+(m?' e '+m:'');}
/* Leitura em voz alta. No iPhone a fala só começa dentro do toque do usuário, falha se a fila ficou presa
   e perde frases longas: por isso corta em trechos, limpa a fila antes e conta o que realmente falou. */
let speakState={on:false,gen:0};
function speakStop(){speakState.gen++;speakState.on=false;try{if(SY){SY.cancel();}}catch(e){}}
function speakChunks(text){
  const clean=text.replace(/#/g,'').replace(/\s+/g,' ').trim();
  const parts=clean.match(/[^.!?;:\n]+[.!?;:]?\s*/g)||[clean];
  const out=[];let cur='';
  parts.forEach(p=>{if((cur+p).length>160&&cur){out.push(cur);cur=p;}else cur+=p;});
  if(cur.trim())out.push(cur);
  return out;
}
/* som curtinho e mudo: no iPhone, tocar um áudio "liga" o canal de mídia, que não obedece ao botão de silêncio */
let _silentUrl='';
function silentUrl(){
  if(_silentUrl)return _silentUrl;
  const n=1600,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return _silentUrl=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{const au=new Audio(silentUrl());au.setAttribute('playsinline','');au.volume=0.01;const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
}

const RD_HELP='<div class="rd-help"><b>Não saiu som?</b><ol><li>Aumente o volume do iPhone (botões da lateral).</li><li>Se o botão de silêncio estiver ligado, desligue e toque em <b>Ler de novo</b>.</li><li>Se ainda não falar: abra <b>Ajustes › Acessibilidade › Conteúdo Falado</b> e ligue <b>Falar Tela</b>. Depois, com este texto na tela, deslize <b>dois dedos de cima para baixo</b> e o iPhone lê tudo.</li></ol></div>';
function speakRun(text){
  const st=document.getElementById('rd-st'),hp=document.getElementById('rd-help');
  if(hp)hp.innerHTML='';
  if(!SY||!window.SpeechSynthesisUtterance){if(st)st.textContent='Este aparelho não lê em voz alta aqui.';if(hp)hp.innerHTML=RD_HELP;return;}
  unlockAudio();
  const chunks=speakChunks(text||'');
  const gen=++speakState.gen;speakState.on=true;
  try{SY.cancel();}catch(e){}
  const v=ptVoice();
  let started=false,i=0;
  const setSt=t=>{const x=document.getElementById('rd-st');if(x&&gen===speakState.gen)x.textContent=t;};
  const next=()=>{
    if(gen!==speakState.gen)return;
    if(i>=chunks.length){speakState.on=false;setSt('Terminou de ler.');return;}
    const u=new SpeechSynthesisUtterance(chunks[i++]);
    u.lang=v?v.lang:'pt-BR';u.rate=0.95;u.volume=1;if(v)u.voice=v;
    u.onstart=()=>{started=true;setSt('Lendo em voz alta…');};
    u.onend=()=>{next();};
    u.onerror=ev=>{
      if(gen!==speakState.gen)return;
      const er=ev&&ev.error;if(er==='interrupted'||er==='canceled')return;
      speakState.on=false;setSt('Não consegui ler em voz alta.');const h=document.getElementById('rd-help');if(h)h.innerHTML=RD_HELP;
    };
    try{SY.speak(u);if(SY.paused)SY.resume();}catch(e){speakState.on=false;setSt('Não consegui ler em voz alta.');}
  };
  next();
  setTimeout(()=>{if(gen===speakState.gen&&!started&&!SY.speaking){const h=document.getElementById('rd-help');if(h)h.innerHTML=RD_HELP;setSt('Não começou a falar.');}},3000);
}
function speak(text){
  if(document.getElementById('rd')&&speakState.on){speakStop();document.getElementById('rd').remove();return;}
  const t=(text||'').replace(/#/g,'').trim();
  if(!t){toast('Não tem nada para ler.');return;}
  readPanel(t);speakRun(t);
}
function remSpeech(r){
  const today=isoDate(new Date());let t=(r.title||'Lembrete sem título')+'.';
  if(r.date)t+=' '+cap1(relDay(r.date,today).replace(/^(\w{3}), (\d+)\/(\d+)$/,(m,a,d,mo)=>DOWF[DOW3.indexOf(a)]+', dia '+(+d)+' de '+MESES[+mo-1]))+(r.time?', às '+horaFalada(r.time):'')+'.';
  if(repSpec(r))t+=' Repete: '+repLabel(r)+'.';

  if(r.notes)t+=' Observações: '+r.notes;

function daySpeech(iso){
  const today=isoDate(new Date()),d=parseISO(iso),its=dayItems(iso).filter(x=>x.kind!=='alarm');
  const rems=its.filter(x=>x.kind==='rem'&&!x.r.done),evs=its.filter(x=>x.kind==='ev');
  let t=(iso===today?'Hoje, ':'')+DOWF[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+'. ';
  if(!rems.length&&!evs.length)return t+'Nada marcado.';
  if(rems.length)t+=(rems.length===1?'Um lembrete: ':rems.length+' lembretes: ')+rems.map(x=>x.r.title+(x.t?', às '+horaFalada(x.t):'')).join('; ')+'. ';
  if(evs.length)t+='Na agenda: '+evs.map(x=>x.e.title+(x.t?', às '+horaFalada(x.t):'')).join('; ')+'. ';
  if(iso===today){const late=S.reminders.filter(r=>!r.done&&r.date&&r.date<today);if(late.length)t+=(late.length===1?'Um atrasado: ':late.length+' atrasados: ')+late.map(r=>r.title).join('; ')+'. ';if(S.inbox.length)t+=S.inbox.length+(S.inbox.length===1?' item':' itens')+' na caixa de entrada.';}
  return t;
}

  if(kind==='1h'){const t=new Date(now.getTime()+3600e3);const m=Math.ceil(t.getMinutes()/5)*5;t.setMinutes(m,0,0);return {date:isoDate(t),time:pad(t.getHours())+':'+pad(t.getMinutes())};}

const byDT=(a,b)=>(a.done?1:0)-(b.done?1:0)||(b.pinned?1:0)-(a.pinned?1:0)||(a.date||'9999').localeCompare(b.date||'9999')||((b.priority||0)-(a.priority||0))||(a.time||'99:99').localeCompare(b.time||'99:99');
function agendaItems(iso){
  const out=[];
  S.events.forEach(e=>{if(occursOn(e,iso))out.push({kind:'ev',id:e.id,title:e.title,time:e.time||'',rep:repSpec(e)?repLabel(e):''});});
  const ids=finIds();
  S.reminders.forEach(r=>{if(r.agenda&&r.date===iso&&!isFinR(r,ids))out.push({kind:'rem',id:r.id,title:r.title,time:r.time||'',done:r.done});});
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function conflictsFor(date,time,ignoreId){
  if(!date||!time)return [];
  const t=toMin(time);
  return agendaItems(date).filter(x=>x.id!==ignoreId&&x.time&&Math.abs(toMin(x.time)-t)<60).map(x=>x.title+' às '+x.time);
}
function dayItems(iso){
  const out=[],ids=finIds();
  S.reminders.forEach(r=>{
    if(isFinR(r,ids))return;
    if(r.date===iso)out.push({t:r.time||'',kind:'rem',r});
    if(!r.done&&r.date&&r.time&&r.date!==iso)(r.alarms||[]).forEach(a=>{
      const f=alarmFireDate(r,a);
      if(f&&a.min>0&&isoDate(f)===iso)out.push({t:pad(f.getHours())+':'+pad(f.getMinutes()),kind:'alarm',r,a});
    });
  });
  S.events.forEach(e=>{if(occursOn(e,iso))out.push({t:e.time||'',kind:'ev',e});});
  return out.sort((a,b)=>a.t.localeCompare(b.t));

const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','pt',{sensitivity:'base'});
function fmap(){const m={};S.folders.forEach(f=>{m[f.id]=f;});return m;}
function parentOf(f,fm){return f&&f.parent&&f.parent!==f.id&&fm[f.parent]?f.parent:'';}
function noteFolder(n,fm){return n.folder&&fm[n.folder]?n.folder:'';}
function kids(pid,fm){return S.folders.filter(f=>parentOf(f,fm)===pid&&f.id!==pid).sort(byName);}
function countIn(fid,fm,depth){
  depth=depth||0;if(depth>15)return 0;
  let n=S.notes.filter(x=>noteFolder(x,fm)===fid).length;
  if(fid)kids(fid,fm).forEach(k=>{n+=countIn(k.id,fm,depth+1);});
  return n;
}
function pathOf(fid,fm){const out=[];let f=fm[fid],i=0;while(f&&i<15){out.unshift(f.name||'Sem nome');f=fm[parentOf(f,fm)];i++;}return out;}
function treeList(fm,exclude){
  const out=[];
  const walk=(pid,d)=>{if(d>12)return;kids(pid,fm).forEach(f=>{if(f.id===exclude)return;out.push({f,d});walk(f.id,d+1);});};
  walk('',0);return out;
}
function folderOptions(sel,fm,exclude,rootLabel){
  return '<option value="">'+esc(rootLabel)+'</option>'+treeList(fm,exclude).map(o=>'<option value="'+esc(o.f.id)+'"'+(o.f.id===sel?' selected':'')+'>'+'    '.repeat(o.d)+(o.d?'↳ ':'')+esc(o.f.name||'Sem nome')+'</option>').join('');
}
async function deleteFolder(id){
  const fm=fmap(),f=fm[id];if(!f)return '';
  const to=parentOf(f,fm);
  for(const n of (S.raw.notes||[]).filter(x=>x.folder===id))await Store.put('notes',Object.assign({},n,{folder:to}));
  for(const k of S.folders.filter(x=>x.parent===id&&x.id!==id))await Store.put('folders',Object.assign({},k,{parent:to}));
  await Store.del('folders',id);
  return to;
}
const TAGRE=/(^|\s)#((?=[\p{N}_-]*\p{L})[\p{L}\p{N}_-]{2,30})/gu;
function tagsOf(n){const out=new Set();const t=(n.title||'')+' '+(n.body||'');let m;TAGRE.lastIndex=0;while((m=TAGRE.exec(t)))out.add(m[2].toLowerCase());return [...out];}
function allTags(){const c={};S.notes.forEach(n=>tagsOf(n).forEach(t=>{c[t]=(c[t]||0)+1;}));return Object.keys(c).sort().map(t=>[t,c[t]]);}

function leftChip(r){
  if(r.done||!r.date)return '';
  const now=new Date(),today=isoDate(now);
  const fmt=m=>m<60?m+' min':m<1440?Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''):Math.floor(m/1440)+(Math.floor(m/1440)===1?' dia':' dias');
  if(!r.time){
    if(r.date<today){const d=Math.round((parseISO(today)-parseISO(r.date))/864e5);return '<span class="pill danger">atrasado '+d+(d===1?' dia':' dias')+'</span>';}
    return '';
  }
  const diff=dtOf(r.date,r.time)-now,mins=Math.max(1,Math.round(Math.abs(diff)/60000));
  if(diff<0)return '<span class="pill danger">atrasado '+fmt(mins)+'</span>';
  if(diff<864e5)return '<span class="pill">em '+fmt(mins)+'</span>';
  return '';
}

function noteRow(n,fm,showPath){

function subLabel(fid,fm){const k=kids(fid,fm).length;return k?k+(k===1?' subpasta':' subpastas'):'';}
function curFolder(){
  const f=S.folder;if(f===null)return null;
  if(f===''||f.indexOf('v:')===0||f.indexOf('t:')===0)return f;
  return fmap()[f]?f:null;
}
function notesFolders(){
  const fm=fmap();let h='';
    const rk=orderedKids('',fm);
    h+=secH('Pastas','<button class="txtbtn" data-act="new-folder" data-parent="">'+ic('folderPlus',1.1,2.2)+'Nova pasta</button>');
    h+=sortBarFor('folders:');
    h+='<div class="group"'+ordAttr('folders:',true)+'>'+folderRow('','Geral',countIn('',fm),'notas sem pasta')+rk.map(f=>folderRow(f.id,f.name||'Sem nome',countIn(f.id,fm),subLabel(f.id,fm))).join('')+'</div>';
  return h;
}
const NVN={'':'Geral','v:all':'Todas as notas','v:pin':'Fixadas','v:scan':'Scans e documentos','v:draw':'Desenhos','v:files':'Com arquivos'};
function scopeName(cf,fm){
  if(cf===null)return 'todas as notas';
  if(cf.indexOf('t:')===0)return '#'+cf.slice(2);
  if(NVN[cf]!==undefined)return NVN[cf];
  return (fm[cf]&&fm[cf].name)||'esta pasta';
}
/* as notas "de dentro" de onde você está (numa pasta real: ela e todas as subpastas dela) */
function notesScope(cf,fm){
  if(cf===null||cf==='v:all')return S.notes.slice();
  if(cf==='v:pin')return S.notes.filter(n=>n.pinned);
  if(cf==='v:scan')return S.notes.filter(isScan);
  if(cf==='v:draw')return S.notes.filter(isDraw);
  if(cf==='v:files')return S.notes.filter(n=>(n.files||[]).length);
  if(cf.indexOf('t:')===0){const t=cf.slice(2);return S.notes.filter(n=>tagsOf(n).indexOf(t)>=0);}
  if(cf==='')return S.notes.filter(n=>noteFolder(n,fm)==='');
  const ids=new Set([cf]);
  (function add(id,d){if(d>15)return;kids(id,fm).forEach(k=>{ids.add(k.id);add(k.id,d+1);});})(cf,0);
  return S.notes.filter(n=>ids.has(noteFolder(n,fm)));
}
/* uma subpasta na lista: setinha abre/recolhe aqui mesmo; tocar no nome abre a pasta */
function subNode(f,fm,depth){
  const open=!!S.nx[f.id],n=countIn(f.id,fm),k=orderedKids(f.id,fm),nm=f.name||'Sem nome',sl=subLabel(f.id,fm);
  let h='<div class="sub-node"><div class="li ic subrow" data-rid="'+esc(f.id)+'">'
    +'<button class="arrbtn'+(open?' open':'')+'" data-act="nx-sub" data-id="'+esc(f.id)+'" aria-expanded="'+open+'" aria-label="'+(open?'Recolher ':'Abrir ')+esc(nm)+'">'+ic('right',1.05,2.6)+'</button>'
    +'<span class="li-ic folder">'+ic('folder',1.35,1.9)+'</span>'
    +'<div class="li-main" data-act="open-folder" data-id="'+esc(f.id)+'"><div class="li-t">'+esc(nm)+'</div>'+(sl?'<div class="li-s">'+esc(sl)+'</div>':'')+'</div>'
    +cnt(n,0,n+(n===1?' nota':' notas'))+'</div>';
  if(open){
    const direct=ordSort('notes:'+f.id,'notes',S.notes.filter(x=>noteFolder(x,fm)===f.id).sort(noteSort),GN,true);
    h+='<div class="sub-body">'
      +(direct.length?notesList(direct,fm,false,'','notes:'+f.id,true):'')
      +((k.length&&depth<8)?'<div class="group subtree"'+ordAttr('folders:'+f.id,true)+'>'+k.map(c=>subNode(c,fm,depth+1)).join('')+'</div>':'')
      +((!direct.length&&!k.length)?'<div class="sub-empty">Vazia</div>':'')
      +'</div>';
  }
  return h+'</div>';
}
function notesBody(){
  const fm=fmap(),cf=curFolder(),q=S.nsOpen?norm(S.q||'').trim():'';
  if(q){
    const list=notesScope(cf,fm).filter(n=>norm((n.title||'')+' '+(n.body||'')+' '+(n.checklist||[]).map(c=>c.t).join(' ')+' '+(n.files||[]).map(f=>f.name).join(' ')).indexOf(q)>=0).sort(noteSort);
    return secH('Resultados '+cnt(list.length,1),cf!==null?'<span class="hint">em '+esc(scopeName(cf,fm))+'</span>':'')+notesList(list,fm,true,emptyRow('Nada encontrado.','Tente outra palavra.'));
  }
  if(cf===null){
    const pinned=S.notes.filter(n=>n.pinned).length,scans=S.notes.filter(isScan).length,withF=S.notes.filter(n=>(n.files||[]).length).length;
    let h='';
    h+=secH('Ver as notas por tipo');
    h+='<div class="group">'+folderRow('v:all','Todas as notas',S.notes.length,'','note')+folderRow('v:pin','Fixadas',pinned,'','pin')+folderRow('v:scan','Scans e documentos',scans,'','scan')+folderRow('v:draw','Desenhos',S.notes.filter(isDraw).length,'','edit')+folderRow('v:files','Com arquivos',withF,'','clip')+'</div>';
    const tags=allTags();
    h+=secH('Etiquetas','<span class="hint">escreva #palavra na nota</span>');
    h+=tags.length?'<div class="tagchips">'+tags.map(t=>'<button class="chip" data-act="open-folder" data-id="t:'+esc(t[0])+'">#'+esc(t[0])+' '+cnt(t[1],1)+'</button>').join('')+'</div>':'<div class="group">'+emptyRow('','Nenhuma etiqueta ainda. Ex.: #saúde, #casa.')+'</div>';
    const nt=S.trash.filter(t=>t.c==='notes').length;
    h+='<div class="group" style="margin-top:1.2rem">'+folderRow('v:trash','Apagados recentemente',nt,'recupere em até 30 dias','trash','var(--muted)')+'</div>';
    return h;
  }
  const real=!!cf&&cf.indexOf('v:')!==0&&cf.indexOf('t:')!==0;
  if(!real){
    const man0=cf==='',list=ordSort('notes:'+cf,'notes',notesScope(cf,fm).sort(noteSort),GN,man0);
    return secH('Notas '+cnt(list.length,1))+sortBarFor('notes:'+cf)+notesList(list,fm,cf!=='',emptyRow('Pasta vazia.','Crie uma nota ou escaneie um documento.'),'notes:'+cf,man0);
  }
  /* pasta de verdade: primeiro as notas dela (recolhíveis), depois as subpastas */
  const direct=ordSort('notes:'+cf,'notes',S.notes.filter(n=>noteFolder(n,fm)===cf).sort(noteSort),GN,true),ks=orderedKids(cf,fm),open=!S.nn[cf];
  let h='<div class="sec-h"><button class="sec-tog'+(open?' open':'')+'" data-act="nx-notes" data-id="'+esc(cf)+'" aria-expanded="'+open+'" aria-label="'+(open?'Recolher':'Mostrar')+' as notas desta pasta">'+ic('right',1.05,2.6)+'<h2>Notas '+cnt(direct.length,1)+'</h2></button></div>';
  if(open)h+=direct.length?sortBarFor('notes:'+cf)+notesList(direct,fm,false,'','notes:'+cf,true):'<div class="group">'+(ks.length?emptyRow('Nenhuma nota nesta pasta.','Use os botões de cima para criar.'):emptyRow('Pasta vazia.','Crie uma nota ou escaneie um documento.'))+'</div>';
  if(ks.length){
    h+=secH('Subpastas '+cnt(ks.length,1));
    h+=sortBarFor('folders:'+cf);
    h+='<div class="group subtree"'+ordAttr('folders:'+cf,true)+'>'+ks.map(k=>subNode(k,fm,1)).join('')+'</div>';
  }
  return h;
}

/* ---------- Relógio: cronômetro e temporizador ---------- */
const RL_KEY='nucleo-relogio',RL_C=2*Math.PI*90;
const rlSwDef=()=>({run:false,t0:0,acc:0,laps:[]}),rlTmDef=()=>({run:false,end:0,total:300000,left:300000,key:'',done:false});
function rlLoad(){let o={};try{o=JSON.parse(lsGet(RL_KEY)||'{}')||{};}catch(e){}return {mode:o.mode==='tm'?'tm':'sw',sw:Object.assign(rlSwDef(),o.sw||{}),tm:Object.assign(rlTmDef(),o.tm||{})};}
let RL=rlLoad();
function rlSave(){lsSet(RL_KEY,JSON.stringify(RL));}
const swMs=()=>RL.sw.acc+(RL.sw.run?Date.now()-RL.sw.t0:0);
const tmLeft=()=>RL.tm.run?Math.max(0,RL.tm.end-Date.now()):RL.tm.left;
function fmtParts(ms,dec){ms=Math.max(0,ms);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sc=t%60;return {main:(h?h+':'+pad(m):pad(m))+':'+pad(sc),frac:dec?','+pad(Math.floor(ms%1000/10)):'',long:h>0};}
const fmtT=(ms,dec)=>{const p=fmtParts(ms,dec);return p.main+p.frac;};
/* com o app fechado, o aviso do temporizador vem do servidor (mesma via dos lembretes; chega em até 1 minuto depois) */
async function rlAddAlarm(end){
  RL.tm.key='tempo|'+Date.now();rlSave();
  try{if(Store.mode==='supa'&&Supa.sess)await Supa.rest('alarms',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({key:RL.tm.key,fire_at:new Date(end).toISOString(),message:'⏱ Temporizador: acabou o tempo'})});}catch(e){}
}
async function rlDelAlarm(){
  const k=RL.tm.key;RL.tm.key='';rlSave();if(!k)return;
  try{if(Store.mode==='supa'&&Supa.sess)await Supa.rest('alarms?key=eq.'+encodeURIComponent(k),{method:'DELETE'});}catch(e){}
}
function rlWake(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}
function rlRing(){let n=0;const id=setInterval(()=>{beep();if(++n>=6)clearInterval(id);},700);toast('⏱ Acabou o tempo do temporizador');}
const rlFrac=(sw,ms)=>sw?((ms%60000)/60000):(RL.tm.total>0?Math.min(1,ms/RL.tm.total):0);
function rlPaint(){
  if(S.tab!=='relogio')return;
  const sw=RL.mode==='sw',ms=sw?swMs():tmLeft(),p=fmtParts(ms,sw);
  const a=$('rlMain'),f=$('rlFrac'),arc=$('rlArc');
  if(a){a.textContent=p.main;a.classList.toggle('long',p.long);}
  if(f)f.textContent=p.frac;
  if(arc)arc.setAttribute('stroke-dashoffset',(RL_C*(1-rlFrac(sw,ms))).toFixed(2));
}
let rlRaf=0;
function rlLoop(){rlRaf=0;rlTick();}
function rlTick(){
  const t=RL.tm;
  if(t.run&&Date.now()>=t.end){
    const atrasado=Date.now()-t.end>30000;
    t.run=false;t.left=0;t.done=true;rlSave();rlDelAlarm();
    if(!atrasado)rlRing();
    if(S.tab==='relogio')render();
  }
  rlPaint();
  /* números rodando suaves: redesenha a cada quadro enquanto algo está correndo na tela */
  if(S.tab==='relogio'&&(RL.sw.run||RL.tm.run)&&!rlRaf&&typeof requestAnimationFrame==='function')rlRaf=requestAnimationFrame(rlLoop);
}
function rlRing_(sw,ms){
  const p=fmtParts(ms,sw),frac=rlFrac(sw,ms);
  return '<div class="rl-ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="rl-bg" cx="100" cy="100" r="90"/><circle id="rlArc" class="rl-arc"'+(!sw&&RL.tm.done?' style="stroke:var(--danger)"':'')+' cx="100" cy="100" r="90" stroke-dasharray="'+RL_C.toFixed(2)+'" stroke-dashoffset="'+(RL_C*(1-frac)).toFixed(2)+'" transform="rotate(-90 100 100)"/></svg><div class="rl-digits"><div class="rl-main num'+(p.long?' long':'')+'" id="rlMain">'+p.main+'</div><div class="rl-frac num" id="rlFrac">'+p.frac+'</div></div></div>';
}
/* ---------- busca geral (botão da tela Hoje) ---------- */
function searchBtn(){return '<button class="iconbtn" data-act="gs-open" aria-label="Buscar em tudo">'+ic('search',1.2,2.2)+'</button>';}
function gsWords(q){return norm(q||'').split(/\s+/).filter(Boolean);}
function gsHit(text,ws){const t=norm(String(text||''));return ws.every(w=>t.indexOf(w)>=0);}
function gsSnip(text,ws){
  const raw=String(text||'').replace(/\s+/g,' ').trim();if(!raw)return '';
  const n=norm(raw);let at=-1;
  for(const w of ws){const i=n.indexOf(w);if(i>=0&&(at<0||i<at))at=i;}
  if(at<0)return '';
  const a=Math.max(0,at-25),b=Math.min(raw.length,at+80);
  return (a>0?'…':'')+raw.slice(a,b)+(b<raw.length?'…':'');
}
function gsWhy(fields,ws){
  for(const f of fields){
    if(!f[1])continue;
    const t=norm(String(f[1]));
    if(ws.some(w=>t.indexOf(w)>=0))return f[0]+': '+gsSnip(f[1],ws);
  }
  return '';
}
function gsRow(icn,title,sub,why,attrs,done){
  return '<div class="li ic'+(done?' done':'')+'" '+attrs+'><span class="li-ic">'+ic(icn,1.2,2)+'</span><div class="li-main"><div class="li-t">'+esc(title||'Sem título')+'</div>'+(sub?'<div class="li-s">'+esc(sub)+'</div>':'')+(why?'<div class="li-note">'+esc(why)+'</div>':'')+'</div>'+chev()+'</div>';
}
function gsFind(q){
  const ws=gsWords(q),fm=fmap(),lm=lmap(),today=isoDate(new Date()),out={};
  out.rem=S.reminders.filter(r=>gsHit([r.title,r.notes,(r.subtasks||[]).map(x=>x.t).join(' '),(r.files||[]).map(f=>f.name).join(' '),(lm[r.list]&&lm[r.list].name)||''].join(' '),ws))
    .sort((a,b)=>(a.done?1:0)-(b.done?1:0)||byDT(a,b));
  out.ev=S.events.filter(e=>gsHit([e.title,e.notes].join(' '),ws)).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||'')));
  out.note=S.notes.filter(n=>{const fid=noteFolder(n,fm);return gsHit([n.title,n.body,(n.checklist||[]).map(c=>c.t).join(' '),(n.files||[]).map(f=>f.name).join(' '),fid?pathOf(fid,fm).join(' '):''].join(' '),ws);}).sort(noteSort);
  out.inbox=S.inbox.filter(i=>gsHit(i.text,ws));
  out.folder=S.folders.filter(f=>gsHit(f.name,ws));
  out.list=S.lists.filter(l=>gsHit(l.name,ws));
  out.total=out.rem.length+out.ev.length+out.note.length+out.inbox.length+out.folder.length+out.list.length;
  out.ws=ws;
  return out;
}
function gsBody(){
  if(!S.ready)return '<div class="empty">Carregando…</div>';
  const q=S.gq||'',ws=gsWords(q);
  if(norm(q).replace(/\s/g,'').length<2)return '<div class="group">'+emptyRow('Digite pelo menos 2 letras.','Procuro em lembretes, compromissos, notas, anexos, pastas e listas.')+'</div>';
  const r=gsFind(q),fm=fmap(),lm=lmap(),CAP=40,today=isoDate(new Date());
  if(!r.total)return '<div class="group">'+emptyRow('Nada encontrado.','Tente outra palavra ou menos letras.')+'</div>';
  let h='<div class="note-s" style="margin:.2rem .2rem .6rem"><b>'+r.total+'</b> '+(r.total===1?'resultado':'resultados')+' · toque para abrir</div>';
  const sec=(title,arr,fn)=>{if(!arr.length)return;h+=secH(title+' <span class="pill">'+arr.length+'</span>')+'<div class="group">'+arr.slice(0,CAP).map(fn).join('')+(arr.length>CAP?emptyRow('','Mostrando os '+CAP+' primeiros. Digite mais letras para afinar.'):'')+'</div>';};
  sec('Lembretes',r.rem,x=>{
    const bits=[];if(x.done)bits.push('feito');if(x.date)bits.push(relDay(x.date,today));if(x.time)bits.push(x.time);if(lm[x.list]&&lm[x.list].name)bits.push(lm[x.list].name);
    const why=gsWhy([['Observações',x.notes],['Subtarefa',(x.subtasks||[]).map(s=>s.t).filter(Boolean).join('; ')],['Anexo',(x.files||[]).map(f=>f.name).join('; ')]],ws);
    return gsRow(x.done?'check':'bell',x.title,bits.join(' · '),why,'data-act="open-rem" data-id="'+esc(x.id)+'"',x.done);
  });
  sec('Compromissos',r.ev,x=>{
    const bits=[];if(x.date)bits.push(relDay(x.date,today));if(x.time)bits.push(x.time);
    return gsRow('cal',x.title,bits.join(' · '),gsWhy([['Observações',x.notes]],ws),'data-act="open-ev" data-id="'+esc(x.id)+'"');
  });
  sec('Notas',r.note,x=>{
    const fid=noteFolder(x,fm),bits=[fid?pathOf(fid,fm).join(' › '):'Geral'];
    const ts=x.updatedAt||x.createdAt;if(ts)bits.push(relDay(isoDate(new Date(ts)),today));
    const why=gsWhy([['Texto',x.body],['Item',(x.checklist||[]).map(c=>c.t).filter(Boolean).join('; ')],['Arquivo',(x.files||[]).map(f=>f.name).join('; ')]],ws);
    return gsRow(x.kind==='scan'?'scan':((x.checklist||[]).length?'list':'note'),x.title,bits.join(' · '),why,'data-act="open-note" data-id="'+esc(x.id)+'"');
  });
  sec('Caixa de entrada',r.inbox,x=>gsRow('inbox',x.text,x.source?'via '+x.source:'solto','', 'data-act="gs-inbox"'));
  sec('Pastas',r.folder,x=>gsRow('folder',x.name,pathOf(x.id,fm).join(' › ')+' · '+countIn(x.id,fm)+' notas','','data-act="gs-folder" data-id="'+esc(x.id)+'"'));
  sec('Listas',r.list,x=>gsRow('list',x.name,S.reminders.filter(y=>y.list===x.id&&!y.done).length+' lembretes abertos','','data-act="go-rem" data-v="l:'+esc(x.id)+'"'));
  return h;
}

  h+='<div class="search big">'+ic('search',1.15,2.2)+'<label for="gq" class="sr">Buscar em tudo</label><input id="gq" type="search" placeholder="Digite uma palavra" value="'+esc(S.gq)+'" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div>';

function viewRelogio(){
  const sw=RL.sw,tm=RL.tm,rb=(act,cls,label)=>'<button class="rl-btn '+cls+'" data-act="'+act+'">'+label+'</button>';
  let h=subHdr('Hoje','rl-back','Cronômetro e temporizador','Relógio');
  h+='<div class="rl-seg"><button class="btn'+(RL.mode==='sw'?' primary':'')+'" data-act="rl-mode" data-v="sw">Cronômetro</button><button class="btn'+(RL.mode==='tm'?' primary':'')+'" data-act="rl-mode" data-v="tm">Temporizador</button></div>';
  if(RL.mode==='sw'){
    h+=rlRing_(true,swMs());
    h+='<div class="rl-btns">';
    if(sw.run)h+=rb('rl-sw-lap','','Volta')+rb('rl-sw-start','stop','Parar');
    else if(swMs()>0)h+=rb('rl-sw-reset','','Zerar')+rb('rl-sw-start','go','Continuar');
    else h+='<span class="rl-btn ghost"></span>'+rb('rl-sw-start','go','Iniciar');
    h+='</div>';
    if(sw.laps.length){
      const L=sw.laps,dur=L.map((l,i)=>l.t-(L[i+1]?L[i+1].t:0)),best=Math.min.apply(null,dur),worst=Math.max.apply(null,dur);
      h+='<div class="rl-laps"><div class="rl-lap rl-lh"><span>Volta</span><span style="text-align:center">Tempo</span><span>Total</span></div>'+L.map((l,i)=>'<div class="rl-lap num'+(L.length>1?(dur[i]===best?' best':dur[i]===worst?' worst':''):'')+'"><span>'+(L.length-i)+'</span><b>'+fmtT(dur[i],true)+'</b><span>'+fmtT(l.t,true)+'</span></div>').join('')+'</div>';
    }
  }else{

const VAPID_PUB='BBwhnhSGwKGzLFNAknU9aV924oArn5H5kG64vugJ32U_BvIQdLPrtL90qV_qkmPAMhJ52PLod7Ms-nJ1jl3iRoQ';
const b64u=t=>{const r=atob((t+'='.repeat((4-t.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
function pushSupported(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&!!window.Notification;}
function pushStatus(){
  if(Store.mode!=='supa')return {t:'Só funciona conectado à sua conta.',on:false};
  if(!pushSupported())return {t:'Este aparelho ainda não pode receber avisos aqui. No iPhone: abra o Núcleo pelo ícone da Tela de Início (Compartilhar › Adicionar à Tela de Início).',on:false,bad:true};
  if(Notification.permission==='denied')return {t:'Os avisos foram bloqueados. Abra Ajustes do iPhone › Notificações › Núcleo e permita.',on:false,bad:true};
  if(Notification.permission==='granted'&&lsGet('nucleo-push')==='1')return {t:'Ligados neste aparelho.',on:true};
  return {t:'Desligados neste aparelho.',on:false};
}
/* abriu o app: para as repetições do aviso no servidor e limpa as notificações que ficaram na tela */
let lastAck=0;
async function ackAvisos(force){
  if(!force&&Date.now()-lastAck<60000)return;
  lastAck=Date.now();
  try{
    if(Store.mode!=='supa'||!Supa.sess)return;
    await Supa.rest('alarm_repeats?id=not.is.null',{method:'DELETE'});
    if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.ready;const l=await reg.getNotifications();l.forEach(n=>n.close());}
  }catch(e){logErr('parar repetição',e);}
}
async function savePushSub(){
  const reg=await navigator.serviceWorker.ready;
  const want=b64u(VAPID_PUB);
  let sub=await reg.pushManager.getSubscription();
  if(sub){ /* inscrição feita com outra chave (a antiga) não recebe avisos: refaz */
    const cur=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;
    const same=cur&&cur.length===want.length&&cur.every((v,i)=>v===want[i]);
    if(!same){try{await sub.unsubscribe();}catch(e){} sub=null;}
  }
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:want});
  const j=sub.toJSON();
  const r=await Supa.rest('push_subscriptions?on_conflict=endpoint',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({endpoint:j.endpoint,keys:j.keys})});
  if(!r.ok)throw new Error('aparelho '+r.status);
  lsSet('nucleo-push','1');
}
async function enablePush(){
  if(!pushSupported()){toast('Abra o Núcleo pelo ícone da Tela de Início para ligar os avisos.');return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Sem permissão, os avisos não chegam.');renderSheet();return;}
    await savePushSub();toast('Avisos ligados neste aparelho.');
  }catch(e){toast('Não consegui ligar os avisos: '+String(e.message||e).slice(0,80));}
  Supa.alarmRetry=0;lsSet('nucleo-alarmhash','');Supa.syncAlarms();
  if(S.sheet&&S.sheet.type==='set')renderSheet();
}

  try{

    const r=await Supa.rest('alarms',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({key:'teste|'+Date.now(),fire_at:when,message:'Teste do Núcleo: o aviso chegou com o app fechado ✓'})});
    if(!r.ok)throw new Error('erro '+r.status);

   Erros e instruções continuam aparecendo. Nada se perde: apagados ficam 30 dias em "Apagados recentemente". */

function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    S.ac=S.ac||new AC();if(S.ac.state==='suspended')S.ac.resume();
    const o=S.ac.createOscillator(),g=S.ac.createGain();o.connect(g);g.connect(S.ac.destination);
    o.frequency.value=880;g.gain.value=0.08;o.start();o.stop(S.ac.currentTime+0.25);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}

function checkAlarms(){
  if(!S.ready)return;
  const now=Date.now();let nput=0;
  S.reminders.forEach(r=>{
    if(nput>=50)return;
    if(r.done||!r.date||!r.time||!(r.alarms||[]).length)return;
    const key=dueKey(r);let changed=false;
    const alarms=r.alarms.map(a=>{
      if(a.firedFor===key)return a;
      const fk=r.id+'|'+a.id+'|'+key;
      if(S.fired[fk])return a;
      const f=alarmFireDate(r,a).getTime();
      if(now<f)return a;
      S.fired[fk]=1;changed=true;
      if(now-f<36*3600e3){
        const today=isoDate(new Date());
        S.rings.push({rid:r.id,title:r.title,msg:a.msg,when:relDay(r.date,today)+' às '+r.time});
        beep();
      }
      return Object.assign({},a,{firedFor:key});
    });
    if(changed){nput++;Store.put('reminders',Object.assign({},r,{alarms}));renderRings();}
  });
}

/* ---------- imagens na nuvem (Supabase Storage, pasta privada de cada conta) ---------- */
const PIX='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const IMGC={},imgLoading={};
function imgSrc(id){return Store.mode==='supa'?(IMGC[id]||PIX):'/_blob/'+id;}
const SupaAssets={
  uidOf(){try{return JSON.parse(atob(Supa.sess.access.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||'';}catch(e){return '';}},
  async cachePut(id,blob){try{const c=await caches.open('nucleo-img');await c.put('img/'+id,new Response(blob));}catch(e){}},
  async upload(blob,o){
    const tok=await Supa.token(),type=(o&&o.type)||blob.type||'application/octet-stream',ext=(o&&o.ext)||(type==='image/png'?'png':type==='image/jpeg'?'jpg':'bin'),id=this.uidOf()+'/'+newId()+'.'+String(ext).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
    const r=await fetch(CFG.url+'/storage/v1/object/anexos/'+id,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+tok,'Content-Type':type},body:blob});
    if(!r.ok)throw new Error('upload '+r.status);
    if(/^image\//.test(type))IMGC[id]=URL.createObjectURL(blob);
    if(blob.size<8e6)await this.cachePut(id,blob);
    return {id:id};
  },
  async delete(id){
    try{const tok=await Supa.token();await fetch(CFG.url+'/storage/v1/object/anexos/'+id,{method:'DELETE',headers:{apikey:CFG.key,Authorization:'Bearer '+tok}});}catch(e){}
    try{(await caches.open('nucleo-img')).delete('img/'+id);}catch(e){}
  },
  async getBlob(id){
    let blob=null;
    try{const m=await (await caches.open('nucleo-img')).match('img/'+id);if(m)blob=await m.blob();}catch(e){}
    if(!blob){
      const tok=await Supa.token();
      const r=await fetch(CFG.url+'/storage/v1/object/authenticated/anexos/'+id,{headers:{apikey:CFG.key,Authorization:'Bearer '+tok}});
      if(!r.ok)throw new Error('arquivo '+r.status);
      blob=await r.blob();if(blob.size<8e6)await this.cachePut(id,blob);
    }
    return blob;
  },
  async load(id){
    if(IMGC[id])return IMGC[id];
    return IMGC[id]=URL.createObjectURL(await this.getBlob(id));
  }
};
function hydrateImgs(){
  if(Store.mode!=='supa')return;
  document.querySelectorAll('img[data-img]').forEach(el=>{
    const id=el.getAttribute('data-img');
    if(IMGC[id]){if(el.getAttribute('src')!==IMGC[id])el.src=IMGC[id];return;}
    if(imgLoading[id])return;imgLoading[id]=1;
    SupaAssets.load(id).then(u=>{document.querySelectorAll('img[data-img]').forEach(e=>{if(e.getAttribute('data-img')===id)e.src=u;});}).catch(()=>{}).then(()=>{delete imgLoading[id];});
  });
}
new MutationObserver(()=>{clearTimeout(hydrateImgs.t);hydrateImgs.t=setTimeout(hydrateImgs,40);}).observe(document.body,{childList:true,subtree:true});

const DRAW_COLORS=[['#1C1C1E','Preto'],['#5A5A60','Cinza'],['#FFFFFF','Branco'],['#2457A6','Azul'],['#B3362B','Vermelho'],['#2F7D5B','Verde'],['#C77F3F','Laranja'],['#7C6BA6','Roxo'],['#E5A800','Amarelo']];
const DRAW_TOOLS=[['pen','Caneta'],['pencil','Lápis'],['marker','Marca-texto'],['erase','Borracha'],['line','Linha'],['arrow','Seta'],['rect','Retângulo'],['ellipse','Círculo']];
const DRAW_BG=[['grid','Quadriculado'],['dots','Pontilhado'],['lines','Pautado'],['plain','Liso'],['dark','Quadro escuro']];
function paintBg(c,W,H,bg){
  c.save();c.fillStyle=bg==='dark'?'#1E2124':'#FFFFFF';c.fillRect(0,0,W,H);
  const g=30;
  if(bg==='grid'||bg==='dark'){c.strokeStyle=bg==='dark'?'rgba(255,255,255,.14)':'#D0DAE6';c.lineWidth=1.5;c.beginPath();for(let x=g;x<W;x+=g){c.moveTo(x+.5,0);c.lineTo(x+.5,H);}for(let y=g;y<H;y+=g){c.moveTo(0,y+.5);c.lineTo(W,y+.5);}c.stroke();
    if(bg==='grid'){c.strokeStyle='#B3C2D6';c.beginPath();for(let x=g*5;x<W;x+=g*5){c.moveTo(x+.5,0);c.lineTo(x+.5,H);}for(let y=g*5;y<H;y+=g*5){c.moveTo(0,y+.5);c.lineTo(W,y+.5);}c.stroke();}}
  else if(bg==='dots'){c.fillStyle='#B9C3D0';for(let x=g;x<W;x+=g)for(let y=g;y<H;y+=g){c.beginPath();c.arc(x,y,1.6,0,Math.PI*2);c.fill();}}
  else if(bg==='lines'){c.strokeStyle='#CFDAE8';c.lineWidth=1.2;c.beginPath();for(let y=48;y<H;y+=36){c.moveTo(0,y);c.lineTo(W,y);}c.stroke();c.strokeStyle='#E8B4B0';c.beginPath();c.moveTo(70,0);c.lineTo(70,H);c.stroke();}
  c.restore();
}
function drawStroke(c,s){
  const p=s.p;if(!p||!p.length)return;
  c.save();
  c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
  if(s.t==='erase'){c.globalCompositeOperation='destination-out';c.strokeStyle=c.fillStyle='#000';}
  if(s.t==='marker'){c.globalAlpha=.35;c.lineCap='butt';}
  if(s.t==='pencil')c.globalAlpha=.85;
  const w=s.t==='marker'?s.w*3:s.t==='erase'?s.w*2.5:s.t==='pencil'?Math.max(1,s.w*.6):s.w;
  c.lineWidth=w;
  if(s.t==='line'||s.t==='arrow'||s.t==='rect'||s.t==='ellipse'){
    const a=p[0],b=p[p.length-1];c.beginPath();
    if(s.t==='rect')c.rect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));
    else if(s.t==='ellipse')c.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2||.1,Math.abs(b[1]-a[1])/2||.1,0,0,Math.PI*2);
    else{c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
      if(s.t==='arrow'){const an=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.max(14,w*4);c.moveTo(b[0],b[1]);c.lineTo(b[0]-L*Math.cos(an-.45),b[1]-L*Math.sin(an-.45));c.moveTo(b[0],b[1]);c.lineTo(b[0]-L*Math.cos(an+.45),b[1]-L*Math.sin(an+.45));}}
    c.stroke();c.restore();return;
  }
  if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],w/2,0,Math.PI*2);c.fill();c.restore();return;}
  if(s.t==='pen'){
    /* largura acompanha a pressão da Apple Pencil, com curvas suaves */
    const pw=i=>w*(.35+1.3*(p[i][2]==null?.5:p[i][2]));
    let px=p[0][0],py=p[0][1];
    for(let i=1;i<p.length;i++){
      const mx=i<p.length-1?(p[i][0]+p[i+1][0])/2:p[i][0],my=i<p.length-1?(p[i][1]+p[i+1][1])/2:p[i][1];
      c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(p[i][0],p[i][1],mx,my);c.lineWidth=(pw(i-1)+pw(i))/2;c.stroke();px=mx;py=my;
    }
  }else{
    c.beginPath();c.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;c.quadraticCurveTo(p[i][0],p[i][1],mx,my);}
    const l=p[p.length-1];c.lineTo(l[0],l[1]);c.stroke();
  }
  c.restore();
}

  box.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;

    if(gest){
      const a=[...ptrs.values()].filter(p=>p.type==='touch'),r=box.getBoundingClientRect();
      if(a.length>=2&&gest.d){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
        const z=Math.max(view.z0*.8,Math.min(view.z0*6,gest.z*d/gest.d));const cx=gest.mx-r.left,cy=gest.my-r.top;
        view.x=cx-(cx-gest.x)*z/gest.z+(mx-gest.mx);view.y=cy-(cy-gest.y)*z/gest.z+(my-gest.my);view.z=z;applyView();}
      else if(a.length===1){view.x=gest.x+(a[0].x-gest.mx);view.y=gest.y+(a[0].y-gest.my);applyView();}
      return;
    }
    if(!st.cur)return;
    const shape=['line','arrow','rect','ellipse'].indexOf(st.cur.t)>=0;
    const evs=(!shape&&e.getCoalescedEvents)?e.getCoalescedEvents():[e];
    evs.forEach(x=>{const q=pos(x).concat(pres(x));if(shape)st.cur.p[1]=q;else{const l=st.cur.p[st.cur.p.length-1];if(Math.abs(l[0]-q[0])+Math.abs(l[1]-q[1])>=.6)st.cur.p.push(q);}});
    if(st.cur.t==='erase'){const p=st.cur.p;drawStroke(xm,{t:'erase',c:'#000',w:st.cur.w,p:p.slice(-3)});}
    else live();
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(gest){if(!ptrs.size)gest=null;else startGesture();return;}
    if(st.cur){if(st.cur.p.length>1||['line','arrow','rect','ellipse'].indexOf(st.cur.t)<0){st.strokes.push(st.cur);st.redo=[];if(st.cur.t!=='erase')drawStroke(xm,st.cur);else rebuild();}st.cur=null;live();paint();}
  };
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('wheel',e=>{e.preventDefault();const r=box.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
    if(e.ctrlKey||e.metaKey){const z=Math.max(view.z0*.8,Math.min(view.z0*6,view.z*Math.exp(-e.deltaY/300)));view.x=cx-(cx-view.x)*z/view.z;view.y=cy-(cy-view.y)*z/view.z;view.z=z;}
    else{view.x-=e.deltaX;view.y-=e.deltaY;}
    applyView();},{passive:false});
  const close=()=>{removeEventListener('resize',fit);el.remove();};
  el.addEventListener('input',e=>{const k=e.target.dataset.dwIn;if(!k)return;
    if(k==='size')st.size=+e.target.value;
    else if(k==='color'){st.color=e.target.value;if(st.tool==='erase')st.tool='pen';}
    else if(k==='bg'){st.bg=e.target.value;paintBgNow();if(st.bg==='dark'&&st.color==='#1C1C1E')st.color='#FFFFFF';if(st.bg!=='dark'&&st.color==='#FFFFFF')st.color='#1C1C1E';}
    savePref();paint();});
  el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-dw]');if(!b)return;const a=b.dataset.dw;

    else if(a==='color'){st.color=b.dataset.v;if(st.tool==='erase')st.tool='pen';savePref();paint();}
    else if(a==='undo'){if(st.strokes.length){st.redo.push(st.strokes.pop());rebuild();paint();}}
    else if(a==='redo'){if(st.redo.length){st.strokes.push(st.redo.pop());rebuild();paint();}}
    else if(a==='fit')fit();
    else if(a==='clear'){if(!st.strokes.length)return;if(await ask({title:'Limpar o desenho?',msg:'Tudo o que foi desenhado será apagado. Dá para voltar com Desfazer enquanto não sair.',ok:'Limpar',danger:true})){st.redo=st.strokes.reverse();st.strokes=[];rebuild();paint();}}
    else if(a==='cancel'){if(st.strokes.length!==((init&&init.strokes)||[]).length||st.redo.length){if(!(await ask({title:'Sair sem salvar o desenho?',msg:'As mudanças no desenho serão perdidas.',ok:'Sair sem salvar',cancel:'Continuar desenhando',danger:true})))return;}close();}
    else if(a==='save'){
      if(!st.strokes.length){toast('Desenhe algo primeiro.');return;}
      if(confirmAll()&&!(await ask({title:'Salvar este desenho?',msg:'Ele fica anexado à nota.',ok:'Salvar desenho'})))return;
      const out=document.createElement('canvas');out.width=cm.width;out.height=cm.height;const xo=out.getContext('2d');xo.setTransform(K,0,0,K,0,0);paintBg(xo,W,H,st.bg);xo.setTransform(1,0,0,1,0,0);xo.drawImage(cm,0,0);
      const blob=await new Promise(res=>out.toBlob(res,'image/png'));
      const data=JSON.stringify({v:1,W:W,H:H,bg:st.bg,strokes:st.strokes});

    }
  });

}
async function saveDrawing(res,target,oldId){
  const a=await getAssets();
  if(!a){toast('Salvar desenhos precisa de conexão com a nuvem.');return;}
  toast('Salvando o desenho…');
  let id,src='';
  try{id=(await a.upload(res.blob,{type:'image/png'})).id;}
  catch(e){toast('Não consegui salvar o desenho agora. Confira a internet e tente de novo.');return;}
  if(Store.mode==='supa'){try{src=(await a.upload(new Blob([res.data],{type:'application/json'}),{type:'application/json',ext:'json'})).id;}catch(e){src='';}}
  const put=(n)=>{const imgs=(n.images||[]).slice(),ds=Object.assign({},n.drawSrc||{}),gone=[];
    const k=oldId?imgs.indexOf(oldId):-1;
    if(k>=0){imgs[k]=id;gone.push(oldId);if(ds[oldId])gone.push(ds[oldId]);delete ds[oldId];}else imgs.push(id);
    if(src)ds[id]=src;return {imgs,ds,gone};};
  if(target==='new'){
    const now=new Date(),title='Desenho de '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    const doc=Object.assign(newNote(S.pendingFolder||''),{title:title,kind:'desenho',images:[id],drawSrc:src?{[id]:src}:{},updatedAt:Date.now()});
    const nid=await Store.put('notes',doc);const n=S.notes.find(x=>x.id===nid);
    if(n)openSheet('notev',clone(n));toast('Desenho salvo. Toque em Editar para dar um nome.');
  }else if(target==='view'){
    const sh=S.sheet,n=sh&&S.notes.find(x=>x.id===sh.draft.id);if(!n)return;
    const r=put(n);await Store.put('notes',Object.assign({},n,{images:r.imgs,drawSrc:r.ds,updatedAt:Date.now()}));
    r.gone.forEach(g=>a.delete(g).catch(()=>{}));refreshView('notes',n.id);toast('Desenho atualizado');
  }else if(S.sheet){
    const sh=S.sheet,r=put(sh.draft);sh.draft.images=r.imgs;sh.draft.drawSrc=r.ds;
    sh.added=(sh.added||[]).concat(id,src?[src]:[]);
    r.gone.forEach(g=>{if(sh.added.indexOf(g)>=0){sh.added=sh.added.filter(x=>x!==g);a.delete(g).catch(()=>{});}else sh.removed.push(g);});
    if(sh.draft.kind==='nota'&&!(sh.draft.body||'').trim())sh.draft.kind='desenho';
    renderSheet();toast(oldId?'Desenho atualizado. Toque em Salvar.':'Desenho anexado. Toque em Salvar para guardar.');
  }
}
async function editDrawing(imgId,target){

/* mostra o texto de nota/observação com títulos (#), marcadores (- * •), números e rótulos (Placa: …). O texto salvo NÃO muda. */
function fmtText(raw){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const kv=(t,item)=>{let m=/^([A-Za-zÀ-ÿ][^:*]{0,34}):\s+(.+)$/.exec(t);if(m)return '<b class="fl">'+inl(m[1])+':</b> '+inl(m[2]);m=item?/^([A-Za-zÀ-ÿ][^:*]{0,34}):$/.exec(t):null;return m?'<b class="fl">'+inl(m[1])+':</b> <span class="fe">—</span>':inl(t);};
  let h='';
  String(raw==null?'':raw).replace(/\r/g,'').split('\n').forEach(line=>{
    const l=line.replace(/\s+$/,'');
    if(!l.trim()){h+='<div class="fs"></div>';return;}
    let m;
    if((m=/^\s*(#+)\s+(.+)$/.exec(l))){h+='<div class="fh">'+inl(m[2])+'</div>';return;}
    if((m=/^\s*[-*•]\s+(.+)$/.exec(l))){h+='<div class="fb"><span class="fd">•</span><span class="ft">'+kv(m[1],true)+'</span></div>';return;}
    if((m=/^\s*(\d{1,2}[.)])\s+(.+)$/.exec(l))){h+='<div class="fb"><span class="fd">'+esc(m[1])+'</span><span class="ft">'+kv(m[2])+'</span></div>';return;}
    h+='<div class="fp">'+kv(l.trim())+'</div>';
  });
  return h;
}

/* alarme forte: cria o alarme no Relógio do iPhone por um Atalho chamado "Alarme Núcleo".
   O Relógio só aceita alarme nas próximas 24 horas (ele toca na próxima vez que der aquele horário). */
const CLOCK_SHORTCUT='Alarme Núcleo';
function clockAlarm(r,a,now){
  const f=alarmFireDate(r,a);if(!f)return {erro:'Esse lembrete não tem data e hora.'};
  const dt=f.getTime()-(now||Date.now());
  if(dt<=0)return {erro:'Esse horário já passou.'};
  if(dt>864e5)return {erro:'O Relógio só aceita alarme nas próximas 24 horas.'};
  /* minutos a partir de agora + título: o atalho soma os minutos à hora atual (não depende de o iPhone entender data).
     O Relógio toca na próxima vez que der aquele horário (por isso o limite de 24 horas). */
  const mins=Math.max(1,Math.ceil(dt/60000)),hh=pad(f.getHours())+':'+pad(f.getMinutes()),txt=mins+'|'+String(r.title||'Lembrete').replace(/\|/g,'/').slice(0,60);
  return {texto:txt,hora:hh,quando:f.getTime(),url:'shortcuts://run-shortcut?name='+encodeURIComponent(CLOCK_SHORTCUT)+'&input=text&text='+encodeURIComponent(txt)};
}
function clockBtn(r,ix){
  const a=(r.alarms||[])[ix];if(!a||r.done||!r.date||!r.time)return '';
  return clockAlarm(r,a).url?'<button class="chip" style="margin-top:.5rem" data-act="clock-alarm" data-i="'+ix+'">⏰ Alarme no Relógio</button>':'';
}
function pickClock(r,now){
  const arr=(r.alarms&&r.alarms.length)?r.alarms:[{min:0}];
  const ok=arr.map(a=>clockAlarm(r,a,now)).filter(x=>x.url);
  if(!ok.length)return null;
  ok.sort((x,y)=>x.quando-y.quando);
  return ok[0];
}

const CAPL={rem:'Lembrete',ev:'Compromisso',note:'Nota',inbox:'Caixa de entrada'};

function capSummary(d){

  let when='';

async function prepareImage(file,bw){
  const MAX=1800;let bmp;
  try{bmp=await createImageBitmap(file);}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,k=Math.min(1,MAX/Math.max(w0,h0));
  const w=Math.round(w0*k),h=Math.round(h0*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,w,h);
  if(bw){const im=cx.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];const v=Math.max(0,Math.min(255,(g-120)*1.6+135));d[i]=d[i+1]=d[i+2]=v;}cx.putImageData(im,0,0);}
  return await new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.85));
}
async function onFiles(inp){
  const files=Array.from(inp.files||[]);if(!files.length)return;
  const assets=await getAssets();
  if(!assets){toast('Anexar fotos precisa de permissão de edição neste navegador.');return;}
  const bwEl=$('bw'),bw=bwEl?bwEl.checked:S.bw;
  const target=S.pendingNew?'new':'sheet';
  toast('Enviando '+(files.length>1?files.length+' fotos…':'a foto…'));
  const ids=[];
  for(const f of files){
    try{
      const blob=await prepareImage(f,bw);
      const res=await assets.upload(blob,{type:'image/jpeg'});ids.push(res.id);
    }catch(e){toast('Não consegui enviar uma das fotos.');}
  }
  if(!ids.length){S.pendingNew=false;return;}
  if(target==='new'){
    S.pendingNew=false;
    const now=new Date(),title='Scan de '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    const doc=Object.assign(newNote(S.pendingFolder||''),{title,kind:'scan',images:ids,updatedAt:Date.now()});
    const id=await Store.put('notes',doc);
    const n=S.notes.find(x=>x.id===id)||Object.assign({id},doc);
    openSheet('note',clone(n));toast('Scan salvo. Dê um nome se quiser.');
  }else if(S.sheet){
    S.sheet.draft.images=(S.sheet.draft.images||[]).concat(ids);S.sheet.added=(S.sheet.added||[]).concat(ids);
    if(S.sheet.type==='note'&&bw&&S.sheet.draft.kind==='nota')S.sheet.draft.kind='scan';
    renderSheet();toast('Foto anexada');
  }
}

async function loadScanImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    const W0=img.naturalWidth,H0=img.naturalHeight,k=Math.min(1,2000/Math.max(W0,H0)),w=Math.round(W0*k),h=Math.round(H0*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    return {cv,w,h};
  }finally{URL.revokeObjectURL(url);}
}

/* ---- vencimentos das fichas: linhas "Vencimento…: dd/mm/aaaa" ou "Validade…: dd/mm/aaaa" viram lembrete 1 dia antes, às 09:00, com alarme ---- */
const FIC_RE=/^\s*(?:[-*•]\s*)?((?:Vencimento|Validade|Vence)[^:\n]{0,40}):\s*(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/i;
const FIC_LIST='Vencimentos das fichas';
function ficDates(note){
  const out=[],seen={};
  String(note.body||'').split('\n').forEach(line=>{
    const m=FIC_RE.exec(line);if(!m)return;
    const d=+m[2],mo=+m[3];let y=+m[4];if(y<100)y+=2000;
    const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return;
    const label=m[1].replace(/\s+/g,' ').trim(),key=label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(seen[key])return;seen[key]=1;
    out.push({key,label,due:isoDate(dt)});
  });
  return out;
}
function ficWanted(today){
  const want={};
  S.notes.forEach(n=>{ficDates(n).forEach(f=>{
    let rem=isoDate(new Date(new Date(f.due+'T12:00:00').getTime()-864e5));
    if(rem<today&&f.due>=today)rem=f.due;
    const p=f.due.split('-'),ref=n.id+'|'+f.key+'|'+f.due;
    want[ref]={ref,due:f.due,date:rem,expired:f.due<today,title:(n.title||'Ficha')+' — '+f.label+' ('+p[2]+'/'+p[1]+'/'+p[0]+')'};
  });});
  return want;
}
let _ficBusy=false,_ficSig='';
async function ficSync(force){

async function ficSync2(force){
  const today=isoDate(new Date()),want=ficWanted(today);
  const sig=JSON.stringify(Object.keys(want).sort().map(k=>[k,want[k].title]))+'|'+S.reminders.filter(r=>r.ficRef).map(r=>r.id+r.title).join(',')+'|'+S.trash.filter(t=>t.c==='reminders'&&t.x.ficRef).length;
  if(!force&&sig===_ficSig)return;
  _ficBusy=true;
  try{
    const live={};S.reminders.filter(r=>r.ficRef).forEach(r=>{live[r.ficRef]=r;});
    const gone=new Set(S.trash.filter(t=>t.c==='reminders'&&t.x.ficRef).map(t=>t.x.ficRef));
    for(const ref of Object.keys(live)){if(!want[ref])await softDelete('reminders',live[ref]);}
    const make=Object.keys(want).filter(k=>!live[k]&&!gone.has(k)&&!want[k].expired);
    let listId='';
    if(make.length){
      const l=S.lists.find(x=>x.name===FIC_LIST&&!x.fin);
      listId=l?l.id:await Store.put('lists',{name:FIC_LIST,color:LCOL[2],sections:[],createdAt:Date.now()});
    }
    for(const ref of make){
      const w=want[ref];
      await Store.put('reminders',Object.assign(newRem(w.date,listId),{title:w.title,time:'09:00',priority:2,alarms:[{min:0}],ficRef:ref,ficDue:w.due,notes:'Criado sozinho pela ficha. Se você mudar a data na ficha, este lembrete acompanha.'}));
    }
    for(const ref of Object.keys(live)){
      const w=want[ref];if(w&&live[ref].title!==w.title)await Store.put('reminders',Object.assign({},live[ref],{title:w.title}));
    }
  }catch(e){logErr('fichas',e);}
  _ficSig=sig;_ficBusy=false;
}

async function importBackup(file){
  let o;
  try{o=JSON.parse(await file.text());}catch(e){toast('Esse arquivo não é um backup válido.');return;}
  const map={reminders:'reminders',lembretes:'reminders',notes:'notes',notas:'notes',events:'events',compromissos:'events',inbox:'inbox',caixaDeEntrada:'inbox',folders:'folders',pastas:'folders',lists:'lists',listas:'lists'};
  const todo=[];
  Object.keys(map).forEach(k=>{
    const v=o[k];if(!v)return;
    const arr=Array.isArray(v)?v:Object.keys(v).map(id=>Object.assign({id},v[id]));
    arr.forEach(x=>{if(x&&x.id&&!(S.raw[map[k]]||[]).some(y=>y.id===x.id)&&!todo.some(t=>t.c===map[k]&&t.x.id===x.id))todo.push({c:map[k],x});});
  });
  if(!todo.length){toast('Nada novo para importar.');return;}
  const fotos=todo.reduce((n,t)=>n+((t.x.images||[]).length),0);
  if(!(await ask({title:'Importar '+todo.length+' itens?',msg:'Os itens do arquivo entram no Núcleo. O que já existe não é mexido.'+(fotos?' As '+fotos+' foto(s) do arquivo ainda não vêm junto: ficam para a etapa das fotos.':''),ok:'Importar'})))return;
  for(const t of todo){const d=Object.assign({},t.x);if(d.images&&d.images.length){d.images=[];d.body=(d.body?d.body+'\n':'')+'(foto do scan será trazida na etapa das fotos)';}await Store.put(t.c,d);}
  toast(todo.length+' itens importados');
}

  const t=e.target;
  if(t.id==='q'){S.q=t.value;const b=$('notesBody');if(b)b.innerHTML=notesBody();const nf=$('notesFolders');if(nf)nf.style.display=S.q?'none':'';return;}

  if(t.id==='gq'){S.gq=t.value;const b=$('gsBody');if(b)b.innerHTML=gsBody();return;}
  if(!S.sheet)return;
  if(t.dataset.bind!==undefined){
    setSheetField(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
    if(S.sheet.type==='cap'){const p=$('capPrev');if(p)p.innerHTML=capPreviewHtml(S.sheet.draft);const cb=document.querySelector('[data-act="cap-clock"]');if(cb){const dd=S.sheet.draft,onC=dd.clock===undefined?!!(dd.text&&parseCapture(dd.text).strong):!!dd.clock;cb.textContent=onC?'⏰ Alarme no Relógio: LIGADO':'⏰ Criar também no Relógio';cb.setAttribute('aria-pressed',String(onC));}}
  }else if(t.dataset.subText!==undefined){S.sheet.draft[t.dataset.subK][+t.dataset.subText].t=t.value;}
  else if(t.dataset.alMsg!==undefined){const a=S.sheet.draft.alarms.find(x=>x.id===t.dataset.alMsg);if(a)a.msg=t.value;}
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileCam'||t.id==='fileLib'){onFiles(t);return;}
  if(t.id==='fileScan'){onScanDoc(t);return;}
  if(t.id==='fileAny'){onAnyFiles(t);return;}
  if(t.id==='bw'){S.bw=t.checked;lsSet('ms-bw',S.bw?'1':'0');return;}
  if(!S.sheet)return;
  if(t.dataset.bind!==undefined){
    setSheetField(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
    if(t.dataset.bind==='list'&&S.sheet.type==='rem')S.sheet.draft.section='';
    if(t.dataset.rerender!==undefined){
      if(t.dataset.bind==='time'&&S.sheet.type==='rem')setAlarmsAuto(S.sheet.draft);
      renderSheet();
    }
  }
});

<script>
/* Voltar sempre à mão: com a tela ampliada (zoom), o botão de voltar da própria tela pode sair da área visível.
   Nesse caso aparece este botão flutuante, preso à parte visível da tela, e ele aciona o voltar da tela de cima. */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const fab=document.createElement('button');
  fab.type='button';fab.id='backFab';fab.setAttribute('aria-label','Voltar');fab.textContent='← Voltar';
  fab.style.cssText='position:fixed;left:0;top:0;z-index:2147483000;display:none;min-height:3.4rem;padding:0 1.4rem;font:inherit;font-size:1.2rem;font-weight:800;border:0;border-radius:1rem;background:#ffd60a;color:#000;box-shadow:0 6px 20px rgba(0,0,0,.55);transform-origin:0 0';
  document.body.appendChild(fab);
  const SEL=['.ask-bg .btn.cancel','#viewer:not([hidden]) [data-act="close-viewer"]','.fview [data-fv="close"]','#draw [data-dw="cancel"]','#rd [data-rd="close"]','#finSend #finNo','.sheet [data-act="close-sheet"]','#main button.back'];
  function alvo(){for(const s of SEL){const l=document.querySelectorAll(s);if(l.length)return l[l.length-1];}return null;}
  function pos(){
    const a=vv.scale>1.05?alvo():null;
    if(!a){fab.style.display='none';return;}
    fab.style.display='block';
    fab.style.transform='translate('+(vv.offsetLeft+8/vv.scale)+'px,'+(vv.offsetTop+8/vv.scale)+'px) scale('+(1/vv.scale)+')';
  }
  vv.addEventListener('resize',pos);vv.addEventListener('scroll',pos);setInterval(pos,500);
  fab.addEventListener('click',e=>{e.preventDefault();const a=alvo();if(a)a.click();setTimeout(pos,50);});
})();
</script>
