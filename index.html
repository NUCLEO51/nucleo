<title>Meu Sistema</title>
<style>
/* Conceito: listas agrupadas como no iPhone, letra grande, um assunto por bloco. Azul = ação, amarelo = pastas, âmbar = alarmes. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#E9E9EE; --line:#D8D8DE;
  --fg:#111114; --muted:#5E5E66;
  --accent:#0060DF; --accent-fg:#FFFFFF; --accent-soft:#E3EDFD;
  --alarm:#8A4B0B; --alarm-soft:#FCEFD3;
  --ok:#0B6B4D; --ok-fg:#FFFFFF; --ok-soft:#D5F1E4;
  --danger:#B42318; --danger-soft:#FCE3E0;
  --folder:#D49A00;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A;
    --fg:#F5F5F7; --muted:#A1A1A9;
    --accent:#5AA0FF; --accent-fg:#001A3D; --accent-soft:#13284A;
    --alarm:#F3C26B; --alarm-soft:#3A2A0D;
    --ok:#5FD3A3; --ok-fg:#06251A; --ok-soft:#0F3326;
    --danger:#FF8A80; --danger-soft:#3B1613;
    --folder:#F2C14E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A;
  --fg:#F5F5F7; --muted:#A1A1A9;
  --accent:#5AA0FF; --accent-fg:#001A3D; --accent-soft:#13284A;
  --alarm:#F3C26B; --alarm-soft:#3A2A0D;
  --ok:#5FD3A3; --ok-fg:#06251A; --ok-soft:#0F3326;
  --danger:#FF8A80; --danger-soft:#3B1613;
  --folder:#F2C14E;
  color-scheme:dark;
}
html{font-size:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.35 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:1rem;color:var(--fg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin-inline:auto}
.page{flex:1;min-height:0;overflow-y:auto;padding:0 1rem 2rem;-webkit-overflow-scrolling:touch}

/* cabeçalho */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;padding:1rem 0 .4rem}
.hd h1{margin:.1rem 0 0;font-size:1.9rem;line-height:1.1;letter-spacing:-.02em;font-weight:800;overflow-wrap:anywhere}
.eyebrow{font-size:.8rem;color:var(--muted);font-weight:600}
.eyebrow::first-letter{text-transform:uppercase}
.eyebrow .st{color:var(--alarm)}
.eyebrow .st.bad{color:var(--danger)}
.hd-r{display:flex;align-items:center;gap:.4rem;flex:none}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:.15rem;min-height:2.6rem;padding:0 .4rem 0 0;margin-top:.6rem;border:0;background:none;color:var(--accent);font-size:1rem;font-weight:600}

/* seções e listas agrupadas */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:1.4rem .2rem .5rem;min-height:2.2rem}
.sec-h h2{margin:0;font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
.sec-h .hint{font-size:.75rem;color:var(--muted);font-weight:500}
.group{background:var(--surface);border-radius:1rem;overflow:hidden}
.li{position:relative;display:flex;align-items:center;gap:.75rem;min-height:3.3rem;padding:.6rem 1rem;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.li + .li::before{content:'';position:absolute;top:0;left:var(--inset,1rem);right:0;border-top:1px solid var(--line)}
.li.ic{--inset:3.75rem}
.li.chkd{--inset:3.4rem}
.li.static{cursor:default}
.li-ic{width:2rem;height:2rem;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.li-ic.folder{color:var(--folder)}
.li-main{flex:1;min-width:0}
.li-t{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.li-s{font-size:.8rem;color:var(--muted);margin-top:.1rem;overflow-wrap:anywhere}
.li-n{color:var(--muted);font-size:1rem;flex:none}
.li-chev{color:var(--muted);flex:none;display:flex}
.li.done .li-t{text-decoration:line-through;color:var(--muted)}
.li.add{color:var(--accent);font-weight:600}
.li.add .li-ic{color:var(--accent)}
.tcol{width:3.2rem;flex:none;font-size:.85rem;color:var(--muted);font-weight:600}
.li.alarm .li-t,.li.alarm .tcol{color:var(--alarm)}
.muted-row{color:var(--muted);font-size:.9rem}

/* concluir */
.chk{width:2.6rem;height:2.6rem;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex:none;margin:-.3rem -.3rem -.3rem -.5rem}
.chk-i{width:1.6rem;height:1.6rem;border-radius:50%;border:2.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:var(--ok-fg)}
.chk-i.on{background:var(--ok);border-color:var(--ok)}

/* resumo do dia */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:.8rem}
.tile{border:0;background:var(--surface);border-radius:1rem;padding:.75rem .9rem .8rem;display:flex;flex-direction:column;gap:.35rem;text-align:left;min-height:5.2rem}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-ic{width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tile-n{font-size:1.7rem;font-weight:800;line-height:1}
.tile-l{font-size:.85rem;font-weight:700;color:var(--muted)}
.t-blue .tile-ic{background:#1F6FEB}.t-red .tile-ic{background:#D93025}.t-green .tile-ic{background:#1E8E3E}.t-amber .tile-ic{background:#C77C02}

/* etiquetas e botões */
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:.2rem .55rem;white-space:nowrap;background:var(--surface-2);color:var(--muted);flex:none;display:inline-flex;align-items:center;gap:.2rem}
.pill.alarm{background:var(--alarm-soft);color:var(--alarm)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.btn{min-height:3rem;border-radius:.9rem;border:0;background:var(--surface);padding:0 .8rem;white-space:nowrap;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn.grow{flex:1}
.btn.wide{width:100%}
.btn.sm{min-height:2.6rem;padding:0 .9rem;font-size:.9rem}
.txtbtn{min-height:2.4rem;padding:0 .3rem;border:0;background:none;font-weight:700;color:var(--accent);font-size:.95rem;display:inline-flex;align-items:center;gap:.3rem}
.chip{min-height:2.4rem;padding:0 .85rem;border-radius:999px;border:0;background:var(--surface-2);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.actbar{display:flex;gap:.6rem;margin-top:1.2rem}

/* barra de abas */
.tabs{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:.3rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tab{flex:1;min-width:0;min-height:3.3rem;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:.72rem;font-weight:700;color:var(--muted)}
.tab.on{color:var(--accent)}
.fab{width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin:-1.2rem .3rem .2rem;box-shadow:0 6px 16px rgba(0,40,120,.3);flex:none}
.empty{text-align:center;color:var(--muted);padding:1.2rem .8rem;font-size:.9rem}
.empty b{display:block;color:var(--fg);font-size:1rem;margin-bottom:.2rem}

/* alarmes tocando */
.rings{padding:0 1rem;display:flex;flex-direction:column;gap:.4rem}
.ring{display:flex;align-items:center;gap:.6rem;background:var(--alarm-soft);color:var(--alarm);border-radius:1rem;padding:.6rem .5rem .6rem .9rem;margin-top:.5rem}
.ring-t{flex:1;min-width:0}
.ring-t b{display:block;font-size:1rem;overflow-wrap:anywhere}
.ring-t span{font-size:.8rem}

/* semana */
.day-h{display:flex;align-items:center;justify-content:space-between;margin:1.2rem .2rem .45rem;min-height:2.4rem}
.day-h b{font-size:1.1rem;font-weight:800}
.day-h .d{color:var(--muted);font-size:.85rem;margin-left:.4rem;font-weight:600}
.day-h.today b{color:var(--accent)}
.group.today{box-shadow:inset 0 0 0 2px var(--accent)}
.plus-sm{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}

/* agenda */
.nav2{display:flex;gap:.4rem}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem}
.navrow .chip{flex:1;justify-content:center;min-height:2.6rem;background:var(--surface);color:var(--accent)}
.navrow .iconbtn{width:3rem}
.hd h1.sm{font-size:1.6rem}
.two .inp{min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.15rem;padding:.5rem .4rem .6rem}
.cal-h{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:.3rem 0}
.cal-d{min-height:2.6rem;border-radius:.8rem;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:1rem;font-weight:600;padding:0}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:800}
.cal-d.sel{background:var(--accent);color:var(--accent-fg);font-weight:800;box-shadow:none}
.cal-d i{width:.3rem;height:.3rem;border-radius:50%;background:currentColor;display:block}
.cal-d i.no{background:transparent}

/* notas */
.search{display:flex;align-items:center;gap:.5rem;background:var(--surface-2);border-radius:.8rem;padding:0 .8rem;min-height:2.7rem;margin-top:.8rem;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;min-height:2.6rem}
.thumb{width:2.4rem;height:2.9rem;border-radius:.4rem;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.li.note{--inset:4.15rem}

/* folhas de edição */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{width:100%;max-width:680px;margin-inline:auto;flex:1;min-height:0;display:flex;flex-direction:column}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.3rem .6rem;border-bottom:1px solid var(--line);background:var(--surface);min-height:3.2rem}
.sheet-hd h2{margin:0;font-size:1.05rem;font-weight:800;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1.1rem}
.sheet-ft{display:flex;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--line);background:var(--surface)}
.lbl{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 .35rem .2rem}
.inp{width:100%;min-height:2.9rem;border:0;border-radius:.8rem;background:var(--surface);padding:.55rem .8rem}
select.inp{appearance:auto}
textarea.inp{min-height:5.5rem;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr;gap:.9rem}
.block{background:var(--surface);border-radius:1rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.7rem}
.block .inp{background:var(--surface-2)}
.block-t{font-size:1rem;font-weight:800}
.alrow{border-top:1px solid var(--line);padding-top:.7rem;display:flex;flex-direction:column;gap:.5rem}
.alrow:first-of-type{border-top:0;padding-top:0}
.alrow-h{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.alrow-h b{font-size:1rem}
.alrow-h small{color:var(--muted);font-size:.8rem}
.sub{display:flex;align-items:center;gap:.2rem}
.block .sub .inp{min-height:2.6rem;background:transparent;padding-left:.2rem}
.block .sub .inp:focus{background:var(--surface-2)}
.sub.done .inp{text-decoration:line-through;color:var(--muted)}
.warn{background:var(--alarm-soft);color:var(--alarm);border-radius:.8rem;padding:.6rem .8rem;font-size:.9rem}
.note-s{font-size:.85rem;color:var(--muted)}
.grid-img{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.gi{position:relative;aspect-ratio:3/4;border-radius:.6rem;overflow:hidden;background:var(--surface-2);border:0;padding:0}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi .rm{position:absolute;top:.25rem;right:.25rem;width:2rem;height:2rem;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.check{display:flex;align-items:center;gap:.6rem;min-height:2.6rem;font-size:.95rem}
.check input{width:1.3rem;height:1.3rem;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 5.5rem);z-index:60;background:var(--fg);color:var(--bg);padding:.6rem .7rem .6rem 1rem;border-radius:.9rem;max-width:calc(100% - 2rem);display:flex;gap:.6rem;align-items:center;font-size:.9rem;font-weight:600}
.toast button{border:0;background:none;color:inherit;font-weight:800;min-height:2.2rem;padding:0 .4rem;text-decoration:underline}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:1rem}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + .6rem);right:.6rem;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center}
.cap-ta{min-height:7rem;font-size:1.1rem}
.prev{background:var(--accent-soft);color:var(--fg);border-radius:.9rem;padding:.7rem .9rem;font-size:.95rem;display:flex;flex-direction:column;gap:.1rem}
.prev small{color:var(--muted);font-size:.8rem}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border-radius:.8rem;padding:.2rem;gap:.2rem}
.seg button{flex:1 1 40%;min-height:2.5rem;border:0;border-radius:.6rem;background:none;font-weight:700;font-size:.9rem}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* v3: lembretes estilo Apple, confirmações, lixeira */
:root{--flag:#C25E00;--danger-on:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flag:#FF9F0A;--danger-on:#2A0603}}
:root[data-theme="dark"]{--flag:#FF9F0A;--danger-on:#2A0603}
.btn.danger.sure{color:var(--danger-on)}
.t-gray .tile-ic{background:#636366}.t-orange .tile-ic{background:#E8770E}.t-pink .tile-ic{background:#D6336C}.t-slate .tile-ic{background:#8E8E93}
.tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))}
.sq{width:2rem;height:2rem;border-radius:.55rem;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sq.round{border-radius:50%}
.li.plan-h{cursor:default;min-height:3.6rem}
.li.plan-h .li-t{font-weight:800;letter-spacing:.02em}
.li.dayrow .li-t{font-weight:600;letter-spacing:.02em}
.li.dayrow.today .li-t{color:var(--accent)}
.li.dayrow.today{background:var(--accent-soft)}
.mini{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.flag{color:var(--flag);display:inline-flex;flex:none}
.sec-lh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:1.5rem .2rem .45rem}
.sec-lh h2{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}
.sec-lh .cnt{color:var(--muted);font-weight:700;font-size:.95rem}
.li-tags{color:var(--accent);font-weight:700;font-size:.8rem;margin-top:.1rem;overflow-wrap:anywhere}
.li-note{font-size:.8rem;color:var(--muted);margin-top:.1rem;overflow-wrap:anywhere}
.prio{color:var(--flag);font-weight:800;margin-right:.2rem}
.tagchips{display:flex;flex-wrap:wrap;gap:.5rem}
.tagchips .chip{background:var(--surface);color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem}
.sw{width:2.6rem;height:2.6rem;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.trash-acts{display:flex;gap:.5rem;flex-basis:100%;padding:.2rem 0}
.ask-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.ask{width:100%;max-width:520px;display:flex;flex-direction:column;gap:.6rem}
.ask-card{background:var(--surface);border-radius:1.2rem;padding:1.1rem 1.1rem 1rem;text-align:center}
.ask-t{font-size:1.15rem;font-weight:800;margin:0 0 .35rem}
.ask-m{font-size:.95rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.ask .btn{width:100%;min-height:3.4rem;font-size:1.05rem}
.ask .btn.cancel{background:var(--surface);color:var(--fg)}
.ask.arming .btn{pointer-events:none;opacity:.6}
@media (prefers-reduced-motion: no-preference){.ask{animation:up .16s ease-out}}
</style>

<div id="app">
  <div id="rings" class="rings"></div>
  <main class="page" id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
</div>
<div id="sheetRoot"></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" multiple hidden>

<script id="lib">
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes());
const dtOf=(date,time)=>{const p=date.split('-').map(Number);const t=(time||'00:00').split(':').map(Number);return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0);};
const toMin=t=>{const p=t.split(':').map(Number);return p[0]*60+(p[1]||0);};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const WD={domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};
const DOW3=['dom','seg','ter','qua','qui','sex','sáb'];
const DOWF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const REP={daily:'todo dia',weekly:'toda semana',monthly:'todo mês'};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7));};
function stepDate(iso,rep){
  const d=parseISO(iso);
  if(rep==='daily')return isoDate(addDays(d,1));
  if(rep==='weekly')return isoDate(addDays(d,7));
  if(rep==='monthly'){const day=d.getDate();const n=new Date(d.getFullYear(),d.getMonth()+1,1);const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();n.setDate(Math.min(day,last));return isoDate(n);}
  return iso;
}
function nextRepeatDate(iso,rep,today){let d=stepDate(iso,rep),i=0;while(d<today&&i<500){d=stepDate(d,rep);i++;}return d;}
const UNITS_PL={hour:'horas',day:'dias',week:'semanas',month:'meses',year:'anos'};
const UNITS_ONE={hour:'Toda hora',day:'Todo dia',week:'Toda semana',month:'Todo mês',year:'Todo ano'};
function repSpec(o){
  const k=o&&o.repeat;
  if(!k||k==='none')return null;
  if(k==='daily')return {n:1,u:'day',days:[]};
  if(k==='weekdays')return {n:1,u:'week',days:[1,2,3,4,5]};
  if(k==='weekly')return {n:1,u:'week',days:[]};
  if(k==='biweekly')return {n:2,u:'week',days:[]};
  if(k==='monthly')return {n:1,u:'month',days:[]};
  if(k==='yearly')return {n:1,u:'year',days:[]};
  if(k==='custom'){const n=Math.max(1,Math.min(999,parseInt(o.repN,10)||1));const u=UNITS_PL[o.repU]?o.repU:'day';return {n,u,days:(o.repDays||[]).map(Number).filter(x=>x>=0&&x<=6)};}
  return null;
}
function repLabel(o){
  const sp=repSpec(o);if(!sp)return 'Não repete';
  const fixed={daily:'Todo dia',weekdays:'Dias úteis (seg a sex)',weekly:'Toda semana',biweekly:'A cada 2 semanas',monthly:'Todo mês',yearly:'Todo ano'};
  let t=fixed[o.repeat]||(sp.n===1?UNITS_ONE[sp.u]:'A cada '+sp.n+' '+UNITS_PL[sp.u]);
  if(o.repeat==='custom'&&sp.u==='week'&&sp.days.length)t+=' ('+sp.days.slice().sort().map(d=>DOW3[d]).join(', ')+')';
  if(o.repUntil){const p=o.repUntil.split('-');t+=' até '+p[2]+'/'+p[1];}
  return t;
}
function repStep(cur,sp,baseISO){
  const b=parseISO(baseISO);
  if(sp.u==='hour')return new Date(cur.getTime()+sp.n*3600e3);
  if(sp.u==='day')return addDays(cur,sp.n);
  if(sp.u==='week'){
    if(!sp.days.length)return addDays(cur,7*sp.n);
    let d=cur;
    for(let i=0;i<7*sp.n+7;i++){
      d=addDays(d,1);
      if(sp.days.indexOf(d.getDay())>=0){const w=Math.round((mondayOf(d)-mondayOf(b))/(7*864e5));if(((w%sp.n)+sp.n)%sp.n===0)return d;}
    }
    return addDays(cur,7*sp.n);
  }
  if(sp.u==='month'){const last=new Date(cur.getFullYear(),cur.getMonth()+sp.n+1,0).getDate();return new Date(cur.getFullYear(),cur.getMonth()+sp.n,Math.min(b.getDate(),last),cur.getHours(),cur.getMinutes());}
  const last=new Date(cur.getFullYear()+sp.n,b.getMonth()+1,0).getDate();
  return new Date(cur.getFullYear()+sp.n,b.getMonth(),Math.min(b.getDate(),last),cur.getHours(),cur.getMinutes());
}
function repNext(o,after){
  const sp=repSpec(o);if(!sp||!o.date)return null;
  after=after||new Date();
  let cur=dtOf(o.date,o.time||'00:00'),guard=0;
  const limit=o.repUntil?dtOf(o.repUntil,'23:59'):null;
  const stepMs=sp.n*3600e3;
  if(sp.u==='hour'&&cur<after)cur=new Date(cur.getTime()+Math.floor((after-cur)/stepMs)*stepMs);
  while(guard++<5000){
    cur=repStep(cur,sp,o.date);
    if(limit&&cur>limit)return null;
    const ok=sp.u==='hour'?cur>after:isoDate(cur)>=isoDate(after);
    if(ok)return {date:isoDate(cur),time:(sp.u==='hour'||o.time)?pad(cur.getHours())+':'+pad(cur.getMinutes()):''};
  }
  return null;
}
function occursOn(e,iso){
  if(!e||!e.date)return false;
  if(iso===e.date)return true;
  if(iso<e.date)return false;
  const sp=repSpec(e);if(!sp||sp.u==='hour')return false;
  if(e.repUntil&&iso>e.repUntil)return false;
  const b=parseISO(e.date),d=parseISO(iso);
  if(sp.u==='day')return Math.round((d-b)/864e5)%sp.n===0;
  if(sp.u==='week'){const days=sp.days.length?sp.days:[b.getDay()];const w=Math.round((mondayOf(d)-mondayOf(b))/(7*864e5));return w%sp.n===0&&days.indexOf(d.getDay())>=0;}
  if(sp.u==='month'){const mm=(d.getFullYear()-b.getFullYear())*12+d.getMonth()-b.getMonth();if(mm%sp.n)return false;const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(b.getDate(),last);}
  const yy=d.getFullYear()-b.getFullYear();if(yy%sp.n)return false;const last=new Date(d.getFullYear(),b.getMonth()+1,0).getDate();
  return d.getMonth()===b.getMonth()&&d.getDate()===Math.min(b.getDate(),last);
}
function minLabel(min){
  if(!min)return 'Na hora';
  if(min%1440===0){const d=min/1440;return d===1?'24 horas antes':d+' dias antes';}
  if(min%60===0){const h=min/60;return h+(h===1?' hora antes':' horas antes');}
  return min+' min antes';
}
function alarmFireDate(r,a){if(!r.date||!r.time)return null;return new Date(dtOf(r.date,r.time).getTime()-(a.min||0)*60000);}
function dueKey(r){return (r.date||'')+'T'+(r.time||'');}
function relDay(iso,today){
  const diff=Math.round((parseISO(iso)-parseISO(today))/864e5);
  if(diff===0)return 'hoje';
  if(diff===1)return 'amanhã';
  if(diff===-1)return 'ontem';
  const d=parseISO(iso);
  return DOW3[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);
}
function weekdayDate(target,now){let delta=(target-now.getDay()+7)%7;if(delta===0)delta=7;return isoDate(addDays(now,delta));}
function parseCapture(text,now){
  now=now||new Date();
  let orig=String(text||'').trim(),n=norm(orig);
  if(n.length!==orig.length)orig=n;
  const cut=re=>{const m=re.exec(n);if(!m)return null;const a=m.index,b=a+m[0].length;orig=orig.slice(0,a)+' '+orig.slice(b);n=n.slice(0,a)+' '+n.slice(b);return m;};
  const today=isoDate(now);
  let date='',time='',repeat='none',repN=0,repU='',m;
  if((m=cut(/\ba cada (\d+) (horas?|dias?|semanas?|meses|mes|anos?)\b/))){repeat='custom';repN=+m[1];const u=m[2];repU=/^hora/.test(u)?'hour':/^dia/.test(u)?'day':/^sem/.test(u)?'week':/^mes/.test(u)?'month':'year';}
  else if(cut(/\b(?:dias uteis|de segunda a sexta)\b/))repeat='weekdays';
  else if(cut(/\b(?:todo ano|anualmente)\b/))repeat='yearly';
  else if((m=cut(/\btod[ao]s? (?:as |os )?(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-?feiras?)?s?\b/))){repeat='weekly';date=weekdayDate(WD[m[1]],now);}
  else if(cut(/\b(?:todos os dias|todo dia|diariamente)\b/))repeat='daily';
  else if(cut(/\b(?:toda semana|semanalmente)\b/))repeat='weekly';
  else if(cut(/\b(?:todo mes|mensalmente)\b/))repeat='monthly';
  if((m=cut(/\bdaqui a (\d+) (minutos?|min|horas?|h|dias?|semanas?)\b/))){
    const v=+m[1],u=m[2];let t;
    if(/^min/.test(u))t=new Date(now.getTime()+v*60000);
    else if(/^h/.test(u))t=new Date(now.getTime()+v*3600000);
    else if(/^dia/.test(u))t=addDays(now,v);
    else t=addDays(now,v*7);
    date=isoDate(t);
    if(/^(min|h)/.test(u))time=pad(t.getHours())+':'+pad(t.getMinutes());
  }
  if(!date){
    if(cut(/\bdepois de amanha\b/))date=isoDate(addDays(now,2));
    else if(cut(/\bamanha\b/))date=isoDate(addDays(now,1));
    else if(cut(/\bhoje\b/))date=today;
  }
  if(!date&&(m=cut(/\b(?:(?:na|no|nesta|neste|proxima|proximo)\s+)?(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-?\s?feira)?(?:\s+(?:que vem|proxima|proximo))?\b/))){date=weekdayDate(WD[m[1]],now);}
  if(!date){
    if((m=cut(/\b(?:dia\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
      const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:now.getFullYear();if(y<100)y+=2000;
      if(mo>=1&&mo<=12&&d>=1&&d<=31){let t=new Date(y,mo-1,d);if(!m[3]&&isoDate(t)<today)t=new Date(y+1,mo-1,d);date=isoDate(t);}
    }else if((m=cut(/\bdia\s+(\d{1,2})\b/))){
      const d=+m[1];
      if(d>=1&&d<=31){let t=new Date(now.getFullYear(),now.getMonth(),d);if(isoDate(t)<today)t=new Date(now.getFullYear(),now.getMonth()+1,d);date=isoDate(t);}
    }
  }
  const setT=(h,mi)=>{if(h>=0&&h<=23&&mi>=0&&mi<=59)time=pad(h)+':'+pad(mi);};
  if(!time){
    if(cut(/\bmeio[- ]dia\b/))time='12:00';
    else if(cut(/\bmeia[- ]noite\b/))time='00:00';
    else if((m=cut(/\bas\s+(\d{1,2})(?:[:h](\d{2}))?(?:\s*(?:h|horas?))?\b/)))setT(+m[1],m[2]?+m[2]:0);
    else if((m=cut(/\b(\d{1,2})[:h](\d{2})\b/)))setT(+m[1],+m[2]);
    else if((m=cut(/\b(\d{1,2})\s*h(?:oras?)?\b/)))setT(+m[1],0);
  }
  if((m=cut(/\b(?:da|de|a|pela|na|no)\s+(manha|tarde|noite|madrugada)\b/))){
    const p=m[1];
    if(time){const hm=time.split(':').map(Number);let h=hm[0];if((p==='tarde'||p==='noite')&&h<12)h+=12;setT(h,hm[1]);}
    else time={manha:'09:00',tarde:'15:00',noite:'20:00',madrugada:'05:00'}[p];
  }
  if(repeat==='custom'&&repU==='hour'&&!time){const t=new Date(now.getTime()+36e5);time=pad(t.getHours())+':00';if(!date)date=isoDate(t);}
  if(time&&!date){date=dtOf(today,time)>now?today:isoDate(addDays(now,1));}
  if(repeat!=='none'&&!date)date=today;
  let title=orig.replace(/^\s*(?:me\s+)?(?:lembr(?:ar|a|e)|anotar|marcar|agendar|criar lembrete)\s*(?:de|que|para|:)?\s*[:,\-]?\s*/i,'');
  for(let i=0;i<3;i++)title=title.replace(/\s+(?:as|às|a|de|em|para|no|na|pela|pelo|da|do|dia|e)\s*$/i,'');
  title=title.replace(/\s{2,}/g,' ').replace(/^[\s,.\-:;]+|[\s,.\-:;]+$/g,'');
  if(!title)title=String(text||'').trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  return {title,date,time,repeat,repN,repU,when:!!date};
}

/* ---------- armazenamento ---------- */
function partition(){
  COLS.forEach(c=>{S[c]=(S.raw[c]||[]).filter(x=>!x.deletedAt);});
  S.trash=[];
  TRASHABLE.forEach(c=>(S.raw[c]||[]).forEach(x=>{if(x.deletedAt)S.trash.push({c,x});}));
  S.trash.sort((a,b)=>b.x.deletedAt-a.x.deletedAt);
}
const Store={
  db:null,mode:'boot',
  async init(){
    let db=null;
    try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
    if(db){this.db=db;this.mode='cloud';this.subscribe();}
    else{this.mode='local';this.loadLocal();partition();S.sync='local';S.ready=true;onData();}
  },
  subscribe(){
    COLS.forEach(c=>{
      this.db.collection(c).onSnapshot(snap=>{
        S.raw[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        S.loaded[c]=true;partition();
        if(COLS.every(k=>S.loaded[k])){S.ready=true;if(!S.pending)S.sync='cloud';}
        onData();
      },()=>{S.sync='error';render();});
    });
  },
  loadLocal(){const raw=lsGet(LS);COLS.forEach(c=>{S.raw[c]=[];});if(raw){try{const o=JSON.parse(raw);COLS.forEach(c=>{S.raw[c]=o[c]||[];});}catch(e){}}},
  saveLocal(){const o={};COLS.forEach(c=>o[c]=S.raw[c]||[]);lsSet(LS,JSON.stringify(o));},
  async put(c,obj){
    const id=obj.id||uid();
    const data=clone(obj);
    delete data.id;
    if(this.mode==='local'){
      const arr=S.raw[c]=S.raw[c]||[];
      const doc=Object.assign({id},data),i=arr.findIndex(x=>x.id===id);
      if(i>=0)arr[i]=doc;else arr.push(doc);
      partition();this.saveLocal();onData();return id;
    }
    S.pending++;S.sync='saving';render();
    try{await this.db.doc(c+'/'+id).set(data);}
    catch(e){toast('Não consegui salvar agora. Tente de novo.');}
    finally{S.pending--;if(!S.pending&&S.sync==='saving')S.sync='cloud';render();}
    return id;
  },
  async del(c,id){
    if(this.mode==='local'){S.raw[c]=(S.raw[c]||[]).filter(x=>x.id!==id);partition();this.saveLocal();onData();return;}
    S.pending++;S.sync='saving';render();
    try{await this.db.doc(c+'/'+id).delete();}
    catch(e){toast('Não consegui apagar agora. Tente de novo.');}
    finally{S.pending--;if(!S.pending&&S.sync==='saving')S.sync='cloud';render();}

async function softDelete(c,x){await Store.put(c,Object.assign({},x,{deletedAt:Date.now()}));}

function horaFalada(t){if(!t)return '';const p=t.split(':');const h=+p[0],m=+p[1];return h+(h===1?' hora':' horas')+(m?' e '+m:'');}
function speak(text){
  if(!SY||!window.SpeechSynthesisUtterance){toast('Este aparelho não lê em voz alta aqui. Use Falar Tela do iPhone.');return;}
  if(SY.speaking){SY.cancel();toast('Leitura parada');return;}
  const u=new SpeechSynthesisUtterance(text.replace(/#/g,''));
  u.lang='pt-BR';u.rate=0.95;const v=ptVoice();if(v)u.voice=v;
  u.onerror=()=>{};
  SY.speak(u);toast('Lendo… toque de novo para parar');
}
function remSpeech(r){
  const today=isoDate(new Date());let t=(r.title||'Lembrete sem título')+'.';
  if(r.date)t+=' '+cap1(relDay(r.date,today).replace(/^(\w{3}), (\d+)\/(\d+)$/,(m,a,d,mo)=>DOWF[DOW3.indexOf(a)]+', dia '+(+d)+' de '+MESES[+mo-1]))+(r.time?', às '+horaFalada(r.time):'')+'.';
  if(repSpec(r))t+=' Repete: '+repLabel(r)+'.';
  const subs=(r.subtasks||[]).filter(s=>s.t);
  if(subs.length)t+=' Subtarefas: '+subs.map(s=>s.t+(s.done?', feito':'')).join('; ')+'.';
  if(r.notes)t+=' Observações: '+r.notes;
  return t;
}
function noteSpeech(n){
  let t=(n.title||'Nota sem título')+'. '+(n.body||'').trim();if(t&&!/[.!?]$/.test(t))t+='.';
  const cl=(n.checklist||[]).filter(c=>c.t);
  if(cl.length)t+=' Lista: '+cl.map(c=>c.t+(c.done?', feito':'')).join('; ')+'.';
  return t;
}
function daySpeech(iso){
  const today=isoDate(new Date()),d=parseISO(iso),its=dayItems(iso).filter(x=>x.kind!=='alarm');
  const rems=its.filter(x=>x.kind==='rem'&&!x.r.done),evs=its.filter(x=>x.kind==='ev');
  let t=(iso===today?'Hoje, ':'')+DOWF[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+'. ';
  if(!rems.length&&!evs.length)return t+'Nada marcado.';
  if(rems.length)t+=(rems.length===1?'Um lembrete: ':rems.length+' lembretes: ')+rems.map(x=>x.r.title+(x.t?', às '+horaFalada(x.t):'')).join('; ')+'. ';
  if(evs.length)t+='Na agenda: '+evs.map(x=>x.e.title+(x.t?', às '+horaFalada(x.t):'')).join('; ')+'. ';
  if(iso===today){const late=S.reminders.filter(r=>!r.done&&r.date&&r.date<today);if(late.length)t+=(late.length===1?'Um atrasado: ':late.length+' atrasados: ')+late.map(r=>r.title).join('; ')+'. ';if(S.inbox.length)t+=S.inbox.length+(S.inbox.length===1?' item':' itens')+' na caixa de entrada.';}
  return t;
}

/* ---------- adiar ---------- */
function snoozeTo(kind,d){
  const now=new Date();
  if(kind==='1h'){const t=new Date(now.getTime()+3600e3);const m=Math.ceil(t.getMinutes()/5)*5;t.setMinutes(m,0,0);return {date:isoDate(t),time:pad(t.getHours())+':'+pad(t.getMinutes())};}
  if(kind==='noite'){return {date:now.getHours()<19?isoDate(now):isoDate(addDays(now,1)),time:'20:00'};}
  return {date:isoDate(addDays(now,1)),time:(d&&d.time)||'09:00'};
}
const SNZ={'1h':'+1 hora','noite':'20h','amanha':'Amanhã'};
function snoozeChips(){return '<div class="chips">'+Object.keys(SNZ).map(k=>'<button class="chip" data-act="snooze-sheet" data-v="'+k+'">'+ic('bell',.8,2.4)+SNZ[k]+'</button>').join('')+'</div>';}

/* ---------- confirmação ---------- */
let askDone=null;
function ask(o){
  return new Promise(res=>{
    if(askDone)askDone(false);
    const root=document.createElement('div');
    root.className='ask-bg';root.id='askRoot';
    root.innerHTML='<div class="ask arming" role="alertdialog" aria-modal="true" aria-labelledby="askT"><div class="ask-card"><p class="ask-t" id="askT">'+esc(o.title)+'</p>'+(o.msg?'<p class="ask-m">'+esc(o.msg)+'</p>':'')+'</div>'+
      '<button class="btn '+(o.danger?'danger sure':'primary')+'" data-ask="1">'+esc(o.ok||'Confirmar')+'</button><button class="btn cancel" data-ask="0">'+esc(o.cancel||'Cancelar')+'</button></div>';
    document.body.appendChild(root);
    const box=root.firstChild;
    /* trava por um instante: um toque sem querer não confirma */
    setTimeout(()=>{box.classList.remove('arming');},450);
    askDone=v=>{askDone=null;root.remove();res(v);};
    root.addEventListener('click',e=>{
      e.stopPropagation();
      if(box.classList.contains('arming'))return;
      const b=e.target.closest('[data-ask]');
      if(b)askDone(b.dataset.ask==='1');
      else if(e.target===root)askDone(false);
    });
  });
}
const confirmAll=()=>S.conf==='all';

/* ---------- consultas ---------- */
const byDT=(a,b)=>(a.done?1:0)-(b.done?1:0)||((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99'));
function agendaItems(iso){
  const out=[];
  S.events.forEach(e=>{if(occursOn(e,iso))out.push({kind:'ev',id:e.id,title:e.title,time:e.time||'',rep:repSpec(e)?repLabel(e):''});});
  S.reminders.forEach(r=>{if(r.agenda&&r.date===iso)out.push({kind:'rem',id:r.id,title:r.title,time:r.time||'',done:r.done});});
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function conflictsFor(date,time,ignoreId){
  if(!date||!time)return [];
  const t=toMin(time);
  return agendaItems(date).filter(x=>x.id!==ignoreId&&x.time&&Math.abs(toMin(x.time)-t)<60).map(x=>x.title+' às '+x.time);
}
function dayItems(iso){
  const out=[];
  S.reminders.forEach(r=>{
    if(r.date===iso)out.push({t:r.time||'',kind:'rem',r});
    if(!r.done&&r.date&&r.time&&r.date!==iso)(r.alarms||[]).forEach(a=>{
      const f=alarmFireDate(r,a);
      if(f&&a.min>0&&isoDate(f)===iso)out.push({t:pad(f.getHours())+':'+pad(f.getMinutes()),kind:'alarm',r,a});
    });
  });
  S.events.forEach(e=>{if(occursOn(e,iso))out.push({t:e.time||'',kind:'ev',e});});
  return out.sort((a,b)=>a.t.localeCompare(b.t));
}
const dayCount=iso=>S.reminders.filter(r=>r.date===iso&&!r.done).length+S.events.filter(e=>occursOn(e,iso)).length;
function lmap(){const m={};S.lists.forEach(l=>{m[l.id]=l;});return m;}
const remList=(r,lm)=>r.list&&lm[r.list]?r.list:'';
function smart(){
  const today=isoDate(new Date()),R=S.reminders,open=R.filter(r=>!r.done);
  return {
    todos:open,
    hoje:open.filter(r=>r.date&&r.date<=today),
    prog:open.filter(r=>r.date),
    flag:open.filter(r=>r.flag),
    urg:open.filter(r=>(r.priority||0)>=3),
    done:R.filter(r=>r.done)
  };
}

/* ---------- pastas e etiquetas ---------- */
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','pt',{sensitivity:'base'});
function fmap(){const m={};S.folders.forEach(f=>{m[f.id]=f;});return m;}
function parentOf(f,fm){return f&&f.parent&&f.parent!==f.id&&fm[f.parent]?f.parent:'';}
function noteFolder(n,fm){return n.folder&&fm[n.folder]?n.folder:'';}
function kids(pid,fm){return S.folders.filter(f=>parentOf(f,fm)===pid&&f.id!==pid).sort(byName);}
function countIn(fid,fm,depth){
  depth=depth||0;if(depth>15)return 0;
  let n=S.notes.filter(x=>noteFolder(x,fm)===fid).length;
  if(fid)kids(fid,fm).forEach(k=>{n+=countIn(k.id,fm,depth+1);});
  return n;
}
function pathOf(fid,fm){const out=[];let f=fm[fid],i=0;while(f&&i<15){out.unshift(f.name||'Sem nome');f=fm[parentOf(f,fm)];i++;}return out;}
function treeList(fm,exclude){
  const out=[];
  const walk=(pid,d)=>{if(d>12)return;kids(pid,fm).forEach(f=>{if(f.id===exclude)return;out.push({f,d});walk(f.id,d+1);});};
  walk('',0);return out;
}
function folderOptions(sel,fm,exclude,rootLabel){
  return '<option value="">'+esc(rootLabel)+'</option>'+treeList(fm,exclude).map(o=>'<option value="'+esc(o.f.id)+'"'+(o.f.id===sel?' selected':'')+'>'+'    '.repeat(o.d)+(o.d?'↳ ':'')+esc(o.f.name||'Sem nome')+'</option>').join('');
}
async function deleteFolder(id){
  const fm=fmap(),f=fm[id];if(!f)return '';
  const to=parentOf(f,fm);
  for(const n of (S.raw.notes||[]).filter(x=>x.folder===id))await Store.put('notes',Object.assign({},n,{folder:to}));
  for(const k of S.folders.filter(x=>x.parent===id&&x.id!==id))await Store.put('folders',Object.assign({},k,{parent:to}));
  await Store.del('folders',id);
  return to;
}
const TAGRE=/(^|\s)#([\p{L}\p{N}_-]{2,30})/gu;
function tagsOf(n){const out=new Set();const t=(n.title||'')+' '+(n.body||'');let m;TAGRE.lastIndex=0;while((m=TAGRE.exec(t)))out.add(m[2].toLowerCase());return [...out];}
function allTags(){const c={};S.notes.forEach(n=>tagsOf(n).forEach(t=>{c[t]=(c[t]||0)+1;}));return Object.keys(c).sort().map(t=>[t,c[t]]);}

      (tg.length?'<div class="li-tags">'+tg.map(esc).join(' ')+'</div>':'')+'</div>'+

/* ---------- Hoje ---------- */
function viewHoje(){
  const now=new Date(),today=isoDate(now),R=S.reminders;
  const overdue=R.filter(r=>!r.done&&r.date&&r.date<today).sort(byDT);
  const todayR=R.filter(r=>r.date===today).sort(byDT);
  const nodate=R.filter(r=>!r.date&&!r.done).slice(0,8);
  const ag=agendaItems(today).filter(x=>x.kind==='ev');
  let h=hdr(DOWF[now.getDay()]+', '+now.getDate()+' de '+MESES[now.getMonth()],'Hoje',speakBtn('speak-day','Ouvir meu dia'));
  if(!S.ready)return h+'<div class="empty">Carregando…</div>';
  h+='<div class="tiles">'+
    tile('jump','sec-today','today','t-blue',todayR.filter(r=>!r.done).length,'Lembretes hoje')+
    tile('jump','sec-agenda','cal','t-green',ag.length,'Agenda hoje')+
    tile('jump','sec-late','alert','t-red',overdue.length,'Atrasados')+
    tile('jump','sec-inbox','inbox','t-amber',S.inbox.length,'Caixa de entrada')+'</div>';
  h+=secH('Lembretes de hoje','<button class="txtbtn" data-act="new-rem" data-date="'+today+'">'+ic('plus',1,2.4)+'Novo</button>','sec-today');
  h+='<div class="group">'+(todayR.length?todayR.map(r=>remRow(r,false)).join(''):emptyRow('Nada para hoje.','Toque no + azul para anotar.'))+'</div>';
  h+=secH('Agenda de hoje','<span class="hint">só consulta</span>','sec-agenda');
  h+='<div class="group">'+(ag.length?ag.map(x=>timeRow(x.time,x.title,'open-ev',x.id)).join(''):emptyRow('','Nenhum compromisso hoje.'))+'</div>';
  if(overdue.length){h+=secH('Atrasados <span class="pill danger">'+overdue.length+'</span>','<button class="txtbtn" data-act="late-today">Passar para hoje</button>','sec-late');h+='<div class="group">'+overdue.map(r=>remRow(r,true)).join('')+'</div>';}
  else h+='<div id="sec-late"></div>';
  if(S.inbox.length){
    h+=secH('Caixa de entrada','<span class="hint">falta organizar</span>','sec-inbox');
    h+='<div class="group">'+S.inbox.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(i=>
      '<div class="li static" style="flex-wrap:wrap"><div class="li-main" style="flex-basis:100%"><div class="li-t">'+esc(i.text)+'</div>'+(i.source?'<div class="li-s">via '+esc(i.source)+'</div>':'')+'</div>'+
      '<div class="chips" style="padding:.2rem 0 .2rem"><button class="chip" data-act="inbox-rem" data-id="'+esc(i.id)+'">Virar lembrete</button><button class="chip" data-act="inbox-note" data-id="'+esc(i.id)+'">Virar nota</button><button class="chip" data-act="inbox-del" data-id="'+esc(i.id)+'">Descartar</button></div></div>').join('')+'</div>';
  }else h+='<div id="sec-inbox"></div>';
  if(nodate.length){h+=secH('Sem data');h+='<div class="group">'+nodate.map(r=>remRow(r,false)).join('')+'</div>';}
  return h;
}

/* ---------- Lembretes (estilo Apple) com PLANNER ---------- */
function weekTitle(ws){
  const we=addDays(ws,6);
  if(ws.getMonth()===we.getMonth())return ws.getDate()+' a '+we.getDate()+' de '+MESES[ws.getMonth()];
  return ws.getDate()+' '+MES3[ws.getMonth()]+' a '+we.getDate()+' '+MES3[we.getMonth()];
}
const DNAME=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];

function noteRow(n,fm,showPath){

  if(ts)bits.push(relDay(isoDate(new Date(ts)),today));
  if(showPath){const fid=noteFolder(n,fm);bits.push(fid?pathOf(fid,fm).join(' › '):'Geral');}
  const cl=n.checklist||[];
  if(cl.length)bits.push(cl.filter(c=>c.done).length+' de '+cl.length+' itens');
  if(ni)bits.push(ni+(ni===1?' página':' páginas'));
  const prev=(n.body||'').replace(/\s+/g,' ').trim().slice(0,70);
  if(prev&&!showPath)bits.push(prev);
  return '<div class="li note" data-act="open-note" data-id="'+esc(n.id)+'"><div class="thumb">'+(img?'<img src="/_blob/'+esc(img)+'" alt="" loading="lazy">':ic(n.kind==='scan'?'scan':(cl.length?'list':'note'),1.1))+'</div><div class="li-main"><div class="li-t">'+(n.pinned?'<span style="color:var(--accent)">'+ic('pin',.75,2.4)+'</span> ':'')+esc(n.title||'Sem título')+'</div><div class="li-s">'+bits.map(esc).join(' · ')+'</div></div></div>';

/* ---------- avisos ---------- */
function toast(msg,action,fn){
  const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<button id="toastAct">'+esc(action)+'</button>':'');
  t.hidden=false;
  if(action){$('toastAct').onclick=()=>{t.hidden=true;fn&&fn();};}
  clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},action?6000:3500);
}
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    S.ac=S.ac||new AC();if(S.ac.state==='suspended')S.ac.resume();
    const o=S.ac.createOscillator(),g=S.ac.createGain();o.connect(g);g.connect(S.ac.destination);
    o.frequency.value=880;g.gain.value=0.08;o.start();o.stop(S.ac.currentTime+0.25);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function renderRings(){
  $('rings').innerHTML=S.rings.map((r,i)=>'<div class="ring"><span>'+ic('bell',1.2)+'</span><div class="ring-t"><b>'+esc(r.msg||r.title)+'</b><span>'+esc(r.title)+' · '+esc(r.when)+'</span></div><button class="txtbtn" data-act="ring-snooze" data-i="'+i+'">+1h</button><button class="txtbtn" data-act="ring-open" data-i="'+i+'">Ver</button><button class="iconbtn" style="background:transparent;color:inherit" data-act="ring-close" data-i="'+i+'" aria-label="Dispensar alarme">'+ic('close',1)+'</button></div>').join('');
}
function checkAlarms(){
  if(!S.ready)return;
  const now=Date.now();
  S.reminders.forEach(r=>{
    if(r.done||!r.date||!r.time||!(r.alarms||[]).length)return;
    const key=dueKey(r);let changed=false;
    const alarms=r.alarms.map(a=>{
      if(a.firedFor===key)return a;
      const fk=r.id+'|'+a.id+'|'+key;
      if(S.fired[fk])return a;
      const f=alarmFireDate(r,a).getTime();
      if(now<f)return a;
      S.fired[fk]=1;changed=true;
      if(now-f<36*3600e3){
        const today=isoDate(new Date());
        S.rings.push({rid:r.id,title:r.title,msg:a.msg,when:relDay(r.date,today)+' às '+r.time});
        beep();
      }
      return Object.assign({},a,{firedFor:key});
    });
    if(changed){Store.put('reminders',Object.assign({},r,{alarms}));renderRings();}
  });
}

  if(sh.type==='ev'&&!d.date){toast('Escolha a data.');return;}
  if((sh.type==='folder'||sh.type==='list')&&!(d.name||'').trim()){toast('Dê um nome primeiro.');return;}
  if(sh.type==='cap'&&!d.text.trim()){toast('Escreva algo primeiro.');return;}
  if(confirmAll()){
    let o;
    if(sh.type==='cap'){const c=capSummary(d);o={title:'Criar '+CAPL[c.m].toLowerCase()+'?',msg:c.what+(c.when?' · '+c.when:''),ok:'Criar'};}
    else{const nm=(d.title||d.name||'').trim()||(d.body||'').trim().split('\n')[0].slice(0,60);o={title:sh.isNew?'Salvar '+(sh.type==='folder'||sh.type==='list'||sh.type==='note'?'esta ':'este ')+SAVEQ[sh.type]+'?':'Salvar as alterações?',msg:nm,ok:'Salvar'};}
    if(!(await ask(o)))return;
    if(S.sheet!==sh)return;
  }
  if(sh.type==='rem'||sh.type==='ev'){d.repN=Math.max(1,Math.min(999,parseInt(d.repN,10)||1));d.repDays=(d.repDays||[]).map(Number).sort();}
  if(sh.type==='rem'){
    setAlarmsAuto(d);
    const doc=Object.assign({},d,{title:d.title.trim(),time:d.date?d.time:'',subtasks:(d.subtasks||[]).filter(s=>s.t.trim()),updatedAt:Date.now()});
    delete doc.noAuto;
    await Store.put('reminders',doc);
    if(sh.fromInbox)await Store.del('inbox',sh.fromInbox);
  }else if(sh.type==='ev'){
    await Store.put('events',Object.assign({},d,{title:d.title.trim(),updatedAt:Date.now()}));
  }else if(sh.type==='note'){
    const title=d.title.trim()||(d.body||'').trim().split('\n')[0].slice(0,60)||'Sem título';
    await Store.put('notes',Object.assign({},d,{title,checklist:(d.checklist||[]).filter(s=>s.t.trim()),updatedAt:Date.now()}));
    if(sh.fromInbox)await Store.del('inbox',sh.fromInbox);
  }else if(sh.type==='folder'){
    await Store.put('folders',Object.assign({},d,{name:d.name.trim(),parent:d.parent||'',updatedAt:Date.now()}));
  }else if(sh.type==='list'){
    await Store.put('lists',Object.assign({},d,{name:d.name.trim(),sections:(d.sections||[]).filter(x=>(x.t||'').trim()),updatedAt:Date.now()}));
  }else if(sh.type==='cap'){
    await saveCapture(d);return;
  }
  const removed=sh.removed||[];sh.added=[];
  if(removed.length){const a=await getAssets();if(a)removed.forEach(id=>a.delete(id).catch(()=>{}));}
  closeSheet();toast('Salvo');
}

async function toggleDone(id){

async function deleteSheet(){
  const sh=S.sheet;if(!sh)return;
  const d=sh.draft;
  if(sh.type==='folder'){
    const fm=fmap(),to=parentOf(fm[d.id],fm),toName=to?(fm[to].name||'Sem nome'):'Geral';
    if(!(await ask({title:'Apagar a pasta “'+(d.name||'')+'”?',msg:'As notas e subpastas dela vão para “'+toName+'”. Nenhuma nota é apagada.',ok:'Apagar pasta',danger:true})))return;
    const dest=await deleteFolder(d.id);
    if(S.folder===d.id)S.folder=dest||null;
    closeSheet();toast('Pasta apagada.');render();return;
  }
  if(sh.type==='list'){
    if(!(await ask({title:'Apagar a lista “'+(d.name||'')+'”?',msg:'Os lembretes dela vão para “Lembretes”. Nenhum lembrete é apagado.',ok:'Apagar lista',danger:true})))return;
    for(const r of (S.raw.reminders||[]).filter(x=>x.list===d.id))await Store.put('reminders',Object.assign({},r,{list:''}));
    await Store.del('lists',d.id);
    if(S.rview==='l:'+d.id)S.rview=null;
    closeSheet();toast('Lista apagada.');render();return;
  }
  const col={rem:'reminders',ev:'events',note:'notes'}[sh.type];
  if(!(await ask({title:'Apagar '+(sh.type==='note'?'esta nota':sh.type==='ev'?'este compromisso':'este lembrete')+'?',msg:'Vai para “Apagados recentemente”. Você pode recuperar por 30 dias.',ok:'Apagar',danger:true})))return;
  const orig=S[col].find(x=>x.id===d.id)||d;
  await softDelete(col,orig);
  closeSheet();
  toast('Movido para Apagados recentemente','Desfazer',()=>{const t=S.trash.find(x=>x.x.id===d.id);if(t)restoreItem(t.c,t.x);});
}

async function prepareImage(file,bw){
  const MAX=1800;let bmp;
  try{bmp=await createImageBitmap(file);}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,k=Math.min(1,MAX/Math.max(w0,h0));
  const w=Math.round(w0*k),h=Math.round(h0*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,w,h);
  if(bw){const im=cx.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];const v=Math.max(0,Math.min(255,(g-120)*1.6+135));d[i]=d[i+1]=d[i+2]=v;}cx.putImageData(im,0,0);}
  return await new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.85));
}
async function onFiles(inp){
  const files=Array.from(inp.files||[]);if(!files.length)return;
  const assets=await getAssets();
  if(!assets){toast('Anexar fotos precisa de permissão de edição neste navegador.');return;}
  const bwEl=$('bw'),bw=bwEl?bwEl.checked:S.bw;
  const target=S.pendingNew?'new':'sheet';
  toast('Enviando '+(files.length>1?files.length+' fotos…':'a foto…'));
  const ids=[];
  for(const f of files){
    try{
      const blob=await prepareImage(f,bw);
      const res=await assets.upload(blob,{type:'image/jpeg'});ids.push(res.id);
    }catch(e){toast('Não consegui enviar uma das fotos.');}
  }
  if(!ids.length){S.pendingNew=false;return;}
  if(target==='new'){
    S.pendingNew=false;
    const now=new Date(),title='Scan de '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    const doc=Object.assign(newNote(S.pendingFolder||''),{title,kind:'scan',images:ids,updatedAt:Date.now()});
    const id=await Store.put('notes',doc);
    const n=S.notes.find(x=>x.id===id)||Object.assign({id},doc);
    openSheet('note',clone(n));toast('Scan salvo. Dê um nome se quiser.');
  }else if(S.sheet){
    S.sheet.draft.images=(S.sheet.draft.images||[]).concat(ids);S.sheet.added=(S.sheet.added||[]).concat(ids);
    if(S.sheet.type==='note'&&bw&&S.sheet.draft.kind==='nota')S.sheet.draft.kind='scan';
    renderSheet();toast('Foto anexada');
  }
}

  if(t.dataset.bind!==undefined){
    setSheetField(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
    if(S.sheet.type==='cap'){const p=$('capPrev');if(p)p.innerHTML=capPreviewHtml(S.sheet.draft);}
  }else if(t.dataset.subText!==undefined){S.sheet.draft[t.dataset.subK][+t.dataset.subText].t=t.value;}
  else if(t.dataset.alMsg!==undefined){const a=S.sheet.draft.alarms.find(x=>x.id===t.dataset.alMsg);if(a)a.msg=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileCam'||t.id==='fileLib'){onFiles(t);return;}
  if(t.id==='bw'){S.bw=t.checked;lsSet('ms-bw',S.bw?'1':'0');return;}
  if(!S.sheet)return;
  if(t.dataset.bind!==undefined){
    setSheetField(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
    if(t.dataset.bind==='list'&&S.sheet.type==='rem')S.sheet.draft.section='';
    if(t.dataset.rerender!==undefined){
      if(t.dataset.bind==='time'&&S.sheet.type==='rem')setAlarmsAuto(S.sheet.draft);
      renderSheet();
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='newSub'){e.preventDefault();A['add-sub']({k:e.target.dataset.k});}
  if(e.key==='Escape'){if(askDone)askDone(false);else if(!$('viewer').hidden)$('viewer').hidden=true;else if(S.sheet)cancelSheet();}
});
document.addEventListener('pointerdown',()=>{try{const AC=window.AudioContext||window.webkitAudioContext;if(AC&&!S.ac){S.ac=new AC();}if(S.ac&&S.ac.state==='suspended')S.ac.resume();}catch(e){}},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAlarms();});

buildTabs();render();Store.init();
getAssets().then(a=>{S.assetsOk=!!a;});
getDl().then(d=>{S.dlOk=!!d;});
setInterval(checkAlarms,15000);
})();
</script>
