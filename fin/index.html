<script>
'use strict';
/* ---------- conexão (mesmo banco do Núcleo, tabela própria) ---------- */
const CFG={url:'https://cptvxfzgimeawheqrhvz.supabase.co',key:'sb_publishable_Q7W8ptGAqUBvHFhCxbhXOw_aLjfC186'};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- ordem das listas: ordenar e mover (funções puras, testáveis) ---------- */
const SORT_LABELS={def:'Padrão',new:'Data: mais recentes',old:'Data: mais antigas',az:'A → Z',za:'Z → A',man:'Minha ordem'};
const hasOrd=x=>typeof x.ord==='number'&&isFinite(x.ord);
/* g = {name:fn, date:fn}. 'def' devolve como veio. 'man' usa o campo ord (quem não tem fica depois, na ordem de entrada). */
function sortGroup(items,mode,g){
  const a=items.slice(),nm=x=>String(g.name(x)||''),cmp=(x,y)=>nm(x).localeCompare(nm(y),'pt-BR',{sensitivity:'base',numeric:true}),dt=x=>+g.date(x)||0;
  if(mode==='az')return a.sort(cmp);
  if(mode==='za')return a.sort((x,y)=>cmp(y,x));
  if(mode==='new')return a.sort((x,y)=>dt(y)-dt(x)||cmp(x,y));
  if(mode==='old')return a.sort((x,y)=>dt(x)-dt(y)||cmp(x,y));
  if(mode==='man'){
    const ix=new Map(a.map((it,i)=>[it,i])),o=x=>hasOrd(x)?x.ord:Infinity;
    return a.sort((x,y)=>o(x)===o(y)?ix.get(x)-ix.get(y):(o(x)<o(y)?-1:1));
  }
  return a;
}
function seqOrds(ids,cur){const out=[];ids.forEach((id,i)=>{const o=(i+1)*1000;if(cur.get(id)!==o)out.push({id,ord:o});});return out;}
/* items: como aparecem agora; newIds: a ordem desejada. Devolve só o que precisa mudar: [{id,ord}] */
function ordsForOrder(items,newIds){
  const cur=new Map(items.map(x=>[x.id,x.ord])),ids=items.map(x=>x.id);
  if(ids.join('|')===newIds.join('|'))return [];
  const consistent=items.every(hasOrd)&&items.every((x,i)=>i===0||items[i-1].ord<x.ord);
  if(consistent){
    for(let k=0;k<ids.length;k++){
      const rest=ids.filter((_,i)=>i!==k),nrest=newIds.filter(id=>id!==ids[k]);
      if(rest.length===nrest.length&&rest.every((id,i)=>id===nrest[i])){
        const at=newIds.indexOf(ids[k]),p=at>0?cur.get(newIds[at-1]):null,n=at<newIds.length-1?cur.get(newIds[at+1]):null;
        if(p!=null&&n!=null&&Math.abs(n-p)<1e-6)break;
        let o;if(p==null&&n==null)o=1000;else if(p==null)o=n-1000;else if(n==null)o=p+1000;else o=(p+n)/2;
        return [{id:ids[k],ord:o}];
      }
    }
  }
  return seqOrds(newIds,cur);
}
/* to: 'first' | 'last' | 'up' | 'down' | {index:n} */
function moveOrds(items,id,to){
  const ids=items.map(x=>x.id),from=ids.indexOf(id);if(from<0)return [];
  let at=to==='first'?0:to==='last'?ids.length-1:to==='up'?from-1:to==='down'?from+1:(to&&typeof to.index==='number'?to.index:from);
  at=Math.max(0,Math.min(ids.length-1,at));if(at===from)return [];
  const order=ids.slice();order.splice(from,1);order.splice(at,0,id);
  return ordsForOrder(items,order);
}

/* ---------- senha (PIN) para abrir o app: 6 números, guardada só como hash; vale para o Núcleo e para o FIN ---------- */
const LK_IDLE=2*60*1000,LK_LEN=6;
const LK={buf:'',mode:'unlock',first:'',onOk:null,open:false,faceOn:false};
const LKH={app:'Núcleo',toast:()=>{},rerender:()=>{},reload:()=>{location.reload();}};
const lkGet=k=>{try{return localStorage.getItem('lock-'+k);}catch(e){return null;}};
const lkSet=(k,v)=>{try{if(v==null)localStorage.removeItem('lock-'+k);else localStorage.setItem('lock-'+k,String(v));}catch(e){}};
const lkOn=()=>!!lkGet('hash');
const lkTouch=()=>{if(!LK.open)lkSet('at',Date.now());};
const lkNeeded=()=>lkOn()&&(Date.now()-(+lkGet('at')||0))>LK_IDLE;
const lkHex=buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
async function lkHash(pin,saltHex){
  const salt=Uint8Array.from((saltHex.match(/.{2}/g)||[]).map(h=>parseInt(h,16)));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return lkHex(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256));
}
async function lkSetPin(pin){
  const s=lkHex(crypto.getRandomValues(new Uint8Array(16)));
  lkSet('salt',s);lkSet('hash',await lkHash(pin,s));lkSet('fails',null);lkSet('until',null);lkSet('at',Date.now());
}
async function lkCheck(pin){return (await lkHash(pin,lkGet('salt')||''))===lkGet('hash');}
function lkEl(){
  let el=document.getElementById('lock');if(el)return el;
  el=document.createElement('div');el.id='lock';
  el.innerHTML='<div class="lk-in"><div class="lk-t" id="lkT"></div><div class="lk-s" id="lkS"></div><div class="lk-dots" id="lkD"></div>'
    +'<div class="lk-pad">'+'123456789'.split('').map(d=>'<button type="button" data-k="'+d+'">'+d+'</button>').join('')
    +'<button type="button" class="lk-ft" data-k="face" id="lkFace">Face ID</button><button type="button" data-k="0">0</button><button type="button" class="lk-ft" data-k="del" aria-label="Apagar">⌫</button></div>'
    +'<button type="button" class="lk-link" data-k="forgot" id="lkForgot">Esqueci a senha</button><button type="button" class="lk-link" data-k="cancel" id="lkCancel">Cancelar</button></div>'
    +'<div class="lk-in" id="lkFg" style="display:none"><div class="lk-t">Esqueci a senha</div><div class="lk-s">Vou sair da sua conta neste aparelho e apagar a cópia guardada aqui. Você entra de novo com o seu e-mail e a senha da conta. Seus dados continuam salvos na nuvem.</div><button type="button" class="lk-big" data-k="forgot-ok">Sair e entrar de novo</button><button type="button" class="lk-link" data-k="forgot-no">Voltar</button></div>';
  document.body.appendChild(el);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)lkKey(b.getAttribute('data-k'));});
  return el;
}
function lkPaint(msg){
  const el=lkEl(),T={unlock:['Digite a senha',LKH.app],verify:['Digite a senha atual','Para continuar'],new1:['Crie uma senha',LK_LEN+' números'],new2:['Repita a senha','Para conferir']}[LK.mode];
  el.querySelector('#lkT').textContent=T[0];el.querySelector('#lkS').textContent=msg||T[1];
  el.querySelector('#lkD').innerHTML=Array.from({length:LK_LEN},(_,i)=>'<span class="'+(i<LK.buf.length?'on':'')+'"></span>').join('');
  el.querySelector('#lkFace').style.visibility=(LK.mode==='unlock'&&lkGet('cred'))?'visible':'hidden';
  el.querySelector('#lkForgot').style.display=LK.mode==='unlock'?'':'none';
  el.querySelector('#lkCancel').style.display=LK.mode==='unlock'?'none':'';
}
function lkOpen(mode,onOk){
  LK.mode=mode;LK.buf='';LK.onOk=onOk||null;LK.open=true;
  const el=lkEl();el.style.display='flex';el.querySelector('.lk-in').style.display='';el.querySelector('#lkFg').style.display='none';
  document.documentElement.classList.add('lk-on');lkPaint();
}
function lkClose(){LK.open=false;LK.buf='';const el=document.getElementById('lock');if(el)el.style.display='none';document.documentElement.classList.remove('lk-on');lkSet('at',Date.now());}
function lkWait(){const u=+lkGet('until')||0;return u>Date.now()?Math.ceil((u-Date.now())/1000):0;}
async function lkKey(k){
  if(k==='forgot'){const el=lkEl();el.querySelectorAll('.lk-in')[0].style.display='none';el.querySelector('#lkFg').style.display='';return;}
  if(k==='forgot-no'){lkPaint();const el=lkEl();el.querySelectorAll('.lk-in')[0].style.display='';el.querySelector('#lkFg').style.display='none';return;}
  if(k==='forgot-ok'){lkForgot();return;}
  if(k==='cancel'){lkClose();return;}
  if(k==='face'){lkFace();return;}
  if(lkWait()){lkPaint('Muitas tentativas. Espere '+lkWait()+' segundos.');return;}
  if(k==='del'){LK.buf=LK.buf.slice(0,-1);lkPaint();return;}
  if(!/^\d$/.test(k)||LK.buf.length>=LK_LEN)return;
  LK.buf+=k;lkPaint();
  if(LK.buf.length<LK_LEN)return;
  const pin=LK.buf;
  if(LK.mode==='new1'){LK.first=pin;LK.buf='';LK.mode='new2';lkPaint();return;}
  if(LK.mode==='new2'){
    if(pin!==LK.first){LK.buf='';LK.mode='new1';lkPaint('Não bateu. Crie de novo.');return;}
    await lkSetPin(pin);const cb=LK.onOk;lkClose();if(cb)cb();return;
  }
  const ok=await lkCheck(pin);
  if(ok){lkSet('fails',null);lkSet('until',null);const cb=LK.onOk;lkClose();if(cb)cb();return;}
  const f=(+lkGet('fails')||0)+1;lkSet('fails',f);LK.buf='';
  if(f>=5){lkSet('until',Date.now()+30000*Math.pow(2,Math.min(f-5,5)));lkPaint('Muitas tentativas. Espere '+lkWait()+' segundos.');}
  else lkPaint('Senha errada. Faltam '+(5-f)+' tentativas antes de esperar.');
  try{if(navigator.vibrate)navigator.vibrate(120);}catch(e){}

/* ---------- ler boleto e fatura (parte pura, testada): linha digitável, código de barras e texto da foto ---------- */
const BOL_BANCOS={'001':'Banco do Brasil','003':'Banco da Amazônia','004':'Banco do Nordeste','033':'Santander','041':'Banrisul','070':'BRB','077':'Inter','104':'Caixa','212':'Original','237':'Bradesco','260':'Nubank','336':'C6 Bank','341':'Itaú','389':'Mercantil','422':'Safra','453':'Rural','633':'Rendimento','655':'Votorantim','745':'Citibank','748':'Sicredi','756':'Sicoob'};
const bolDig=s=>String(s==null?'':s).replace(/\D/g,'');
function bolMod10(n){let s=0,w=2;for(let i=n.length-1;i>=0;i--){let p=(+n[i])*w;if(p>9)p=Math.floor(p/10)+p%10;s+=p;w=w===2?1:2;}return (10-s%10)%10;}
function bolMod11(n){let s=0,w=2;for(let i=n.length-1;i>=0;i--){s+=(+n[i])*w;w=w===9?2:w+1;}const dv=11-s%11;return (dv===0||dv===10||dv===11)?1:dv;}
function bolIso(dt){return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');}
/* fator de vencimento: dias desde 07/10/1997; depois de 21/02/2025 recomeça em 1000 (22/02/2025). Vale a data mais perto de hoje. */
function bolDate(fator,hoje){
  if(!(fator>=1000))return null;
  const base=Date.UTC(1997,9,7),rest=Date.UTC(2025,1,22),h=hoje||new Date(),t=Date.UTC(h.getFullYear(),h.getMonth(),h.getDate());
  const a=base+fator*864e5,b=rest+(fator-1000)*864e5;
  return bolIso(new Date(Math.abs(a-t)<=Math.abs(b-t)?a:b));
}
function bolBar44(d){
  const g=bolMod11(d.slice(0,4)+d.slice(5));
  return {tipo:'boleto',banco:d.slice(0,3),valorC:parseInt(d.slice(9,19),10),fator:parseInt(d.slice(5,9),10),ok:g===+d[4]};
}
function bolLinha47(d){
  const ok1=bolMod10(d.slice(0,9))===+d[9],ok2=bolMod10(d.slice(10,20))===+d[20],ok3=bolMod10(d.slice(21,31))===+d[31];
  const bar=d.slice(0,4)+d[32]+d.slice(33,47)+d.slice(4,9)+d.slice(10,20)+d.slice(21,31);
  const r=bolBar44(bar);r.ok=r.ok&&ok1&&ok2&&ok3;return r;
}
function bolConv(bar,blocos){
  const ref=bar[2],m10=(ref==='6'||ref==='7');
  const ok=(m10&&blocos)?blocos.every(b=>bolMod10(b.slice(0,11))===+b[11]):null;
  return {tipo:'convenio',banco:'',valorC:(ref==='6'||ref==='8')?parseInt(bar.slice(4,15),10):null,fator:0,ok};
}
function bolParse(txt){
  const d=bolDig(txt);
  if(d.length===47)return bolLinha47(d);
  if(d.length===48){const bl=[0,12,24,36].map(i=>d.slice(i,i+12));return bolConv(bl.map(b=>b.slice(0,11)).join(''),bl);}
  if(d.length===44)return d[0]==='8'?bolConv(d,null):bolBar44(d);
  return null;
}
/* procura o código no texto lido da foto, mesmo com lixo em volta; prefere o trecho cujos dígitos verificadores batem */
function bolFindInText(txt){
  const t=String(txt||'');
  const fm=/\d{5}[. ]?\d{5}\s+\d{5}[. ]?\d{6}\s+\d{5}[. ]?\d{6}\s+\d\s+\d{14}/.exec(t);
  if(fm){const d=bolDig(fm[0]);if(d.length===47){const p=bolParse(d);if(p)return Object.assign(p,{linha:d});}}
  const runs=t.match(/\d[\d .\-\n]{30,110}\d/g)||[];
  let best=null;
  for(const r of runs){
    const d=bolDig(r);
    for(const len of [47,48]){
      for(let i=0;i+len<=d.length;i++){
        const p=bolParse(d.slice(i,i+len));
        if(p&&p.ok===true)return Object.assign(p,{linha:d.slice(i,i+len)});
        if(p&&!best&&i===0&&d.length===len)best=Object.assign(p,{linha:d});
      }
    }
    if(d.length>=44&&d.length<=46){
      for(let i=0;i+44<=d.length;i++){
        const p=bolParse(d.slice(i,i+44));
        if(p&&p.ok===true)return Object.assign(p,{linha:d.slice(i,i+44)});
        if(p&&!best&&i===0&&d.length===44)best=Object.assign(p,{linha:d});
      }
    }
  }
  return best;
}
const docCents=s=>parseInt(String(s).replace(/\./g,'').replace(',',''),10);
/* sem código: procura vencimento e total pelos rótulos e junta as datas e valores vistos */
function docTexto(txt){
  const t=String(txt||''),out={datas:[],valores:[],venc:null,total:null};
  const re=/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/g;let m;
  while((m=re.exec(t))){const dd=+m[1],mm=+m[2],yy=+m[3];if(dd>=1&&dd<=31&&mm>=1&&mm<=12&&yy>=2020&&yy<=2100){const dt=new Date(Date.UTC(yy,mm-1,dd));if(dt.getUTCMonth()===mm-1){const iso=bolIso(dt);if(out.datas.indexOf(iso)<0)out.datas.push(iso);}}}
  const rv=/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(?!\d)/g;
  while((m=rv.exec(t))){const c=docCents(m[1]);if(c>0&&out.valores.indexOf(c)<0)out.valores.push(c);}
  t.split('\n').forEach(ln=>{
    const l=ln.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    if(!out.venc&&/venc/.test(l)){const d=/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/.exec(ln);if(d){const dt=new Date(Date.UTC(+d[3],+d[2]-1,+d[1]));if(dt.getUTCMonth()===+d[2]-1)out.venc=bolIso(dt);}}
    if(out.total==null&&/(total|valor|pagar|documento)/.test(l)&&!/minimo|parcela|encargo|juros|limite/.test(l)){const v=/(\d{1,3}(?:\.\d{3})*,\d{2})/.exec(ln);if(v&&docCents(v[1])>0)out.total=docCents(v[1]);}
  });
  return out;
}
function docLer(txt,hoje){
  const b=bolFindInText(txt),tx=docTexto(txt);
  const r={tipo:'texto',valorC:null,venc:null,banco:'',ok:null,linha:'',outrasDatas:tx.datas.slice(0,4),outrosValores:tx.valores.slice(0,4)};
  if(b){r.tipo=b.tipo;r.valorC=(b.valorC>0)?b.valorC:null;r.banco=b.banco;r.ok=b.ok;r.linha=b.linha;if(b.fator)r.venc=bolDate(b.fator,hoje);}
  if(r.valorC==null&&tx.total!=null)r.valorC=tx.total;
  if(!r.venc&&tx.venc)r.venc=tx.venc;
  return r;
}

/* ---- leitor da foto (carrega o leitor de texto na primeira vez; precisa de internet nessa vez) ---- */
const OCR_SRC='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function ocrLoad(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=OCR_SRC;s.onload=()=>res();s.onerror=()=>rej(new Error('sem internet para carregar o leitor'));document.head.appendChild(s);});
}
async function ocrRead(blob,onProg){
  await ocrLoad();
  const wk=await Tesseract.createWorker('por',1,{logger:m=>{if(onProg&&m&&m.status)onProg(m.status,m.progress||0);}});
  try{const r=await wk.recognize(blob);return (r.data&&r.data.text)||'';}finally{try{await wk.terminate();}catch(e){}}
}
/* deixa a foto mais fácil de ler: tamanho até 2200 px, cinza e contraste esticado */
async function ocrPrep(file){
  try{
    const bmp=await createImageBitmap(file),k=Math.min(1,2200/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(bmp,0,0,w,h);
    const im=g.getImageData(0,0,w,h),d=im.data;let lo=255,hi=0;
    for(let i=0;i<d.length;i+=4){const v=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)|0;d[i]=d[i+1]=d[i+2]=v;if(v<lo)lo=v;if(v>hi)hi=v;}
    const sc=hi>lo?255/(hi-lo):1;
    for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,((d[i]-lo)*sc)|0));d[i]=d[i+1]=d[i+2]=v;}
    g.putImageData(im,0,0);
    return await new Promise(r=>c.toBlob(r,'image/png'));
  }catch(e){return file;}
}

/* ---------- gastos: para onde vai o dinheiro (categorias, subcategorias, regras e gráfico) ---------- */
const CAT_TREE={'Mercado':['Compras da casa','Lanches e salgadinhos','Bebidas e energéticos'],'Alimentação fora':['Restaurante','Lanchonete','Café','Bar'],'Carro':['Combustível','Manutenção','Estacionamento','Pedágio'],'Casa':['Contas (luz, água, internet)','Manutenção','Móveis e utensílios'],'Saúde':['Farmácia','Consultas e exames','Plano de saúde'],'Roupas e calçados':[],'Lazer':['Passeios','Jogos e apps','Viagens'],'Filhos':['Escola','Lazer','Roupas'],'Assinaturas':[],'Presentes e doações':[],'Impostos e taxas':['IPVA','Licenciamento','Tarifas e IOF'],'Outros':[]};
const CAT_COL=['#4C9AFF','#34C27A','#FFB300','#FF5C5C','#A855F7','#2DD4BF','#FF8A3D','#98A2B3'];
const gNorm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const G_STOP=new Set(['pag','ltda','epp','eireli','cia','dos','das','com','loja','comercio']);
/* a "chave" de um lugar: as 2 primeiras palavras que importam (sem acento, número, MP*, LTDA…) */
function gKey(desc){return gNorm(desc).replace(/[^a-z]+/g,' ').split(' ').filter(x=>x.length>=3&&!G_STOP.has(x)).slice(0,2).join(' ');}
const catCfg=()=>byKind('proposal').find(r=>r.data&&r.data.cfg==='cats')||null;
const catData=()=>{const r=catCfg();return r?r.data:{cfg:'cats',rules:[],over:{},extra:{}};};
function catTree(){
  const t=JSON.parse(JSON.stringify(CAT_TREE)),ex=catData().extra||{};
  Object.keys(ex).forEach(c=>{t[c]=t[c]||[];(ex[c]||[]).forEach(s=>{if(t[c].indexOf(s)<0)t[c].push(s);});});
  return t;
}
/* categoria de um gasto: 1) a que você escolheu só para ele, 2) a regra do lugar, 3) a do Mobills (se for uma categoria conhecida) */
function catOf(e){
  const d=catData();

const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=c=>(c==null||isNaN(c))?'Não informado':BRL.format(c/100);
function parseMoney(s){ // '' -> null; inválido -> NaN
  s=String(s||'').trim().replace(/^R\$\s*/,'');
  if(!s)return null;
  if(!/^-?\d{1,3}(\.\d{3})*(,\d{1,2})?$|^-?\d+(,\d{1,2})?$|^-?\d+(\.\d{1,2})?$/.test(s))return NaN;
  let n;
  if(s.includes(','))n=s.replace(/\./g,'').replace(',','.');
  else n=s;
  const f=parseFloat(n); if(isNaN(f))return NaN;
  return Math.round(f*100);
}
const moneyIn=c=>c==null?'':(c/100).toFixed(2).replace('.',',');

/* ---------- banco ---------- */
const Api={
  async auth(path,body){
    const r=await fetch(CFG.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Object.assign(new Error(j.msg||j.error_description||'erro'),{status:r.status});
    return {access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};
  },
  saveSess(s){S.sess=s;lsSet('fin-sess',s?JSON.stringify(s):'');},
  async token(){
    if(!S.sess)throw Object.assign(new Error('login'),{status:401});
    if(S.sess.exp-Date.now()<60000){
      try{this.saveSess(await this.auth('token?grant_type=refresh_token',{refresh_token:S.sess.refresh}));}
      catch(e){if(e.status>=400&&e.status<500){this.saveSess(null);throw Object.assign(e,{status:401});}throw e;}
    }
    return S.sess.access;
  },
  async rest(path,opt){
    const t=await this.token();
    const h=Object.assign({apikey:CFG.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{});
    return fetch(CFG.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));
  },
  async load(){
    const r=await this.rest('fin_records?select=*&deleted_at=is.null&order=created_at.asc&limit=5000');
    if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error(j.message||'erro'),{status:r.status,code:j.code});}
    S.recs=await r.json(); lsSet('fin-cache',JSON.stringify(S.recs)); finSyncSoon(false);
  },
  async blob(path){
    const t=await this.token();
    const r=await fetch(CFG.url+'/storage/v1/object/authenticated/anexos/'+path,{headers:{apikey:CFG.key,Authorization:'Bearer '+t}});
    if(!r.ok)throw new Error('Não consegui abrir o arquivo ('+r.status+').');
    return r.blob();
  },
  async create(kind,data){
    const r=await this.rest('fin_records',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({kind,data})});
    if(!r.ok)throw new Error('Não consegui salvar ('+r.status+').');
    const j=await r.json(); S.recs.push(j[0]); lsSet('fin-cache',JSON.stringify(S.recs)); if(kind==='debt')finSyncSoon(true); return j[0];
  },
  async update(rec,data){
    undoNote('update',rec,data);
    const r=await this.rest('fin_records?id=eq.'+rec.id+'&version=eq.'+rec.version,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data})});
    if(!r.ok)throw new Error('Não consegui salvar ('+r.status+').');
    const j=await r.json();
    if(!j.length){await this.load();throw new Error('Este item mudou em outro aparelho. Atualizei a tela. Tente de novo.');}
    const i=S.recs.findIndex(x=>x.id===rec.id); if(i>=0)S.recs[i]=j[0]; lsSet('fin-cache',JSON.stringify(S.recs)); if(rec.kind==='debt')finSyncSoon(true); return j[0];
  },
  async undelete(id,data){
    const r=await this.rest('fin_records?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({deleted_at:null,data})});
    if(!r.ok)throw new Error('Não consegui desfazer ('+r.status+').');
    await this.load();
  },
  async remove(rec){
    undoNote('remove',rec,null);
    const r=await this.rest('fin_records?id=eq.'+rec.id+'&version=eq.'+rec.version,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({deleted_at:new Date().toISOString()})});
    if(!r.ok)throw new Error('Não consegui apagar ('+r.status+').');
    const j=await r.json();
    if(!j.length){await this.load();throw new Error('Este item mudou em outro aparelho. Atualizei a tela.');}
    S.recs=S.recs.filter(x=>x.id!==rec.id); lsSet('fin-cache',JSON.stringify(S.recs)); if(rec.kind==='debt')finSyncSoon(true);
  }
};

/* Formulário genérico. campos: {k,label,type:text|money|int|date|check|select,opts,hint,req,max}. onDelete opcional. */
function form(title,fields,vals,opts){
  opts=opts||{};vals=vals||{};
  return new Promise(res=>{
    const inp=f=>{
      const v=vals[f.k];
      if(f.type==='check')return '<label class="chk"><input type="checkbox" id="f-'+f.k+'"'+(v?' checked':'')+'> '+esc(f.label)+'</label>';
      let h='<label class="f" for="f-'+f.k+'">'+esc(f.label)+(f.req?' *':'')+'</label>';
      if(f.type==='select')h+='<select class="in" id="f-'+f.k+'">'+f.opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
      else{
        const t=f.type==='date'?'date':'text';
        const im=(f.type==='money')?'decimal':(f.type==='int'?'numeric':'text');
        const val=f.type==='money'?moneyIn(v):(v==null?'':v);
        h+='<input class="in" id="f-'+f.k+'" type="'+t+'" inputmode="'+im+'" autocomplete="off" value="'+esc(val)+'">';
      }
      if(f.hint)h+='<div class="hint">'+esc(f.hint)+'</div>';
      return h;
    };
    const m=modal('<h3>'+esc(title)+'</h3>'+fields.map(inp).join('')+'<div class="err" id="f-err" role="alert"></div>'
      +'<button class="btn" id="f-ok">Salvar</button><button class="btn sec" id="f-no">Voltar</button>'
      +(opts.onDelete?'<button class="btn bad" id="f-del">Apagar</button>':''));
    const err=t=>{m.querySelector('#f-err').textContent=t;};
    m.querySelector('#f-no').onclick=()=>{m.remove();res(null);};
    if(opts.onDelete)m.querySelector('#f-del').onclick=async()=>{m.remove();await opts.onDelete();res(null);};
    m.querySelector('#f-ok').onclick=async()=>{
      const out={};
      for(const f of fields){
        const el=m.querySelector('#f-'+f.k);
        if(f.type==='check'){out[f.k]=el.checked;continue;}
        let v=el.value.trim();
        if(f.type==='money'){v=parseMoney(v);if(Number.isNaN(v)){err('Valor inválido em “'+f.label+'”. Exemplo: 1.234,56');return;}if(f.req&&v==null){err('Preencha “'+f.label+'”.');return;}}
        else if(f.type==='int'){if(v===''){v=null;if(f.req){err('Preencha “'+f.label+'”.');return;}}else{v=Number(v);if(!Number.isInteger(v)||v<(f.min==null?0:f.min)||v>(f.max||999)){err('Número inválido em “'+f.label+'”.');return;}}}
        else if(f.type==='select'){}
        else if(f.req&&!v){err('Preencha “'+f.label+'”.');return;}
        out[f.k]=v;
      }
      if(opts.validate){const e=opts.validate(out);if(e){err(e);return;}}
      const lines=opts.summary?opts.summary(out):[];
      const ok=await confirmBox('Confira antes de salvar',lines,'Sim, salvar');
      if(!ok)return;
      const b=m.querySelector('#f-ok');b.disabled=true;b.textContent='Salvando…';
      try{await opts.save(out);m.remove();res(out);render();}
      catch(e){b.disabled=false;b.textContent='Salvar';err(e.message||'Erro ao salvar.');}
    };
    const first=m.querySelector('.in');if(first&&!vals[fields[0].k])setTimeout(()=>first.focus(),50);
  });
}

/* ---------- regras: cartões ---------- */
const invYmFor=(date,closeDay)=>(+date.slice(8,10)<=closeDay)?ymOf(date):addMonths(ymOf(date),1);
function dueDateFor(card,ym){return card.dueDay>card.closeDay?dateOf(ym,card.dueDay):dateOf(addMonths(ym,1),card.dueDay);}
function cardCalc(cardRec){
  const c=cardRec.data,inv={};
  const add=(ym,it)=>{(inv[ym]=inv[ym]||{ym,totalC:0,items:[]});inv[ym].totalC+=it.amountC;inv[ym].items.push(it);};
  byKind('charge').filter(x=>x.data.cardId===cardRec.id).forEach(ch=>{
    const d=ch.data,n=Math.max(1,d.n||1),base=invYmFor(d.date,c.closeDay);
    let per=Math.trunc(d.totalC/n),first=d.totalC-per*(n-1);
    if(n>1&&d.firstC!=null){first=d.firstC;per=Math.trunc((d.totalC-first)/(n-1));first=d.totalC-per*(n-1);}
    for(let i=0;i<n;i++)add(addMonths(base,i),{rec:ch,desc:d.desc,date:d.date,parcela:i+1,n,amountC:i===0?first:per,by:d.by});
  });
  const paid=new Set(byKind('invpay').filter(x=>x.data.cardId===cardRec.id).map(x=>x.data.ym));
  const openYm=invYmFor(todayIso(),c.closeDay);
  let used=0;Object.values(inv).forEach(v=>{v.paid=paid.has(v.ym);if(!v.paid)used+=v.totalC;});
  paid.forEach(ym=>{if(!inv[ym])inv[ym]={ym,totalC:0,items:[],paid:true};});
  if(!inv[openYm])inv[openYm]={ym:openYm,totalC:0,items:[],paid:paid.has(openYm)};
  const avail=c.limitC==null?null:c.limitC-used;
  return {inv,openYm,used,avail};
}
function invStatus(card,v,openYm){
  if(v.paid)return {t:'Paga',c:'ok'};
  if(v.ym===openYm)return {t:'Aberta',c:''};
  if(v.ym>openYm)return {t:'Futura',c:''};
  return dueDateFor(card,v.ym)<todayIso()?{t:'Em atraso',c:'bad'}:{t:'Fechada · a pagar',c:'warn'};
}

/* ---------- plano de quitação (simulação, não é promessa) ---------- */
function simulate(debts,capC,order){
  const ds=debts.map(d=>({id:d.id,name:d.data.creditor,bal:d.data.balanceC,min:d.data.installC||0,rate:(d.data.rateBp==null?0:d.data.rateBp/10000),unk:d.data.rateBp==null,paidMonth:null}));
  const prio=(a,b)=>order==='snow'?(a.bal-b.bal):((b.rate-a.rate)||(a.bal-b.bal));
  let total=0,interest=0,month=0,deficit=false;
  while(ds.some(x=>x.bal>0)&&month<600){
    month++;
    ds.forEach(x=>{if(x.bal>0){const i=Math.round(x.bal*x.rate);x.bal+=i;interest+=i;}});
    let budget=capC;const act=ds.filter(x=>x.bal>0).sort(prio);
    for(const x of act){const want=Math.min(x.min,x.bal),p=Math.min(want,budget);x.bal-=p;budget-=p;total+=p;if(p<want)deficit=true;}
    for(const x of act){if(budget<=0)break;const p=Math.min(x.bal,budget);if(p>0){x.bal-=p;budget-=p;total+=p;}}
    ds.forEach(x=>{if(x.bal<=0&&x.paidMonth==null)x.paidMonth=month;});
  }
  return {months:month,done:!ds.some(x=>x.bal>0),total,interest,deficit,ds,anyUnk:ds.some(x=>x.unk)};
}

const monthsTxt=n=>{const a=Math.floor(n/12),m=n%12;return (a?a+(a>1?' anos':' ano'):'')+(a&&m?' e ':'')+(m?m+(m>1?' meses':' mês'):(a?'':'0 mês'));};
function vPlan(){
  const ds=byKind('debt').filter(d=>d.data.status!=='PAGA'&&d.data.dir!=='RECEBER'&&mine(d.data));
  const ok=ds.filter(d=>d.data.balanceC!=null&&d.data.balanceC>0),semSaldo=ds.filter(d=>d.data.balanceC==null);
  const cfg=cfgRec(),cap=cfg?cfg.data.capacityC:null;
  let h=header('Plano de quitação')+'<p class="sub">Simulação. Não é promessa e não negocia nada.</p>'+whoBar()+'<div class="wrap">';
  h+='<div class="card"><div class="row"><span class="mut">Quanto dá para pagar por mês</span><b>'+money(cap)+'</b></div><div class="mut">Valor que você consegue separar para as dívidas todo mês.</div></div>';
  h+='<button class="btn" data-act="cap-set">'+(cap==null?'Informar quanto dá para pagar por mês':'Mudar o valor por mês')+'</button>';
  if(!ok.length){h+='<div class="card mut">Nenhuma dívida com saldo cadastrado '+(S.who!=='ALL'?'para '+esc(pname(S.who)):'')+'. Cadastre em Dívidas.</div>';return h+'</div>';}
  const mins=ok.reduce((a,d)=>a+(d.data.installC||0),0),tot=ok.reduce((a,d)=>a+d.data.balanceC,0);
  h+='<div class="card"><div class="row"><span class="mut">Dívidas com saldo</span><b>'+ok.length+'</b></div><div class="row"><span class="mut">Total devido (saldos)</span><b>'+money(tot)+'</b></div><div class="row"><span class="mut">Soma das parcelas por mês</span><b>'+money(mins)+'</b></div></div>';
  if(semSaldo.length)h+='<div class="note">'+semSaldo.length+' dívida(s) sem saldo informado ficaram fora da conta: '+esc(semSaldo.map(d=>d.data.creditor).join(', '))+'.</div>';
  if(cap==null){h+='<div class="note">Informe quanto dá para pagar por mês para ver os cenários.</div>';return h+'</div>';}
  if(cap<mins)h+='<div class="note" style="background:var(--danger-soft);color:var(--danger)"><b>Falta dinheiro:</b> as parcelas somam '+money(mins)+' e você separou '+money(cap)+'. Faltam '+money(mins-cap)+' por mês. Algumas parcelas ficam sem pagar e os juros crescem.</div>';
  const unk=ok.filter(d=>d.data.rateBp==null).length;
  if(unk)h+='<div class="note">Faltam os juros de '+unk+' dívida(s). Elas entram na conta sem juros, então o tempo e o custo reais podem ser maiores. O custo total fica “Não informado”.</div>';
  const rs={};
  [['snow','Menor saldo primeiro','Quita as pequenas rápido, uma por uma.'],['aval','Maior juros primeiro','Costuma custar menos quando os juros são conhecidos.']].forEach(sc=>{
    const r=simulate(ok,cap,sc[0]);rs[sc[0]]=r;
    h+='<h2 style="margin-left:0">'+esc(sc[1])+'</h2><div class="card"><div class="mut">'+esc(sc[2])+'</div>';
    if(!r.done)h+='<div class="err" style="margin-top:.5rem">Com '+money(cap)+' por mês não quita em 50 anos: o valor mal cobre os juros.</div>';
    else{
      h+='<div class="row" style="margin-top:.4rem"><span class="mut">Tudo quitado em</span><b>'+monthsTxt(r.months)+'</b></div><div class="row"><span class="mut">Por volta de</span><b>'+esc(ymLabel(addMonths(ymOf(todayIso()),r.months)))+'</b></div>'
        +'<div class="row"><span class="mut">Total pago (estimado)</span><b>'+money(r.total)+'</b></div>'
        +'<div class="row"><span class="mut">Juros no caminho</span><b>'+(r.anyUnk?'Não informado':money(r.interest))+'</b></div>';
      h+='<div class="mut" style="margin-top:.5rem">Ordem em que cada dívida some:</div>';
      r.ds.slice().sort((a,b)=>a.paidMonth-b.paidMonth).forEach((x,i)=>{const pct=Math.max(6,Math.round(100*x.paidMonth/Math.max(1,r.months)));h+='<div class="row" style="margin-top:.35rem"><span>'+(i+1)+'. '+esc(x.name)+'</span><span class="mut">'+esc(ymLabel(addMonths(ymOf(todayIso()),x.paidMonth)))+' · mês '+x.paidMonth+'</span></div><div class="plan-bar"><i style="width:'+pct+'%"></i></div>';});
    }
    h+='</div>';
  });
  if(rs.snow&&rs.aval&&rs.snow.done&&rs.aval.done&&!rs.snow.anyUnk&&!rs.aval.anyUnk){const dif=rs.snow.total-rs.aval.total;h+='<div class="note"><b>Comparando os dois caminhos:</b> '+(dif>0?'escolhendo “Maior juros primeiro” você paga cerca de '+money(dif)+' a menos no total.':(dif<0?'escolhendo “Menor saldo primeiro” você paga cerca de '+money(-dif)+' a menos no total.':'os dois custam o mesmo.'))+'</div>';}
  h+='<div class="note">Isto é só conta. Não inclui desconto de negociação nem multa. Antes de pagar ou renegociar, confira com o banco. O FIN não paga nada.</div>';
  return h+'</div>';
}

const pendList=()=>byKind('proposal').filter(r=>r.data&&r.data.text&&r.data.status==='pendente');
function parseText(t){
  const norm=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let work=t;
  const nm=norm.match(/(\d{1,2})\s*x\b/)||norm.match(/(\d{1,2})\s*parcelas?/);
  const dm=norm.match(/(?:dia|vence(?:\s+dia)?)\s+(\d{1,2})\b/);
  work=work.replace(/\b\d{1,2}\s*x\b/gi,' ').replace(/\b\d{1,2}\s*parcelas?\b/gi,' ').replace(/(?:dia|vence(?:\s+dia)?)\s+\d{1,2}\b/gi,' ');
  const mm=work.match(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{2})?|\d+(?:,\d{2})?)/);
  let amountC=null;if(mm){const v=parseMoney(mm[1]);if(!Number.isNaN(v))amountC=v;}
  let type='';
  if(/divida|devo\b|emprestimo|consignad/.test(norm))type='debt';
  const recv=/me devem?\b|a receber|vou receber|receber\b/.test(norm);if(recv)type='debt';
  else if(/cartao|\bx\b|\d\s*x\b|parcel|fatura/.test(norm))type='charge';
  else if(/conta|vence|boleto|\bluz\b|agua|\bgas\b|internet|aluguel|telefone/.test(norm))type='bill';
  const nz=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const STOP=new Set(['cartao','do','da','de','no','na']);
  const wordsOf=x=>nz(x).split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w));
  const tw=new Set(wordsOf(t));
  let card=null,best=0,matched=[];
  byKind('card').forEach(c=>{const ws=wordsOf(c.data.name),hit=ws.filter(w=>tw.has(w));if(hit.length>best){best=hit.length;card=c;matched=hit;}});
  if(!card&&byKind('card').length===1)card=byKind('card')[0];
  let date=todayIso();
  if(/ontem/.test(norm))date=isoDate(new Date(Date.now()-864e5));
  const dd=norm.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(dd){const y=dd[3]?(dd[3].length===2?'20'+dd[3]:dd[3]):String(new Date().getFullYear());date=y+'-'+pad(+dd[2])+'-'+pad(+dd[1]);}
  let desc=t.replace(/\b\d{1,2}\s*x\b/gi,' ').replace(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{2})?|\d+(?:,\d{2})?)/g,' ').replace(/\b\d{1,2}\s*x\b/gi,' ').replace(/\b(no|na|do|da|de|cart[aã]o|cartao|parcelado|parcelas?|vence|dia|ontem|hoje)\b/gi,' ').replace(/\s+/g,' ').trim();
  matched.forEach(w=>{desc=desc.split(/\s+/).filter(x=>nz(x).replace(/[^a-z0-9]/g,'')!==w).join(' ');});
  desc=desc.replace(/\b(d[ií]vida|conta|devo)\b/gi,' ').replace(/[^\p{L}\p{N}\s()+-]/gu,' ').replace(/\s+/g,' ').trim()||t.slice(0,40);
  return {type,amountC,n:nm?+nm[1]:1,dueDay:dm?+dm[1]:null,card,date,desc,recv};
}

function upcoming(){
  const td=todayIso(),lim=isoDate(new Date(Date.now()+30*864e5)),out=[];
  monthRows(ymOf(td)).filter(x=>!x.r.data.paidAt&&mine(x.bill.data)).forEach(x=>{const dt=billDue(x);if(dt<=lim)out.push({dt,kind:'Conta',name:x.bill.data.name,c:x.r.data.amountC,late:dt<td});});
  byKind('card').filter(c=>mine(c.data)).forEach(cr=>{const k=cardCalc(cr);Object.values(k.inv).filter(v=>!v.paid&&v.ym<=k.openYm&&v.totalC>0).forEach(v=>{const dt=dueDateFor(cr.data,v.ym);if(dt<=lim)out.push({dt,kind:'Fatura',name:cr.data.name+' · '+ymShort(v.ym),c:v.totalC,late:dt<td});});});
  byKind('debt').filter(d=>d.data.dueDay&&mine(d.data)).forEach(d=>{const dt=debtNext(d.data,true),rv=d.data.dir==='RECEBER';if(dt&&dt<=lim)out.push({dt,kind:rv?'A receber':'Dívida',recv:rv,name:d.data.creditor,c:d.data.installC,late:dt<td||d.data.status==='ATRASADA'});});
  return out.sort((a,b)=>a.dt<b.dt?-1:1);
}

const mdiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const DOWS=['dom','seg','ter','qua','qui','sex','sáb'];

function debtFirst(x){

function debtOwes(x,ym){
  if(!x.dueDay||x.status==='PAGA')return false;
  const f=debtFirst(x);if(ym<f)return false;
  if(x.balanceC!=null&&x.installC)return mdiff(f,ym)<Math.ceil(x.balanceC/x.installC);
  return true;
}
function debtNext(x,afterToday){
  const td=todayIso();let m=debtFirst(x);
  for(let i=0;i<36;i++,m=addMonths(m,1)){
    if(!debtOwes(x,m))continue;
    const dt=dateOf(m,x.dueDay);
    if(afterToday&&dt<td&&x.status!=='ATRASADA')continue;
    return dt;
  }

}
/* marcar a parcela do mês como paga (ou desfazer): o saldo diminui (ou volta) do valor da parcela */
function debtPayData(x,ym,undo){
  const was=(x.paidYm||[]).indexOf(ym)>=0,n=Object.assign({},x),paid=(x.paidYm||[]).filter(m=>m!==ym);
  if(!undo){

    if(x.balanceC!=null&&x.installC){n.balanceC=Math.max(0,x.balanceC-x.installC);if(n.balanceC===0)n.status='PAGA';}
  }else if(was){
    if(x.balanceC!=null&&x.installC)n.balanceC=x.balanceC+x.installC;

/* ---------- lembretes automáticos no Núcleo (regra do Marcelo: 1 dia antes do vencimento, às 09:00, com alarme) ---------- */
const REM_TIME='09:00';
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
const isoMinus1=iso=>isoDate(new Date(new Date(iso+'T12:00:00').getTime()-864e5));
const plain=t=>String(t).replace(/\u00a0/g,' ');
async function itemsGet(q){
  const r=await Api.rest('items?'+q);
  if(!r.ok)throw new Error('lembretes '+r.status);
  return r.json();
}
async function itemsPatch(ex,body){
  const r=await Api.rest('items?id=eq.'+ex.id+'&version=eq.'+ex.version,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('lembretes '+r.status);
  return r.json();
}
async function finListId(create){
  const l=await itemsGet('kind=eq.list&deleted_at=is.null&data->>fin=eq.true&select=id,data&limit=1');
  if(l.length)return l[0].data._id||l[0].id;
  if(!create)return null;
  const id=uuid(),now=Date.now();
  const r=await Api.rest('items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,kind:'list',data:{_id:id,name:'FIN — vencimentos',color:'#1FC95B',sections:[],fin:true,createdAt:now,updatedAt:now}})});
  if(!r.ok)throw new Error('lista do FIN '+r.status);
  return id;
}
/* o que o lembrete desta dívida deve ser (ou null: sem lembrete) */
function remSpecForDebt(d){
  const x=d.data;if(x.status==='PAGA'||!x.dueDay)return null;
  const due=debtNext(x,true);if(!due)return null;
  const rv=x.dir==='RECEBER',td=todayIso();
  let date=isoMinus1(due);if(date<td)date=td;
  const val=x.installC!=null?' · '+plain(money(x.installC)):'';
  return {
    title:(rv?'Receber de ':'Pagar parcela — ')+x.creditor+val+' (vence dia '+x.dueDay+')',
    notes:'Lembrete automático do FIN: 1 dia antes do vencimento, às '+REM_TIME+'. '+(rv?'Depois de receber, marque no FIN: Mês › a parcela › Marcar como recebida.':'Depois de pagar, marque no FIN: Mês › a parcela › Marcar como paga.'),
    date,remaining:(x.balanceC!=null&&x.installC)?Math.ceil(x.balanceC/x.installC):0
  };
}
function remDataFor(d,spec,listId,old,resched){
  const x=d.data,o=old||{};
  const repDone=(!old||resched)?0:(parseInt(o.repDone,10)||0);
  let repTimes=parseInt(o.repTimes,10)||0;
  if(!old||resched||(o.finRem||0)!==spec.remaining)repTimes=spec.remaining?repDone+spec.remaining:0;
  return Object.assign({},o,{
    title:spec.title,notes:spec.notes,date:(!old||resched)?spec.date:o.date,time:REM_TIME,
    repeat:'monthly',repN:1,repU:'week',repDays:[],repUntil:'',repTimes,repDone,
    agenda:false,list:listId,section:'',flag:false,priority:2,alarms:[{id:'a-fin',min:0}],
    subtasks:o.subtasks||[],images:o.images||[],done:false,
    finRef:d.id,finDueDay:x.dueDay,finFirstDue:x.firstDue||'',finRem:spec.remaining,updatedAt:Date.now()
  });
}
const remKey=o=>JSON.stringify([o.title,o.notes,o.date,o.time,o.repeat,o.repTimes,o.repDone,o.list,!!o.done,JSON.stringify(o.alarms),o.finDueDay,o.finFirstDue||'',o.finRem]);
/* confere TODAS as dívidas e deixa 1 lembrete por dívida no Núcleo (cria, atualiza ou tira) */
async function syncFinReminders(){
  if(!S.sess||S.syncRem)return;
  S.syncRem=true;S.remLast=Date.now();
  try{
    const debts=S.recs.filter(r=>r.kind==='debt');
    const have=await itemsGet('kind=eq.reminder&deleted_at=is.null&data->>finRef=not.is.null&select=id,version,data&limit=1000');
    const byRef={};have.forEach(x=>{byRef[x.data.finRef]=x;});
    const map={};let listId=null;
    for(const d of debts){
      const spec=remSpecForDebt(d),ex=byRef[d.id];
      if(!spec){if(ex)await itemsPatch(ex,{deleted_at:new Date().toISOString()});continue;}
      if(!listId)listId=await finListId(true);
      if(!ex){
        const id=uuid();
        const data=Object.assign(remDataFor(d,spec,listId,null,true),{_id:id,createdAt:Date.now()});
        const r=await Api.rest('items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,kind:'reminder',data})});
        if(!r.ok)throw new Error('lembretes '+r.status);
        map[d.id]=true;continue;
      }
      const o=ex.data,x=d.data;
      const resched=(o.finDueDay!==x.dueDay)||((o.finFirstDue||'')!==(x.firstDue||''))||!!o.done;
      const next=remDataFor(d,spec,listId,o,resched);
      if(remKey(next)!==remKey(o))await itemsPatch(ex,{data:next});
      map[d.id]=true;
    }
    for(const ref of Object.keys(byRef)){if(!debts.some(d=>d.id===ref))await itemsPatch(byRef[ref],{deleted_at:new Date().toISOString()});}
    S.remMap=map;S.remErr='';
  }catch(e){S.remErr=e.message||'erro';}
  finally{S.syncRem=false;}
  try{if(!document.querySelector('.modal'))render();}catch(e){}
}
let finSyncT=null;
function finSyncSoon(force){
  if(!S.sess)return;
  if(!force&&Date.now()-(S.remLast||0)<20000)return;
  clearTimeout(finSyncT);finSyncT=setTimeout(()=>{syncFinReminders();},force?300:800);
}
/* ao marcar a parcela como paga/recebida no FIN, o lembrete daquele mês também anda (se ainda não andou) */
async function bumpFinReminder(debtId,ym,x){
  const l=await itemsGet('kind=eq.reminder&deleted_at=is.null&data->>finRef=eq.'+debtId+'&select=id,version,data&limit=1');
  const ex=l[0];if(!ex)return;
  const o=ex.data,remDate=isoMinus1(dateOf(ym,x.dueDay));
  if(o.done||o.date>remDate)return;
  const used=(parseInt(o.repDone,10)||0)+1,max=parseInt(o.repTimes,10)||0,nd=Object.assign({},o,{repDone:used,updatedAt:Date.now()});
  if(max&&used>=max){nd.done=true;nd.doneAt=Date.now();}
  else nd.date=dateOf(addMonths(o.date.slice(0,7),1),+o.date.slice(8,10));
  await itemsPatch(ex,{data:nd});
}

/* ---------- extratos (Mobills .xlsx) ---------- */
const ST_KIND={INCOME:'Renda',EXPENSE:'Gasto',TRANSFER:'Transferência',CARD_SETTLEMENT:'Pagou fatura',LOAN_DISBURSEMENT:'Empréstimo recebido'};
const stNorm=x=>String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}
function stClassify(desc,cat,c){
  const d=stNorm(desc),k=stNorm(cat);
  if(c>0){if(k==='salario'||k==='renda extra')return 'INCOME';if(d.startsWith('credito liberado'))return 'LOAN_DISBURSEMENT';return 'TRANSFER';}
  if(k==='transferencia enviada'||k==='pix'||k==='investimento')return 'TRANSFER';
  if(d.indexOf('fatura')>=0)return 'CARD_SETTLEMENT';
  return 'EXPENSE';
}
/* leitor mínimo de .xlsx (primeira planilha, só valores) */
async function xlsxRows(buf){
  if(buf.byteLength>5000000)throw new Error('Arquivo grande demais.');
  if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não abre .xlsx. Use o Safari atualizado.');
  const b=new Uint8Array(buf),v=new DataView(buf),u16=o=>v.getUint16(o,true),u32=o=>v.getUint32(o,true);
  let eo=-1;for(let i=b.length-22;i>=Math.max(0,b.length-22-65535);i--)if(u32(i)===0x06054b50){eo=i;break;}
  if(eo<0)throw new Error('Não é um arquivo .xlsx.');
  const cnt=u16(eo+10);let p=u32(eo+16);const ents=[];
  for(let i=0;i<cnt;i++){
    if(u32(p)!==0x02014b50)throw new Error('Arquivo corrompido.');
    const nl=u16(p+28),el=u16(p+30),cl=u16(p+32);
    ents.push({name:new TextDecoder().decode(b.subarray(p+46,p+46+nl)),method:u16(p+10),size:u32(p+20),off:u32(p+42)});p+=46+nl+el+cl;
  }
  const rd=async e=>{
    if(u32(e.off)!==0x04034b50)throw new Error('Arquivo corrompido.');
    const st=e.off+30+u16(e.off+26)+u16(e.off+28),raw=b.subarray(st,st+e.size);
    if(e.method===0)return new TextDecoder().decode(raw);
    if(e.method!==8)throw new Error('Compressão não suportada.');
    const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(raw).catch(()=>{});w.close().catch(()=>{});
    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  };
  const un=t=>t.replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g,(m,g)=>g==='amp'?'&':g==='lt'?'<':g==='gt'?'>':g==='quot'?'"':g==='apos'?"'":String.fromCodePoint(g[1]==='x'?parseInt(g.slice(2),16):parseInt(g.slice(1),10)));
  const tx=x=>Array.from(x.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)).map(m=>un(m[1])).join('');
  const sheet=ents.find(e=>e.name==='xl/worksheets/sheet1.xml')||ents.filter(e=>/^xl\/worksheets\/[^/]+\.xml$/.test(e.name)).sort((a,c)=>a.name<c.name?-1:1)[0];
  if(!sheet)throw new Error('Não achei a planilha.');
  const se=ents.find(e=>e.name==='xl/sharedStrings.xml');
  const sh=se?Array.from((await rd(se)).matchAll(/<si>([\s\S]*?)<\/si>|<si\s*\/>/g)).map(m=>tx(m[1]||'')):[];
  const xml=await rd(sheet),rows=[];
  for(const rm of xml.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
    const row=[];
    for(const c of (rm[1]||'').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const at=c[1],ref=(/\br="([A-Z]+)\d+"/.exec(at)||[])[1],ty=(/\bt="(\w+)"/.exec(at)||[])[1],bd=c[2]||'',vv=(/<v>([\s\S]*?)<\/v>/.exec(bd)||[])[1];
      if(!ref)throw new Error('Célula inválida.');
      let val=null;
      if(ty==='s'){if(vv===undefined||sh[Number(vv)]===undefined)throw new Error('Texto ausente na planilha.');val=sh[Number(vv)];}
      else if(ty==='inlineStr')val=tx(bd);
      else if(ty==='str')val=vv===undefined?null:un(vv);
      else if(ty==='b'||ty==='e')throw new Error('Tipo de célula não suportado.');
      else if(vv!==undefined){val=Number(vv);if(!isFinite(val))throw new Error('Número inválido.');}
      let n=0;for(const ch of ref)n=n*26+(ch.charCodeAt(0)-64);n--;
      while(row.length<=n)row.push(null);row[n]=val;
    }
    rows.push(row);
  }
  return rows;
}
/* Mobills "Relatório de transações": Data, Descrição, Valor, Conta, Categoria, Subcategoria, Tags */
function mobillsParse(rows){
  const H=['data','descricao','valor','conta','categoria','subcategoria','tags'];
  const head=(rows[0]||[]).map(stNorm);
  if(H.some((h,i)=>head[i]!==h))throw new Error('As colunas não são as do relatório de transações do Mobills (Data, Descrição, Valor, Conta, Categoria, Subcategoria, Tags).');
  const body=[];rows.slice(1).forEach((r,i)=>{if(r.some(c=>c!==null&&c!==''))body.push({r:r,line:i+2});});
  if(!body.length)throw new Error('O arquivo não tem lançamentos.');
  if(body.length>10000)throw new Error('Lançamentos demais (máximo 10.000).');
  const occ={},accts={};
  body.forEach(x=>{
    const r=x.r,line=x.line,m=typeof r[0]==='string'?/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(r[0].trim()):null;
    if(!m)throw new Error('Data inválida na linha '+line+'.');
    const date=m[3]+'-'+m[2]+'-'+m[1];if(isNaN(new Date(date+'T00:00:00Z'))||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date)throw new Error('Data inválida na linha '+line+'.');
    const v=r[2],c=Math.round(v*100);
    if(typeof v!=='number'||!isFinite(v)||Math.abs(v*100-c)>1e-6||c===0)throw new Error('Valor inválido na linha '+line+'.');
    const acct=String(r[3]==null?'':r[3]).trim();if(!acct)throw new Error('Conta ausente na linha '+line+'.');
    const desc=String(r[1]==null?'':r[1]),cat=String(r[4]==null?'':r[4]);
    const content=JSON.stringify([date,c,stNorm(desc),stNorm(acct),stNorm(cat),stNorm(r[5])]);
    occ[content]=(occ[content]||0)+1;
    (accts[acct]=accts[acct]||[]).push({i:date+'-'+fnv(content)+'-'+occ[content],d:date,c:c,k:stClassify(desc,cat,c),t:desc.slice(0,80),g:cat.slice(0,40)});
  });
  return {accts:accts,rows:body.length,dupGroups:Object.keys(occ).filter(k=>occ[k]>1).length};
}
function stPlan(parsed,holder){
  const out=[];
  for(const name of Object.keys(parsed.accts)){
    const ents=parsed.accts[name];
    const rec=S.recs.find(r=>r.kind==='stmt'&&r.data.account===name);
    if(rec&&rec.data.holder&&rec.data.holder!==holder)throw new Error('A conta “'+name+'” já está salva como de '+pname(rec.data.holder)+'.');
    const old={};(rec?rec.data.entries:[]).forEach(e=>{old[e.i]=e;});
    let add=0,same=0;
    for(const e of ents){
      const o=old[e.i];
      if(o){if(o.c!==e.c||o.d!==e.d||o.k!==e.k)throw new Error('Conflito: um lançamento já salvo veio diferente. Nada foi gravado.');same++;}
      else add++;
    }
    out.push({name:name,rec:rec,ents:ents,add:add,same:same});
  }
  return out;
}
async function stApply(plan,holder){
  for(const x of plan){
    if(!x.add)continue;
    const have={};(x.rec?x.rec.data.entries:[]).forEach(e=>{have[e.i]=1;});
    const merged=(x.rec?x.rec.data.entries.slice():[]).concat(x.ents.filter(e=>!have[e.i]));
    merged.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
    const data={account:x.name,holder:holder,source:'mobills',entries:merged};
    if(x.rec)await Api.update(x.rec,data);else await Api.create('stmt',data);
  }
}
async function stImport(file){
  let parsed;
  try{parsed=mobillsParse(await xlsxRows(await file.arrayBuffer()));}
  catch(e){S.msg='Não consegui ler o arquivo: '+e.message;render();return;}
  const names=Object.keys(parsed.accts);
  const dates=[].concat.apply([],names.map(n=>parsed.accts[n].map(e=>e.d))).sort();
  const cnt={};names.forEach(n=>parsed.accts[n].forEach(e=>{cnt[e.k]=(cnt[e.k]||0)+1;}));
  const first=[
    parsed.rows+' lançamentos, de '+brDate(dates[0])+' até '+brDate(dates[dates.length-1])+'.',
    'Contas no arquivo: '+names.join(', ')+'.'
  ].concat(Object.keys(ST_KIND).filter(k=>cnt[k]).map(k=>ST_KIND[k]+': '+cnt[k]));
  if(parsed.dupGroups)first.push('Há '+parsed.dupGroups+' grupo(s) de linhas iguais. Elas ficam como lançamentos separados.');
  await form('Importar extrato do Mobills',[{k:'holder',label:'De quem são estas contas?',type:'select',opts:PEOPLE,hint:first.join('\n')}],{holder:defHolder()||'MARCELO'},{
    validate:o=>{try{stPlan(parsed,o.holder);}catch(e){return e.message;}return '';},
    summary:o=>{const pl=stPlan(parsed,o.holder);return ['Contas de: '+pname(o.holder)].concat(pl.map(x=>x.name+': '+x.add+' novos, '+x.same+' já existiam')).concat(['Nada é pago nem alterado no banco.']);},
    save:async o=>{await stApply(stPlan(parsed,o.holder),o.holder);}
  });
}

/* ---------- chat financeiro ---------- */
const CHAT_KINDS=['card','charge','invpay','bill','billmonth','debt','proposal','stmt'];
function chatSnapshot(){
  return JSON.stringify({fin_snapshot:1,gerado_em:new Date().toISOString(),
    regras:['debt.dir = PAGAR (padrão: eu devo) ou RECEBER (me devem); debt.paidYm = meses AAAA-MM já pagos ou recebidos; debt.firstDue = data da 1ª parcela.','Valores em centavos inteiros (R$ 10,50 = 1050). Dado ausente = null, nunca 0.','holder = MARCELO ou MARLENE (devedor/titular); payer = quem paga hoje.','Para mudar algo, devolva JSON {"fin_ops":1,"ops":[...]} com op create (kind,data), update (id,data = campos a mudar) ou delete (id). Máximo 60 ops.','Marcelo confere e confirma antes de salvar. O FIN nunca paga nem move dinheiro.','kinds: card, charge, invpay, bill, billmonth, debt, proposal (proposal com data.cfg=capacity guarda quanto dá para pagar por mês: capacityC).'],
    registros:S.recs.map(r=>({id:r.id,kind:r.kind,version:r.version,data:r.data}))},null,1);
}
function chatParse(txt){
  let t=String(txt||'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('Não achei o JSON no texto colado.');
  let j;try{j=JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('O JSON colado está quebrado.');}
  if(!j||j.fin_ops!==1||!Array.isArray(j.ops)||!j.ops.length)throw new Error('Não é um pacote de mudanças do FIN.');
  if(j.ops.length>60)throw new Error('Mudanças demais de uma vez (máximo 60).');
  return j.ops.map(o=>{
    if(!o||typeof o!=='object')throw new Error('Mudança inválida.');
    if(o.op==='create'){if(CHAT_KINDS.indexOf(o.kind)<0||!o.data||typeof o.data!=='object')throw new Error('Criar: tipo ou dados inválidos.');return o;}
    if(o.op==='update'||o.op==='delete'){const r=S.recs.find(x=>x.id===o.id);if(!r)throw new Error('Item não encontrado: '+o.id);
      if(o.op==='update'&&(!o.data||typeof o.data!=='object'))throw new Error('Editar: dados inválidos.');return Object.assign({},o,{_r:r});}
    throw new Error('Operação desconhecida: '+o.op);
  });
}
function chatLine(o){
  const d=o.data||{};const nm=x=>x?(x.creditor||x.name||x.bank||x.text||x.cfg||x.desc||x.kind||''):'';
  if(o.op==='create')return 'CRIAR '+o.kind+': '+nm(d)+' '+JSON.stringify(d).slice(0,140);
  if(o.op==='update')return 'EDITAR '+o._r.kind+' “'+nm(o._r.data)+'”: '+JSON.stringify(d).slice(0,140);
  return 'APAGAR '+o._r.kind+' “'+nm(o._r.data)+'”';
}
async function chatApply(ops){
  let n=0;
  for(const o of ops){
    if(o.op==='create')await Api.create(o.kind,o.data);
    else if(o.op==='update')await Api.update(o._r,Object.assign({},o._r.data,o.data));
    else await Api.remove(o._r);
    n++;
  }
  return n;
}

    BK.msg=l?'Último backup automático: '+bkWhen(l.taken_at)+' ('+l.n_items+' itens).':'Ainda não há backup automático. O primeiro é feito de madrugada.';
  }catch(e){BK.msg='Não consegui conferir o backup agora. Veja a internet.';}

async function bkDown(){
  if(!await confirmBox('Baixar o último backup?',['Vai salvar um arquivo com os seus dados do Núcleo e do FIN.','Ele tem informação financeira: guarde em lugar seguro.'],'Sim, baixar'))return;
  let b;
  try{
    const r=await Api.rest('backups?select=data,taken_at&order=taken_at.desc&limit=1');
    if(!r.ok)throw new Error('erro '+r.status);
    b=(await r.json())[0];
  }catch(e){await info('Não consegui baixar','Sem internet ou o banco não respondeu. Nada foi alterado.');return;}
  if(!b){await info('Ainda não há backup','O primeiro backup automático é feito de madrugada. Você pode tocar em Fazer backup agora.');return;}
  const text=JSON.stringify(b.data,null,1),nome='FIN-Nucleo-backup-automatico-'+isoDate(new Date(b.taken_at))+'.json';
  try{
    const file=new File([text],nome,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  }catch(e){if(e&&e.name==='AbortError')return;await info('Não consegui salvar o arquivo','Tente de novo.');}
}

async function baixarCopia(){
  if(!await confirmBox('Baixar uma cópia?',['Vai salvar um arquivo com todos os seus dados do FIN, inclusive os apagados.','Ele tem informação financeira: guarde em lugar seguro.'],'Sim, baixar'))return;
  let recs;
  try{
    const r=await Api.rest('fin_records?select=*&order=created_at.asc&limit=5000');
    if(!r.ok)throw new Error('erro '+r.status);
    recs=await r.json();
  }catch(e){await info('Não consegui baixar','Sem internet ou o banco não respondeu. Tente de novo. Nada foi alterado.');return;}
  const now=new Date();
  const nome='FIN-copia-'+isoDate(now)+'.json';
  const txt=backupJson(recs,now);
  try{
    const file=new File([txt],nome,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  }catch(e){
    if(e&&e.name==='AbortError')return; /* fechou a janela de compartilhar: não conta como cópia feita */
    await info('Não consegui salvar o arquivo','Tente de novo.');return;
  }
  lsSet(BKP_KEY,now.toISOString());
  await info('Cópia pronta','Foram '+recs.length+' registros. Guarde o arquivo '+nome+' em Arquivos, iCloud ou Drive.');
  render();
}

  else if(act==='sort-open')sortOpenPage();
  else if(act==='bill-new')billForm(null);
  else if(act==='bill-read')lerDocModal();
  else if(act==='bill-edit')billForm(get(id));
  else if(act==='bill-open'){const r=get(id);billMonthForm({r,bill:get(r.data.billId)});}
  else if(act==='card-new')cardForm(null);
  else if(act==='card-edit')cardForm(get(id));
  else if(act==='card'){S.cardId=id;S.tab='cards';S.invYm=null;render();window.scrollTo(0,0);}
  else if(act==='inv'){S.invYm=b.dataset.ym;render();}
  else if(act==='charge-new')chargeForm(get(id),null);
  else if(act==='charge-edit'){const r=get(id);chargeForm(get(r.data.cardId),r);}
  else if(act==='inv-pay'){
    const cr=get(S.cardId),ym=b.dataset.ym,ex=byKind('invpay').find(x=>x.data.cardId===cr.id&&x.data.ym===ym);
    const k=cardCalc(cr).inv[ym];
    if(await confirmBox(ex?'Desfazer “fatura paga”?':'Marcar fatura como paga?',[cr.data.name+' · '+ymLabel(ym),'Total: '+money(k.totalC),ex?'O valor volta a ocupar o limite.':'O valor sai do limite usado. O FIN não paga nada.'],'Sim')){
      try{if(ex)await Api.remove(ex);else await Api.create('invpay',{cardId:cr.id,ym});}catch(e){S.msg=e.message;}render();}
  }
  else if(act==='debt-new')debtForm(null);
  else if(act==='debt-edit')debtForm(get(id));
});

/* ---------- entrada ---------- */
function loginScreen(msg){
  let el=$('lg');if(!el){el=document.createElement('div');el.id='lg';document.body.appendChild(el);}
  el.style.cssText='position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:1.5rem;overflow:auto';
  el.innerHTML='<div style="max-width:28rem;width:100%;margin:0 auto"><h1>FIN</h1><p>Entre com o mesmo e-mail e a mesma senha do Núcleo.</p>'
    +'<label class="f" for="lg-mail">E-mail</label><input class="in" id="lg-mail" type="email" autocomplete="username" autocapitalize="off">'
    +'<label class="f" for="lg-pass">Senha</label><input class="in" id="lg-pass" type="password" autocomplete="current-password">'
    +'<div class="err" id="lg-err" role="alert">'+esc(msg||'')+'</div><button class="btn" id="lg-go">Entrar</button></div>';
  const go=async()=>{
    const bt=$('lg-go'),er=$('lg-err');bt.disabled=true;bt.textContent='Entrando…';er.textContent='';
    try{Api.saveSess(await Api.auth('token?grant_type=password',{email:$('lg-mail').value.trim(),password:$('lg-pass').value}));el.remove();await start();}
    catch(x){bt.disabled=false;bt.textContent='Entrar';er.textContent=(x.status>=400&&x.status<500)?'E-mail ou senha incorretos.':'Sem conexão. Tente de novo.';}
  };
  $('lg-go').onclick=go;$('lg-pass').onkeydown=e=>{if(e.key==='Enter')go();};
}
function setupMissing(){
  $('app').innerHTML=header('FIN')+'<div class="wrap"><div class="card"><b>Falta uma preparação única no banco.</b><p>A tabela do FIN ainda não existe no Supabase. Rode o arquivo <b>supabase/005_fin.sql</b> no SQL Editor (uma vez só) e abra o FIN de novo.</p></div><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
}
async function start(){
  try{S.sess=JSON.parse(lsGet('fin-sess')||'null');}catch(e){S.sess=null;}
  fsApply();
  lkInit();
  if(!S.sess){loginScreen();return;}
  try{const c=JSON.parse(lsGet('fin-cache')||'[]');if(Array.isArray(c))S.recs=c;}catch(e){}
  S.ready=true;render();
  try{
    await Api.load();
    ordPull();
    await ensureMonth();
  }catch(e){
    if(e.status===401){loginScreen('Entre de novo.');return;}
    if(e.status===404||e.code==='PGRST205'||e.code==='42P01'){setupMissing();return;}
    S.msg='Sem internet. Mostrando o que está guardado neste aparelho.';
  }
  render();
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready&&!document.querySelector('.modal')){Api.load().then(()=>{ordPull();render();}).catch(()=>{});}});
roInit();
start();
</script>
<script>
/* Voltar sempre à mão: com a tela ampliada (zoom), o botão de voltar da própria tela pode sair da área visível.
   Nesse caso aparece este botão flutuante, preso à parte visível da tela, e ele aciona o voltar da tela de cima. */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const fab=document.createElement('button');
  fab.type='button';fab.id='backFab';fab.setAttribute('aria-label','Voltar');fab.textContent='← Voltar';
  fab.style.cssText='position:fixed;left:0;top:0;z-index:2147483000;display:none;min-height:3.4rem;padding:0 1.4rem;font:inherit;font-size:1.2rem;font-weight:800;border:0;border-radius:1rem;background:#ffd60a;color:#000;box-shadow:0 6px 20px rgba(0,0,0,.55);transform-origin:0 0';
  document.body.appendChild(fab);
  function alvo(){
    const m=document.querySelectorAll('.modal');
    if(m.length){const mm=m[m.length-1];return mm.querySelector('button.sec')||mm.querySelector('button');}
    const l=document.querySelectorAll('#app [data-back]');return l.length?l[l.length-1]:null;
  }
  function pos(){
    const a=vv.scale>1.05?alvo():null;
    if(!a){fab.style.display='none';return;}
    fab.style.display='block';
    fab.style.transform='translate('+(vv.offsetLeft+8/vv.scale)+'px,'+(vv.offsetTop+8/vv.scale)+'px) scale('+(1/vv.scale)+')';
  }
  vv.addEventListener('resize',pos);vv.addEventListener('scroll',pos);setInterval(pos,500);
  fab.addEventListener('click',e=>{e.preventDefault();const a=alvo();if(a)a.click();setTimeout(pos,50);});
})();
</script>
